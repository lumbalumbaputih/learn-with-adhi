<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas – Apakah efek CO2 sudah jenuh?</h1><p>Ada kabar bahwa CO2 sudah jenuh, jadi tambahan CO2 tidak menambah panas. Itu keliru. CO2 tidak seperti kain pel yang penuh air: ia terus menyerap dan melepas panas, jadi makin banyak CO2 tetap membuat Bumi makin hangat.</p><p><a href="https://skepticalscience.com/at-a-glance-saturate.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-saturate", "fb": false, "date": "9 January 2024", "byline": "John Mason, BaerbelW", "url": "https://skepticalscience.com/at-a-glance-saturate.html", "words": 1079, "topic": "cause", "title": {"en": "At a glance - Is the CO2 effect saturated?", "id": "Sekilas – Apakah efek CO2 sudah jenuh?"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-saturate/100e1293cc.webp", "w": 570, "hh": 347, "alt": "FactMythBox"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "This myth relies on the use (or in fact misuse) of a particular word – 'saturated'. When someone comes in from a prolonged downpour, they may well exclaim that they are saturated. They cannot imagine being any wetter. That's casual usage, though.", "id": "Mitos ini bergantung pada penggunaan (atau bahkan penyalahgunaan) kata tertentu – 'jenuh'. Ketika seseorang datang dari hujan yang berkepanjangan, mereka mungkin akan berseru bahwa mereka sudah jenuh. Mereka tidak bisa membayangkan menjadi lebih basah. Tapi itu penggunaan biasa."}}, {"t": "p", "h": {"en": "In science, 'saturated' is a strictly-defined term. For example, in a saturated salt solution, no more salt will dissolve, period. But what's that got to do with heat transfer in Earth's atmosphere? Let's take a look.", "id": "Dalam sains, 'jenuh' adalah istilah yang didefinisikan secara ketat. Misalnya, dalam larutan garam jenuh, tidak ada lagi garam yang larut, titik. Tapi apa hubungannya dengan perpindahan panas di atmosfer bumi? Mari kita lihat."}}, {"t": "p", "h": {"en": "Heat-trapping by CO₂ in the atmosphere happens because it has the ability to absorb and pass on infra-red radiation – it is a 'greenhouse gas'. Infra-red is just one part of the electromagnetic spectrum, divided by physicists into a series of bands. From the low-frequency end of the spectrum upwards, the bands are as follows: radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, and gamma rays. Gamma rays thus have a very high-frequency. They are the highest-energy form of radiation.", "id": "Terperangkapnya panas oleh CO₂ di atmosfer terjadi karena CO memiliki kemampuan untuk menyerap dan meneruskan radiasi infra-merah – yang merupakan 'gas rumah kaca'. Infra-merah hanyalah salah satu bagian dari spektrum elektromagnetik, yang dibagi oleh fisikawan menjadi serangkaian pita. Dari ujung spektrum frekuensi rendah ke atas, pita-pitanya adalah sebagai berikut: gelombang radio, gelombang mikro, inframerah, cahaya tampak, ultraviolet, sinar-X, dan sinar gamma. Sinar gamma dengan demikian mempunyai frekuensi yang sangat tinggi. Mereka adalah bentuk radiasi dengan energi tertinggi."}}, {"t": "p", "h": {"en": "As our understanding of the electromagnetic spectrum developed, it was realised that the radiation consists of particles called 'photons', travelling in waves. The term was coined in 1926 by the celebrated physicist Gilbert Lewis (1875-1946). A photon's energy is related to its wavelength. The shorter the wavelength, the higher the energy, so that the very high-energy gamma-rays have the shortest wavelength of the lot.", "id": "Seiring berkembangnya pemahaman kita tentang spektrum elektromagnetik, disadari bahwa radiasi terdiri dari partikel yang disebut 'foton', yang bergerak dalam gelombang. Istilah ini diciptakan pada tahun 1926 oleh fisikawan terkenal Gilbert Lewis (1875-1946). Energi foton berhubungan dengan panjang gelombangnya. Semakin pendek panjang gelombangnya, semakin tinggi energinya, sehingga sinar gamma berenergi sangat tinggi mempunyai panjang gelombang terpendek."}}, {"t": "p", "h": {"en": "Sunshine consists mostly of ultraviolet, visible light and infra-red photons. Objects warmed by the sun then re-emit energy photons at infra-red wavelengths. Like other greenhouse gases, CO2 has the ability to absorb infra-red photons. But CO₂ is unlike a mop, which has to be wrung out regularly in order for it to continue working. CO₂ molecules do not get filled up with infra-red photons. Not only do they emit their own infra-red photons, but also they are constantly colliding with neighbouring molecules in the air. The constant collisions are important. Every time they happen, energy is shared out between the colliding molecules.", "id": "Sinar matahari sebagian besar terdiri dari ultraviolet, cahaya tampak dan foton infra-merah. Benda-benda yang dihangatkan oleh matahari kemudian memancarkan kembali foton energi pada panjang gelombang inframerah. Seperti gas rumah kaca lainnya, CO2 memiliki kemampuan menyerap foton infra merah. Namun CO₂ tidak seperti kain pel yang harus diperas secara teratur agar dapat terus bekerja. Molekul CO₂ tidak terisi oleh foton infra-merah. Mereka tidak hanya memancarkan foton infra merahnya sendiri, tetapi juga terus-menerus bertabrakan dengan molekul tetangganya di udara. Tabrakan terus-menerus itu penting. Setiap kali hal ini terjadi, energi dibagi antara molekul-molekul yang bertabrakan."}}, {"t": "p", "h": {"en": "Through those emissions and collisions, CO₂ molecules constantly warm their surroundings. This goes on all the time and at all levels in the atmosphere. You cannot say, “CO2 is saturated because the surface-emitted IR is rapidly absorbed”, because you need to take into account the whole atmosphere and its constant, ongoing energy-exchange processes. That means taking into account all absorption, all re-emission, all collisions, all heating and cooling and all eventual loss to space, at all levels.", "id": "Melalui emisi dan tumbukan tersebut, molekul CO₂ terus-menerus menghangatkan lingkungannya. Hal ini berlangsung sepanjang waktu dan di semua tingkat atmosfer. Anda tidak bisa mengatakan, “CO2 jenuh karena IR yang dipancarkan permukaan diserap dengan cepat”, karena Anda perlu memperhitungkan keseluruhan atmosfer dan proses pertukaran energi yang konstan dan berkelanjutan. Hal ini berarti memperhitungkan semua penyerapan, semua emisi ulang, semua tumbukan, semua pemanasan dan pendinginan, dan semua kehilangan ruang, di semua tingkatan."}}, {"t": "p", "h": {"en": "If the amount of radiation lost to space is equal to the amount coming in from the Sun, Earth is said to be in energy balance. But if the strength of the greenhouse effect is increased, the amount of energy escaping falls behind the amount that is incoming. Earth is then said to be in an energy imbalance and the climate heats up. Double the CO₂ concentration and you get a few degrees of warming: double it again and you get a few more and on and on it goes. There is no room for complacency here. By the time just one doubling has occurred, the planet would already be unrecognisable. The insulation analogy in the myth is misleading because it over-simplifies what happens in the atmosphere.", "id": "Jika jumlah radiasi yang hilang ke luar angkasa sama dengan jumlah radiasi yang masuk dari Matahari, maka Bumi dikatakan berada dalam keseimbangan energi. Namun jika kekuatan efek rumah kaca ditingkatkan, jumlah energi yang keluar akan lebih sedikit dibandingkan dengan jumlah energi yang masuk. Bumi kemudian dikatakan berada dalam ketidakseimbangan energi dan iklim memanas. Gandakan konsentrasi CO₂ dan Anda akan mendapatkan beberapa derajat pemanasan: gandakan lagi dan Anda akan mendapatkan lebih banyak lagi dan seterusnya. Tidak ada ruang untuk berpuas diri di sini. Ketika penggandaan pertama kali terjadi, planet ini sudah tidak dapat dikenali lagi. Analogi isolasi dalam mitos tersebut menyesatkan karena terlalu menyederhanakan apa yang terjadi di atmosfer."}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/saturated-co2-effect-basic.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/
