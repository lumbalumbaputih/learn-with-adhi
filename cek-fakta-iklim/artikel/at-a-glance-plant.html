<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas – Tumbuhan tidak bisa hidup hanya dengan CO2</h1><p>Tanaman memang butuh CO2, tapi juga butuh tanah yang subur, air, dan unsur hara. Tambahan CO2 saja tidak membuat panen lebih baik, apalagi kalau cuaca makin panas dan kering.</p><p><a href="https://skepticalscience.com/at-a-glance-plant.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-plant", "fb": false, "date": "2 January 2024", "byline": "John Mason, BaerbelW", "url": "https://skepticalscience.com/at-a-glance-plant.html", "words": 934, "topic": "hoax", "title": {"en": "At a glance - Plants cannot live on CO2 alone", "id": "Sekilas – Tumbuhan tidak bisa hidup hanya dengan CO2"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-plant/2565084df6.webp", "w": 570, "hh": 366, "alt": "Fact-Myth-Box"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "Have you ever tried growing vegetables in a container? If you are a newbie who wants to give it a try, you will quickly become familiar with the following point. With many species and varieties, it's a lot easier to grow them in a well-tended bed than in a bucket.", "id": "Pernahkah Anda mencoba menanam sayuran dalam wadah? Jika Anda seorang pemula yang ingin mencobanya, Anda akan segera memahami poin berikut. Dengan banyaknya spesies dan varietas, jauh lebih mudah menanamnya di bedengan yang terawat baik daripada di dalam ember."}}, {"t": "p", "h": {"en": "Most vegetables grow best in a bed of mature, nutrient rich soil that has had regular addition of compost over the years. The only things you need to do are watering them when it's dry and picking off the slugs. But in a bucket, even with a lot of compost from the garden centre, plants often struggle without the help of regular feeds of liquid additives to boost things along. Such feeds include various nitrogen compounds, phosphorus, potassium, iron, zinc and other essential trace-metals.", "id": "Kebanyakan sayuran tumbuh paling baik di tanah yang matang dan kaya nutrisi yang telah diberi kompos secara teratur selama bertahun-tahun. Satu-satunya hal yang perlu Anda lakukan adalah menyiramnya saat sudah kering dan membuang siputnya. Namun di dalam ember, bahkan dengan banyak kompos dari pusat kebun, tanaman sering kali kesulitan tanpa bantuan bahan tambahan cair secara teratur untuk meningkatkan kualitasnya. Pakan tersebut mencakup berbagai senyawa nitrogen, fosfor, kalium, besi, seng, dan logam penting lainnya."}}, {"t": "p", "h": {"en": "The purists among us prefer not to expend hard-earned cash on such feeds because they are expensive - defeating the whole object of grow-your-own which is to produce good vegetables cheaply. Managing that precious commodity, topsoil, so that it is productive year upon year is what we do instead. To be a successful gardener, looking after your soil is probably the most important skill to gain and apply.", "id": "Para penganut paham puritan di antara kita memilih untuk tidak mengeluarkan uang hasil jerih payah mereka untuk membeli pakan tersebut karena harganya yang mahal - mengalahkan tujuan dari menanam sendiri, yaitu menghasilkan sayur-sayuran berkualitas dengan harga murah. Mengelola komoditas berharga tersebut, yaitu tanah lapisan atas, agar produktif dari tahun ke tahun adalah hal yang kami lakukan. Untuk menjadi tukang kebun yang sukses, merawat tanah mungkin merupakan keterampilan paling penting yang harus diperoleh dan diterapkan."}}, {"t": "p", "h": {"en": "But what about the person who thinks like the myth-provider in the box above? They seem to know about photosynthesis. Photosynthesis is the process by which plants extract carbon dioxide from the atmosphere and, using the energy received from sunlight, make it react with water in their cells. The products of that reaction are sugar and oxygen. Oxygen is released back to the atmosphere and the plants stash away the reserves of sugar within their stems, tubers or roots, depending on the species. But our myth-provider seems to think that because photosynthesis only requires CO₂ and water, then high levels of both are all that's required for happy plants. How will their garden grow?", "id": "Namun bagaimana dengan orang yang berpikiran seperti pemberi mitos pada kotak di atas? Mereka sepertinya tahu tentang fotosintesis. Fotosintesis adalah proses dimana tumbuhan mengekstraksi karbon dioksida dari atmosfer dan, menggunakan energi yang diterima dari sinar matahari, membuatnya bereaksi dengan air di dalam selnya. Produk dari reaksi tersebut adalah gula dan oksigen. Oksigen dilepaskan kembali ke atmosfer dan tanaman menyimpan cadangan gula di dalam batang, umbi atau akar, tergantung spesiesnya. Namun penganut mitos kita tampaknya berpikir bahwa karena fotosintesis hanya membutuhkan CO₂ dan air, maka keduanya diperlukan dalam jumlah tinggi untuk membuat tanaman bahagia. Bagaimana kebun mereka akan tumbuh?"}}, {"t": "p", "h": {"en": "Well, basically they are going to find their attempt to grow vegetables immensely frustrating. Increasing the plants' CO₂ supply alone and ignoring all the other essential compounds for plant health is a shortcut to unhealthy crops - if they produce any appreciable crop at all. That's the difference between being a good gardener and a hopeless one. The good gardener acts on the basis of the whole big picture, not just one part of it.", "id": "Ya, pada dasarnya usaha mereka menanam sayur-sayuran akan membuat mereka frustrasi. Meningkatkan pasokan CO₂ tanaman saja dan mengabaikan semua senyawa penting lainnya bagi kesehatan tanaman adalah jalan pintas menuju tanaman yang tidak sehat - jika tanaman tersebut menghasilkan panen yang cukup besar. Itulah perbedaan antara menjadi seorang tukang kebun yang baik dan seorang yang putus asa. Tukang kebun yang baik bertindak atas dasar keseluruhan gambaran besarnya, bukan hanya satu bagian saja."}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/co2-plant-food-basic.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/co2-plant-food-basic.htm\">ini formulir<\/a> untuk memberikan masukan tentang bagian \"Sekilas\" yang baru ini. Baca versi yang lebih teknis di bawah atau gali lebih dalam melalui tab di atas!<\/em><\/strong><\/em>"}}, {"t": "hr"}, {"t": "h2", "h": {"en": "<a href=\"https://skepticalscience.com/co2-plant-food-basic.htm#FurtherDetails\">Click for Further details<\/a>", "id": "<a href=\"https://skepticalscience.com/co2-plant-food-basic.htm#FurtherDetails\">Klik untuk detail lebih lanjut<\/a>"}}, {"t": "p", "h": {"en": "In case you'd like to explore more of our recently updated rebuttals, here are the links to all of them:", "id": "Jika Anda ingin menjelajahi lebih jauh sanggahan kami yang baru-baru ini diperbarui, berikut tautan ke semuanya:"}}, {"t": "p", "h": {"en": "<strong>Myths with link to rebuttal<\/strong> <strong>Short URLs<\/strong> <a href=\"https://sks.to/1970s\">Ice age predicted in the 1970s<\/a> sks.to/1970s <a href=\"https://sks.to/1998\">It hasn't warmed since 1998<\/a> sks.to/1998 <a href=\"https://sks.to/antarctica\">Antarctica is gaining ice<\/a> sks.to/antarctica <a href=\"https://sks.to/climategate\">CRU emails suggest conspiracy<\/a> sks.to/climategate <a href=\"https://sks.to/hockey\">What evidence is there for the hockey stick<\/a> sks.to/hockey <a href=\"https://sks.to/lag\">CO₂ lags temperature<\/a> sks.to/lag <a href=\"https://sks.to/past\">Climate's changed before<\/a> sks.to/past <a href=\"https://sks.to/sun\">It's the sun<\/a> sks.to/sun <a href=\"https://sks.to/temp\">Temperature records are unreliable<\/a> sks.to/temp <a href=\"https://sks.to/thermo\">The greenhouse effect and the 2nd law of thermodynamics<\/a> sks.to/thermo <a href=\"https://sks.to/iceage\">We're heading into an ice age<\/a> sks.to/iceage <a href=\"https://sks.to/impacts\">Positives and ne ://sks.to/past\">Iklim berubah sebelum<\/a> sks.to/past <a href=\"https://sks.to/sun\">Ini matahari<\/a> sks.to/sun <a href=\"https://sks.to/temp\">Suhu catatan tidak dapat diandalkan<\/a> sks.to/temp <a href=\"https://sks.to/thermo\">Efek rumah kaca dan hukum ke-2 termodinamika<\/a> sks.to/thermo <a href=\"https://sks.to/iceage\">Kita sedang menuju zaman es<\/a> sks.to/iceage <a href=\"https://sks.to/impacts\">Positif dan negatif global pemanasan<\/a> sks.to/impacts <a href=\"https://sks.to/cooling\">Pendinginan global - Apakah pemanasan global masih terjadi?<\/a> sks.to/cooling <a href=\"https://sks.to/model\">Seberapa andalkah model iklim?<\/a> sks.to/model <a href=\"https://sks.to/species\">Dapatkah hewan dan tumbuhan beradaptasi terhadap pemanasan global?<\/a> sks.to/species <a href=\"https://sks.to/cosmic\">Apa hubungan antara sinar kosmik dan perubahan iklim?<\/a> sks.to/cosmic <a href=\"https://sks.to/gore\">Apakah An Inconvenient Truth karya Al Gore akurat?<\/a> sks.to/gore <a href=\"https://sks.to/glacier\">Apakah gletser bertambah atau menyusut?<\/a> sks.to/glacier <a href=\"https://sks.to/acid\">Pengasaman laut: kembaran jahat pemanasan global<\/a> sks.to/acid <a href=\"https://sks.to/agw\">Sidik jari manusia dalam pemanasan global<\/a> sks.to/agw <a href=\"https://sks.to/evidence\">Bukti empiris bahwa manusia menyebabkan pemanasan global<\/a> sks.to/evidence <a href=\"https://sks.to/greenhouse\">Bagaimana kita mengetahui lebih banyak CO₂ yang menyebabkan pemanasan?<\/a> sks.to/greenhouse <a href=\"https://sks.to/vapor\">Menjelaskan cara kerja efek rumah kaca uap air<\/a> sks.to/vapor <a href=\"https://sks.to/OISM\">Trik yang digunakan oleh OISM yang cacat Proyek Petisi untuk meragukan konsensus ilmiah tentang perubahan iklim<\/a> sks.to/OISM <a href=\"https://sks.to/extreme\">Apakah cuaca ekstrem disebabkan oleh pemanasan global?<\/a> sks.to/extreme <a href=\"https://sks.to/trace\">Bagaimana zat dalam jumlah kecil dapat menyebabkan dampak besar<\/a> sks.to/trace <a href=\"https://sks.to/sealevel\">Berapa besarnya laut tingkat kenaikan?<\/a> sks.to/sealevel <a href=\"https://sks.to/pollutant\">Apakah CO₂ merupakan polutan?<\/a> sks.to/pollutant <a href=\"https://sks.to/cold\">Apakah cuaca dingin menyangkal pemanasan global?<\/a> sks.to/cold <a href=\"https://sks.to/volcano\">Apakah gunung berapi mengeluarkan lebih banyak emisi? CO₂ dibandingkan manusia?<\/a> sks.to/volcano <a href=\"https://sks.to/co2\">Bagaimana emisi CO₂ manusia dibandingkan dengan emisi CO2 alami?<\/a> sks.to/co2 <a href=\"https://sks.to/money\">Ilmuwan iklim bisa menghasilkan lebih banyak uang di karier lain<\/a> sks.to/money <a href=\"https://sks.to/co2data\">Seberapa andal pengukuran CO₂?<\/a> sks.to/co2data <a href=\"https://sks.to/pastco2\">Apakah kadar CO₂ yang tinggi di masa lalu bertentangan dengan efek pemanasan CO₂?<\/a> sks.to/pastco2 <a href=\"https://sks.to/cloud\">Apa yang dimaksud dengan pengukuran CO₂? masukan bersih tentang awan?<\/a> sks.to/cloud <a href=\"https://sks.to/name\">Pemanasan global vs perubahan iklim<\/a> sks.to/name <a href=\"https://sks.to/mars\">Apakah Mars memanas?<\/a> sks.to/mars <a href=\"https://sks.to/underestimat\">Bagaimana IPCC cenderung meremehkan respons iklim<\/a> sks.to/underestimat <a href=\"https://sks.to/sensitivity\">Seberapa sensitif iklim kita?<\/a> sks.to/sensitivity <a href=\"https://sks.to/warming\">Bukti pemanasan global<\/a> sks.to/warming <a href=\"https://sks.to/falsify\">Apakah efek rumah kaca telah dipalsukan?<\/a> sks.to/falsify <a href=\"https://sks.to/breath\">Apakah pernapasan berkontribusi terhadap penumpukan CO2<\/sub> di atmosfer?<\/a> sks.to/breath <a href=\"https://sks.to/CO2increase\">Apa yang menyebabkan peningkatan CO2 di atmosfer?<\/a> sks.to/CO2increase <a href=\"https://sks.to/methane\">Apa kontribusi metana terhadap global pemanasan?<\/a> sks.to/methane <a href=\"https://sks.to/plant\">Tanaman tidak bisa hidup hanya dengan CO2<\/a> sks.to/plant"}}], "intinya": {"id": "Tanaman memang butuh CO2, tapi juga butuh tanah yang subur, air, dan unsur hara. Tambahan CO2 saja tidak membuat panen lebih baik, apalagi kalau cuaca makin panas dan kering.", "en": "Plants need CO2, but also fertile soil, water and nutrients. Extra CO2 alone doesn't mean better harvests, especially as weather gets hotter and drier."}, "kw": "tanaman makanan pupuk panen"};</script>
