. First-year ice grows and shrinks with the seasons and fluctuations in ocean currents and wind patterns.", "id": "Ada dua jenis es laut: es tipis “tahun pertama” dan es tebal “bertahun-tahun”. Es tahun pertama tumbuh dan menyusut seiring musim dan fluktuasi arus laut dan pola angin."}}, {"t": "p", "h": {"en": "These short-term ups and downs do not change the decline of multi-year ice. Satellite records since 1979 show continued loss in both extent and volume of multi-year ice.", "id": "Naik turunnya es dalam jangka pendek ini tidak mengubah penurunan es yang terjadi selama bertahun-tahun. Catatan satelit sejak tahun 1979 menunjukkan terus hilangnya luas dan volume es selama bertahun-tahun."}}, {"t": "p", "h": {"en": "Since that year, June ice extent loss has totaled more than 3 million square kilometers, nearly twice the size of Alaska.", "id": "Sejak tahun itu, luas es yang hilang pada bulan Juni telah mencapai lebih dari 3 juta kilometer persegi, hampir dua kali luas Alaska."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/arctic\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/has-arctic-sea-ice-recovered/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/arctic\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/has-arctic-sea-ice-recovered/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://archive.ph/D7AX7\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.ph/D7AX7\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Es laut Arktik sudah pulih.", "en": "Arctic sea ice has recovered."}, "fakta": {"id": "Es laut Arktik terus berkurang, baik luas maupun ketebalannya. Maret 2025 mencatat luas maksimum terendah.", "en": "Arctic sea ice keeps shrinking in area and thickness. March 2025 set a record-low maximum."}, "kw": "es arktik k
