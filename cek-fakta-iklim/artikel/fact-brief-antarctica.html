an bersih, yang mengakibatkan peningkatan signifikan jumlah air tawar yang mengalir ke laut. Hal ini memang mempengaruhi permukaan laut global."}}, {"t": "p", "h": {"en": "The behavior of Antarctic land ice varies from region to region. In particular, the West Antarctic Peninsula has seen drastic ice retreat. On the other hand, East Antarctica's land ice has remained relatively stable to date. But if global warming crosses a specific threshold, serious loss is expected to occur. The planet has already moved a third of the way towards that threshold and will pass it within a century, if fossil fuel burning continues unabated.", "id": "Perilaku daratan es Antartika bervariasi dari satu wilayah ke wilayah lainnya. Secara khusus, Semenanjung Antartika Barat telah mengalami penyusutan es secara drastis. Di sisi lain, daratan es Antartika Timur relatif stabil hingga saat ini. Namun jika pemanasan global melewati ambang batas tertentu, kerugian besar diperkirakan akan terjadi. Bumi sudah sepertiga dari ambang batas tersebut dan akan melampauinya dalam waktu satu abad, jika pembakaran bahan bakar fosil terus berlanjut."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/antarctica\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-antarctica-gaining-land-ice\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/antarctica\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-antarctica-gaining-land-ice\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://archive.ph/RFOWWl\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.ph/RFOWWl\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Es di daratan Antartika bertambah.", "en": "Antarctica is gaining land ice."}, "fakta": {"id": "Es laut di sekitar Antartika memang naik-turun setiap musim, tap
