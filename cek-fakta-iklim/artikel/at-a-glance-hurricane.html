<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas – Apa hubungan antara badai dan pemanasan global?</h1><p>Badai tropis mendapat tenaga dari laut yang hangat. Karena laut makin panas, badai yang terkuat bisa makin kuat dan membawa lebih banyak hujan. Artikel ini menjelaskan cara badai terbentuk dengan bahasa sehari-hari.</p><p><a href="https://skepticalscience.com/at-a-glance-hurricane.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-hurricane", "fb": false, "date": "28 May 2024", "byline": "John Mason, BaerbelW, Ken Rice", "url": "https://skepticalscience.com/at-a-glance-hurricane.html", "words": 1227, "topic": "disaster", "title": {"en": "At a glance - What is the link between hurricanes and global warming?", "id": "Sekilas – Apa hubungan antara badai dan pemanasan global?"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-hurricane/967eddda9b.webp", "w": 570, "hh": 294, "alt": "Fact-Myth-Box"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "Hurricanes, Cyclones or Typhoons. These are traditional terms for near-identical weather-systems. The furious storms that affect the tropics have a fearsome reputation for the havoc they bring. Such storms are driven by the heat of the tropical oceans, where sea surface temperatures vary by just a few degrees Celsius and are almost always in the high twenties. Hurricane formation can only take place at such temperatures.", "id": "Badai, Topan, atau Topan. Ini adalah istilah tradisional untuk sistem cuaca yang hampir identik. Badai hebat yang melanda daerah tropis mempunyai reputasi yang menakutkan atas dampak buruk yang ditimbulkannya. Badai semacam ini disebabkan oleh panasnya lautan tropis, dimana suhu permukaan laut bervariasi hanya beberapa derajat Celsius dan hampir selalu berada di angka dua puluhan. Pembentukan badai hanya dapat terjadi pada suhu seperti itu."}}, {"t": "p", "h": {"en": "In the Atlantic, for example, a tropical storm-system begins life as a developing wave of low pressure tracking westwards out of Africa. Offshore in the tropical Atlantic, the warmth of the ocean's surface drives intense evaporation. That warmth and moisture provide the fuel for thunderstorm development.", "id": "Di Atlantik, misalnya, sistem badai tropis mulai terbentuk sebagai gelombang bertekanan rendah yang berkembang dan bergerak ke arah barat hingga keluar Afrika. Di lepas pantai Atlantik tropis, kehangatan permukaan laut mendorong penguapan yang intens. Kehangatan dan kelembapan tersebut menjadi bahan bakar terjadinya badai petir."}}, {"t": "p", "h": {"en": "Most such waves simply carry clusters of disorganised showers and thunderstorms. But in some, the storms organise into rain-bands. Once that happens, low-level warm and moist air floods in towards the low pressure centre from all compass points. But it does so in an inward spiralling motion. Why? That's due to the Coriolis Effect. Because the Earth rotates, circulating air is deflected to the right in the Northern Hemisphere, resulting in a curved path. In the Southern Hemisphere the air is deflected to the left. The effect is named after the French mathematician Gaspard Gustave de Coriolis (1792-1843), who studied energy transfer in rotating mechanical systems, such as waterwheels.", "id": "Sebagian besar gelombang tersebut hanya membawa kumpulan hujan dan badai petir yang tidak teratur. Namun di beberapa wilayah, badai membentuk pita hujan. Setelah itu terjadi, udara hangat dan lembab tingkat rendah membanjiri pusat tekanan rendah dari semua titik kompas. Namun ia melakukannya dengan gerakan berputar ke dalam. Mengapa? Itu karena Efek Coriolis. Karena bumi berputar, sirkulasi udara di belahan bumi utara dibelokkan ke kanan sehingga menghasilkan jalur yang melengkung. Di belahan bumi selatan, udara dibelokkan ke kiri. Nama efek ini diambil dari nama ahli matematika Perancis Gaspard Gustave de Coriolis (1792-1843), yang mempelajari transfer energi dalam sistem mekanik yang berputar, seperti kincir air."}}, {"t": "p", "h": {"en": "The other essential ingredient required to form and keep a hurricane going is low wind shear. Wind shear is defined as winds blowing at different speeds and in different directions at different heights in the Troposphere - the lower part of our atmosphere where weather occurs. For a hurricane, wind-shear of less than 10 knots from the surface to the high troposphere is perfect.", "id": "Unsur penting lainnya yang diperlukan untuk membentuk dan menjaga badai tetap berlangsung adalah pergeseran angin rendah. Geser angin didefinisikan sebagai angin yang bertiup dengan kecepatan berbeda dan arah berbeda pada ketinggian berbeda di Troposfer - bagian bawah atmosfer tempat terjadinya cuaca. Untuk badai, pergeseran angin kurang dari 10 knot dari permukaan ke troposfer tinggi adalah kondisi yang sempurna."}}, {"t": "p", "h": {"en": "With those ingredients in place, an organised cluster of thunderstorms may spin up into a tropical depression. If conditions favour further development, a tropical storm will form and then strengthen into a hurricane. A hurricane has a minimum constant wind speed of 119 kilometres per hour (74 mph). The most intense Category 5 storms have sustained winds of more than 252 kilometres per hour (157 mph). Highest winds are typically concentrated around the inner rainbands that surround the hurricane's eye.", "id": "Dengan adanya unsur-unsur tersebut, sekelompok badai petir yang terorganisir dapat berubah menjadi depresi tropis. Jika kondisi mendukung perkembangan lebih lanjut, badai tropis akan terbentuk dan kemudian menguat menjadi badai. Badai memiliki kecepatan angin konstan minimum 119 kilometer per jam (74 mph). Badai Kategori 5 yang paling hebat memiliki kecepatan angin lebih dari 252 kilometer per jam (157 mph). Angin tertinggi biasanya terkonsentrasi di sekitar pita hujan bagian dalam yang mengelilingi mata badai."}}, {"t": "p", "h": {"en": "So, given the above, what will a warmer world result in?", "id": "Jadi, jika kita mempertimbangkan hal-hal di atas, apa yang akan dihasilkan oleh dunia yang lebih hangat?"}}, {"t": "p", "h": {"en": "It's a bit of a mixture due to the number of variables involved. The number of storms reaching Category 3-5 intensity is considered to have increased over recent decades. That's because warmer sea surface temperatures give a storm more fuel. In contrast, the number of individual systems in a given year appears to have decreased although the jury's still out on that. But one thing is a lot more certain. Extreme rainfalls.", "id": "Ini sedikit campuran karena jumlah variabel yang terlibat. Jumlah badai yang mencapai intensitas Kategori 3-5 diperkirakan meningkat selama beberapa dekade terakhir. Hal ini terjadi karena suhu permukaan laut yang lebih hangat memberikan lebih banyak bahan bakar bagi badai. Sebaliknya, jumlah sistem individual pada tahun tertentu tampaknya mengalami penurunan meskipun belum ada kepastian mengenai hal tersebut. Tapi ada satu hal yang lebih pasti. Curah hujan ekstrem."}}, {"t": "p", "h": {"en": "There's a simple, memorable formula that describes how warmer air can carry more moisture: 7% more moisture per degree Celsius of temperature increase. Hurricanes already dump vast amounts of rain: in a warmer world that amount will only increase. Allowing further warming to take place simply makes an already bad situation worse.", "id": "Ada rumus sederhana dan mudah diingat yang menggambarkan bagaimana udara hangat dapat membawa lebih banyak kelembapan: 7% lebih banyak kelembapan per derajat Celcius kenaikan suhu. Badai telah menyebabkan curah hujan dalam jumlah besar: di dunia yang lebih hangat, jumlah tersebut akan semakin meningkat. Membiarkan pemanasan lebih lanjut hanya akan memperburuk situasi yang sudah buruk."}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/hurricanes-global-warming-basic.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/hurricanes-global-warming-basic.htm\">ini formulir<\/a> untuk memberikan masukan tentang bagian \"Sekilas\" yang baru ini. Baca versi yang lebih teknis di bawah atau gali lebih dalam melalui tab di atas!<\/em><\/strong><\/em>"}}, {"t": "hr"}, {"t": "h2", "h": {"en": "<a href=\"https://skepticalscience.com/hurricanes-global-warming-basic.htm#FurtherDetails\">Click for Further details<\/a>", "id": "<a href=\"https://skepticalscience.com/hurricanes-global-warming-basic.htm#FurtherDetails\">Klik untuk detail lebih lanjut<\/a>"}}, {"t": "p", "h": {"en": "In case you'd like to explore more of our recently updated rebuttals, here are the links to all of them:", "id": "Jika Anda ingin menjelajahi lebih jauh sanggahan kami yang baru-baru ini diperbarui, berikut tautan ke semuanya:"}}, {"t": "p", "h": {"en": "<strong>Myths with link to rebuttal<\/strong> <strong>Short URLs<\/strong> <a href=\"https://sks.to/1970s\">Ice age predicted in the 1970s<\/a> sks.to/1970s <a href=\"https://sks.to/1998\">It hasn't warmed since 1998<\/a> sks.to/1998 <a href=\"https://sks.to/antarctica\">Antarctica is gaining ice<\/a> sks.to/antarctica <a href=\"https://sks.to/climategate\">CRU emails suggest conspiracy<\/a> sks.to/climategate <a href=\"https://sks.to/hockey\">What evidence is there for the hockey stick<\/a> sks.to/hockey <a href=\"https://sks.to/lag\">CO₂ lags temperature<\/a> sks.to/lag <a href=\"https://sks.to/past\">Climate's changed before<\/a> sks.to/past <a href=\"https://sks.to/sun\">It's the sun<\/a> sks.to/sun <a href=\"https://sks.to/temp\">Temperature records are unreliable<\/a> sks.to/temp <a href=\"https://sks.to/thermo\">The greenhouse effect and the 2nd law of thermodynamics<\/a> sks.to/thermo <a href=\"https://sks.to/iceage\">We're heading into an ice age<\/a> sks.to/iceage <a href=\"https://sks.to/impacts\">Positives and negatives of global warming<\/a> sks.to/impacts <a href=\"https://sks.to/consensus\">The 97% consensus on g
