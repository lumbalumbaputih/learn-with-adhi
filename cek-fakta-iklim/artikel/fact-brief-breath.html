<main id="app" class="wrap" tabindex="-1"><noscript><h1>“Napas manusia ikut menambah CO2 di udara.”</h1><p><b>SALAH.</b> Faktanya: CO2 dari napas berasal dari makanan yang baru saja menyerap CO2 dari udara, jadi seimbang. Yang menambah CO2 adalah pembakaran bahan bakar fosil.</p><p><a href="https://skepticalscience.com/fact-brief-breath.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "fact-brief-breath", "fb": true, "date": "18 May 2024", "byline": "SkS-Team", "url": "https://skepticalscience.com/fact-brief-breath.html", "words": 338, "topic": "cause", "title": {"en": "Fact Brief - Does breathing contribute to CO2 buildup in the atmosphere?", "id": "Fakta Singkat - Apakah pernapasan berkontribusi terhadap penumpukan CO2 di atmosfer?"}, "verdict": "No", "question": {"en": "Does breathing contribute to CO2 buildup in the atmosphere?", "id": "Apakah pernapasan berkontribusi terhadap penumpukan CO2 di atmosfer?"}, "sources": [{"en": "MIT Climate Portal <a href=\"https://archive.ph/4hf0o\">Does the carbon dioxide that humans breathe out contribute to climate change?<\/a>"}, {"en": "US San Diego <a href=\"https://keelingcurve.ucsd.edu/\">The Keeling Curve<\/a>"}, {"en": "McGill University Office for Science and Society <a href=\"https://archive.is/uGTq9\">Why isn't the carbon dioxide from breathing a concern for global warming?<\/a>"}], "blocks": [{"t": "img", "src": "images/fact-brief-breath/50052fab45.webp", "w": 200, "hh": 59, "alt": "no"}, {"t": "p", "h": {"en": "The CO2 we breathe is part of a balanced carbon exchange between the air and the earth. In contrast, burning fossil fuels injects CO2 into the atmosphere that has been stored underground for millions of years, causing a rapid buildup.", "id": "CO2 yang kita hirup merupakan bagian dari pertukaran karbon yang seimbang antara udara dan bumi. Sebaliknya, pembakaran bahan bakar fosil menyuntikkan CO2 ke atmosfer yang telah tersimpan di bawah tanah selama jutaan tahun, sehingga menyebabkan penumpukan CO2 dengan cepat."}}, {"t": "p", "h": {"en": "Fast cycling of carbon is seasonal. CO2 increases in colder months when plants decay and release their carbon. In the warmer months, CO2 decreases as plants take it in, along with sunlight, to produce energy and oxygen. Animals — including humans — eat plants, breathe in oxygen, and exhale CO2. Graphs of CO2 show a wave pattern reflecting this seasonal change.", "id": "Perputaran karbon yang cepat bersifat musiman. CO2 meningkat pada bulan-bulan dingin ketika tanaman membusuk dan melepaskan karbonnya. Pada bulan-bulan hangat, CO2 berkurang karena tanaman menyerapnya, bersama dengan sinar matahari, untuk menghasilkan energi dan oksigen. Hewan – termasuk manusia – memakan tumbuhan, menghirup oksigen, dan menghembuskan CO2. Grafik CO2 menunjukkan pola gelombang yang mencerminkan perubahan musiman."}}, {"t": "p", "h": {"en": "Fossil fuels are part of the slow carbon cycle that operates over geological timescales. Burning fossil fuels takes carbon stored in the slow cycle and introduces it into the fast one. This activity is unique in Earth’s history; no other life-form has done anything on the same scale.", "id": "Bahan bakar fosil adalah bagian dari siklus karbon lambat yang berlangsung dalam rentang waktu geologis. Pembakaran bahan bakar fosil mengambil karbon yang tersimpan dalam siklus lambat dan memasukkannya ke dalam siklus cepat. Aktivitas ini unik dalam sejarah Bumi; tidak ada makhluk hidup lain yang melakukan hal serupa."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/breath\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/does-breathing-contribute-to-co2-buildup\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/breath\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/does-breathing-contribute-to-co2-buildup\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://archive.ph/eOZko\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.ph/eOZko\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Napas manusia ikut menambah CO2 di udara.", "en": "Human breathing adds to CO2 in the air."}, "fakta": {"id": "CO2 dari napas berasal dari makanan yang baru saja menyerap CO2 dari udara, jadi seimbang. Yang menambah CO2 adalah pembakaran bahan bakar fosil.", "en": "Breathed-out CO2 comes from food that recently absorbed it, so it balances out. Burning fossil fuels is what adds CO2."}, "kw": "napas bernapas manusia hewan"};</script>
