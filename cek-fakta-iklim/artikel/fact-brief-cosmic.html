ng mendorong kenaikan suhu di seluruh dunia."}}, {"t": "p", "h": {"en": "Galactic cosmic rays are high-energy particles released by stars of the Milky Way and other galaxies. These rays hit Earth’s upper atmosphere and produce charged particles called ions.", "id": "Sinar kosmik galaksi adalah partikel berenergi tinggi yang dilepaskan oleh bintang-bintang di Bima Sakti dan galaksi lainnya. Sinar ini mengenai atmosfer bagian atas bumi dan menghasilkan partikel bermuatan yang disebut ion."}}, {"t": "p", "h": {"en": "It is suggested these ions cause an increase in cloud cover, which would shield Earth from radiation and prevent warming; thus, it has been proposed that decreased cosmic ray activity is causing rising temperatures. However, causal links between cosmic rays, clouds, and warming have been debunked by decades of data.", "id": "Ion-ion ini diperkirakan menyebabkan peningkatan tutupan awan, yang akan melindungi bumi dari radiasi dan mencegah pemanasan; oleh karena itu, terdapat dugaan bahwa penurunan aktivitas sinar kosmik menyebabkan kenaikan suhu. Namun, hubungan sebab akibat antara sinar kosmik, awan, dan pemanasan telah terbantahkan oleh data selama beberapa dekade."}}, {"t": "p", "h": {"en": "A 2017 paper published in the Journal of Geophysical Research found the effects of cosmic rays on clouds insignificant compared to that of natural emissions like wildfires and volcanoes.", "id": "Sebuah makalah tahun 2017 yang diterbitkan dalam Journal of Geophysical Research menemukan bahwa dampak sinar kosmik pada awan tidak signifikan dibandingkan dengan emisi alami seperti kebakaran hutan dan gunung berapi."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/cosmic\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-decreased-cosmic-ray-activity-driving-global-warming\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/cosmic\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-decreased-cosmic-ray-activity-driving-global-warming\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://archive.is/1lNOt\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.is/1lNOt\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Pemanasan global disebabkan oleh berkurangnya sinar kosmik.", "en": "Fewer cosmic rays are causing global warming."}, "fakta": {"id": "Data selama lebih dari 50 tahun tidak menunjukkan bahwa sinar kosmik menyebabkan pemanasan. Penyebab utamanya tetap CO2.", "en": "Over 50 years of data show no evidence that cosmic rays drive warming. CO2 remains the main cause."}, "kw": "sinar kosmik"};</script>
