e Claims About Solar, Wind, and Electric Vehicles<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Waste from discarded solar panels is dwarfed by the waste from coal, oil, and gas. In addition, solar panel recycling capacity continues to expand and improve.", "id": "Limbah dari panel surya yang dibuang jumlahnya jauh lebih kecil dibandingkan dengan limbah batu bara, minyak, dan gas. Selain itu, kapasitas daur ulang panel surya terus berkembang dan meningkat."}}, {"t": "p", "h": {"en": "A 2023 study estimated that from 2016 – 2050, if power systems do not decarbonize, coal ash would be 300 – 800 times heavier than waste from discarded solar panels, and oily sludge from fossil fuels would be 2 – 5 times heavier.", "id": "Sebuah studi pada tahun 2023 memperkirakan bahwa pada tahun 2016 – 2050, jika sistem tenaga listrik tidak melakukan dekarbonisasi, abu batu bara akan menjadi 300 – 800 kali lebih berat dibandingkan limbah dari panel surya yang dibuang, dan lumpur berminyak dari bahan bakar fosil akan menjadi 2 – 5 kali lebih berat."}}, {"t": "p", "h": {"en": "Currently only about 10 – 15% of panels are recycled in the U.S., but governments and companies are funding additional research and new facilities. Existing plants can already recover around 90 – 95% of a panel’s mass, including glass, aluminum, and steel, and up to 95 – 97% of key semiconductor materials such as cadmium and tellurium.", "id": "Saat ini hanya sekitar 10 – 15% panel yang didaur ulang di A.S., namun pemerintah dan perusahaan mendanai penelitian tambahan dan fasilitas baru. Pabrik yang ada sudah dapat memulihkan sekitar 90 – 95% massa panel, termasuk kaca, aluminium, dan baja, serta hingga 95 – 97% material semikonduktor utama seperti kadmium dan telurium."}}, {"t": "p", "h": {"en": "As solar grows, recycling will cut waste and emissions further, while the bigger waste problem comes from not replacing fossil fuels.", "id": "Seiring dengan berkembangnya tenaga surya, daur ulang akan semakin mengurangi limbah dan emisi, sementara masalah limbah yang lebih besar berasal dari tidak adanya penggantian bahan bakar fosil."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/solarwaste\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/do-solar-panels-generate-more-waste-than-fossil-fuels/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/solarwaste\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/do-solar-panels-generate-more-waste-than-fossil-fuels/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/63GB-ZQ3B\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/63GB-ZQ3B\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Panel surya menghasilkan sampah lebih banyak daripada bahan bakar fosil.", "en": "Solar panels create more waste than fossil fuels."}, "fakta": {"id": "Sampah dari batu bara, minyak, dan gas jauh lebih banyak. Abu batu bara bisa 300 sampai 800 kali lebih berat daripada sampah panel surya.", "en": "Fossil fuel waste is far larger. Coal ash can weigh 300 to 800 times more than discarded solar panels."}, "kw": "panel surya sampah limbah"};</script>
