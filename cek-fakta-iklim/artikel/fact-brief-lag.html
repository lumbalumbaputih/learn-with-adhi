gris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://perma.cc/5ES6-7XVD\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/5ES6-7XVD\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Suhu naik dulu baru CO2, jadi CO2 bukan penyebab.", "en": "Temperature rises before CO2, so CO2 isn't the cause."}, "fakta": {"id": "Di masa lalu, pemanasan kadang dimulai oleh perubahan orbit Bumi, lalu CO2 ikut memperkuatnya. Pemanasan sekarang dimulai oleh CO2 dari manusia.", "en": "In the past, orbit changes sometimes started warming and CO2 then amplified it. Today's warming is started by human CO2."}, "kw": ""};</script>
