ts are built.", "id": "Dampaknya bergantung pada tempat dan cara proyek dibangun."}}, {"t": "p", "h": {"en": "Siting solar on already developed land and minimizing soil disturbance can maintain habitats and support more diverse vegetation, insects, and birds. Solar farms can create “microclimates” where shade under panels reduces soil moisture loss and encourages plant growth. This may be especially valuable in regions currently experiencing hotter, drier conditions.", "id": "Menempatkan tenaga surya di lahan yang sudah dikembangkan dan meminimalkan gangguan pada tanah dapat menjaga habitat dan mendukung lebih banyak keanekaragaman vegetasi, serangga, dan burung. Pembangkit listrik tenaga surya dapat menciptakan “iklim mikro” di mana naungan di bawah panel mengurangi hilangnya kelembapan tanah dan mendorong pertumbuhan tanaman. Hal ini mungkin bermanfaat khususnya di wilayah yang saat ini mengalami kondisi yang lebih panas dan kering."}}, {"t": "p", "h": {"en": "Developers can further reduce harm by avoiding bulldozing, leaving habitat patches, and building wildlife corridors within a site. Construction timing can also be adjusted to avoid sensitive periods such as breeding or migration.", "id": "Pengembang dapat lebih mengurangi dampak buruk dengan menghindari buldoser, meninggalkan petak habitat, dan membangun koridor satwa liar di dalam lokasi. Waktu konstruksi juga dapat disesuaikan untuk menghindari periode sensitif seperti berkembang biak atau migrasi."}}, {"t": "p", "h": {"en": "After installation, habitat restoration efforts like planting native flowering species can boost floral diversity and pollinator populations, benefiting overall ecosystems and human agriculture.", "id": "Setelah pemasangan, upaya restorasi habitat seperti penanaman spesies berbunga asli dapat meningkatkan keanekaragaman tumbuhan dan populasi penyerbuk, sehingga memberikan manfaat bagi ekosistem secara keseluruhan dan pertanian manusia."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.
