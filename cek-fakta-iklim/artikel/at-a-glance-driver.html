<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas – CO2 adalah penyebab utama perubahan iklim</h1><p>Tidak ada ilmuwan yang bilang CO2 satu-satunya penyebab perubahan iklim. Ilmu iklim mempelajari semua faktor, dari matahari sampai gunung berapi. Tapi dari semua itu, CO2 dari manusia adalah penyebab utama pemanasan saat ini.</p><p><a href="https://skepticalscience.com/at-a-glance-driver.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-driver", "fb": false, "date": "4 June 2024", "byline": "John Mason, BaerbelW, Ken Rice", "url": "https://skepticalscience.com/at-a-glance-driver.html", "words": 1234, "topic": "cause", "title": {"en": "At a glance - CO2 is the main driver of climate change", "id": "Sekilas – CO2 adalah penyebab utama perubahan iklim"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-driver/9ca104ad09.webp", "w": 570, "hh": 415, "alt": "Fact-Myth-Box"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "It may come as a surprise to some people unfamiliar with climate science, but tracking down anyone who actually said, \"CO₂ is the only driver of climate change\", has proved most elusive. Thus, the idea that, \"CO₂ is not the only driver of climate as some would have us believe.\", is lacking something rather important. Who actually said it?", "id": "Hal ini mungkin mengejutkan bagi sebagian orang yang tidak terbiasa dengan ilmu pengetahuan iklim, namun melacak siapa saja yang benar-benar mengatakan, \"CO₂ adalah satu-satunya penyebab perubahan iklim\", terbukti sangat sulit dilakukan. Oleh karena itu, gagasan bahwa \"CO₂ bukanlah satu-satunya penyebab perubahan iklim seperti yang diyakini sebagian orang.\", tidak memiliki sesuatu yang cukup penting. Siapa sebenarnya yang mengatakannya?"}}, {"t": "p", "h": {"en": "In climate science, nobody ever said it. That's because climate science covers everything that affects the climate. If you don't include everything, it would be like trying to find out how an internal combustion engine-powered car works, using as an example one without a crankshaft. The talking-point looks more like an example of a straw man fallacy, in which an argument, claim, or opponent is invented, and then shot down in flames, point-scoring being the idea. One sees this a lot in politics, but not in science.", "id": "Dalam ilmu iklim, tidak ada yang pernah mengatakannya. Itu karena ilmu iklim mencakup segala hal yang mempengaruhi iklim. Jika Anda tidak memasukkan semuanya, itu seperti mencoba mencari tahu cara kerja mobil bertenaga mesin pembakaran internal, dengan menggunakan contoh mobil tanpa poros engkol. Pokok pembicaraannya lebih mirip contoh kekeliruan manusia jerami, yang mana sebuah argumen, klaim, atau lawan diciptakan, dan kemudian dibakar, dan idenya adalah penilaian poin. Kita sering melihat hal ini dalam politik, tetapi tidak dalam sains."}}, {"t": "p", "h": {"en": "Through science, we know that Earth's climate is affected by a myriad of drivers that operate on timescales varying from seasons to tens of thousands to tens of millions of years. We've investigated them in depth and we continue to do so. We understand which ones act as 'radiative forcings' - the external, independent primary drivers that determine whether energy is being added to or removed from the system. We likewise understand which ones act as 'feedbacks' - secondary drivers that determine how energy is moved around within the system.<br><br>The very nature of science is that it is an ongoing self-correcting process in each and every discipline. So we do understand the key forcings and feedbacks that operate within our climate and on what time-scale they occur. CO₂, along with the other greenhouse gases, is but one of these factors.", "id": "Melalui ilmu pengetahuan, kita mengetahui bahwa iklim bumi dipengaruhi oleh banyak sekali faktor pendorong yang beroperasi pada rentang waktu yang bervariasi mulai dari musim hingga puluhan ribu hingga puluhan juta tahun. Kami telah menyelidikinya secara mendalam dan kami terus melakukannya. Kami memahami mana yang bertindak sebagai 'kekuatan radiasi' - penggerak utama eksternal dan independen yang menentukan apakah energi ditambahkan atau dihilangkan dari sistem. Kami juga memahami mana yang bertindak sebagai 'umpan balik' - penggerak sekunder yang menentukan bagaimana energi dipindahkan di dalam sistem.<br><br>Hakikat sains adalah bahwa ia merupakan proses koreksi diri yang berkelanjutan di setiap disiplin ilmu. Oleh karena itu, kami memahami faktor-faktor pendorong dan masukan utama yang terjadi dalam iklim kita dan dalam jangka waktu berapa hal tersebut terjadi. CO₂, bersama dengan gas rumah kaca lainnya, hanyalah salah satu faktor tersebut."}}, {"t": "p", "h": {"en": "Before you get too relaxed, however, of all the variables out there, CO₂ is the one that has seen a huge change. Since pre-industrial times its concentration has gone up by a whopping 50%. Just imagine if a change of that amount occurred with another part of the climate system. How about the strength of sunlight going up by 50%?", "id": "Namun, sebelum Anda terlalu santai, dari semua variabel yang ada, CO₂ adalah salah satu yang mengalami perubahan besar. Sejak masa pra-industri, konsentrasinya telah meningkat sebesar 50%. Bayangkan saja jika perubahan sebesar itu terjadi pada bagian lain sistem iklim. Bagaimana dengan kekuatan sinar matahari yang naik 50%?"}}, {"t": "p", "h": {"en": "Ironically, at the time of writing (early 2024), there is a lot of discussion as to why 2023 was so warm. The heat came on particularly in the second half of the year, coinciding with the onset of strong El Nino conditions in the Pacific Ocean. But normally there's a lag between El Nino starting up and peak temperatures. Did the injection of unusual amounts of water vapour into the upper atmosphere by the Hunga Tonga-Hunga Ha'apai volcano have a hand? Possibly. Did the cleaning-up of sulphate aerosol-generating shipping fuels partially remove a well-known negative or cooling feedback, and if so by how much?", "id": "Ironisnya, pada saat artikel ini ditulis (awal tahun 2024), banyak perbincangan mengenai mengapa tahun 2023 begitu hangat. Suhu panas terutama terjadi pada paruh kedua tahun ini, bertepatan dengan timbulnya kondisi El Nino yang kuat di Samudera Pasifik. Namun biasanya ada jeda antara permulaan El Nino dan suhu puncak. Apakah penyuntikan uap air dalam jumlah yang tidak biasa ke lapisan atas atmosfer oleh gunung berapi Hunga Tonga-Hunga Ha'apai ada pengaruhnya? Mungkin. Apakah pembersihan bahan bakar kapal yang menghasilkan aerosol sulfat menghilangkan sebagian efek negatif atau umpan balik pendinginan, dan jika ya, seberapa besar?"}}, {"t": "p", "h": {"en": "The trouble is that scientific investigations involve a lot of careful hard work and that takes a lot of time. For people more used to the instant answers of politicians, that might be disappointing, but there's a difference. Science requires evidence, politics less so.", "id": "Masalahnya adalah penyelidikan ilmiah memerlukan banyak kerja keras dan memerlukan banyak waktu. Bagi orang-orang yang terbiasa dengan jawaban instan dari para politisi, hal ini mungkin mengecewakan, namun ada perbedaannya. Sains memerlukan bukti, sedangkan politik tidak begitu."}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/CO2-is-not-the-only-driver-of-climate-basic.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/CO2-is-not-the-only-driver-of-climate-basic.htm\">ini formulir<\/a> untuk memberikan masukan tentang bagian \"Sekilas\" yang baru ini. Baca versi yang lebih teknis di bawah atau gali lebih dalam melalui tab di atas!<\/em><\/strong><\/em>"}}, {"t": "hr"}, {"t": "h2", "h": {"en": "<a href=\"https://skepticalscience.com/CO2-is-not-the-only-driver-of-climate-basic.htm#FurtherDetails\">Click for Further details<\/a>", "id": "<a href=\"https://skepticalscience.com/CO2-is-not-the-only-driver-of-climate-basic.htm#FurtherDetails\">Klik untuk detail lebih lanjut<\/a>"}}, {"t": "p", "h": {"en": "In case you'd like to explore more of our recently updated rebuttals, here are the links to all of them:", "id": "Jika Anda ingin menjelajahi lebih jauh sanggahan kami yang baru-baru ini diperbarui, berikut tautan ke semuanya:"}}, {"t": "p", "h": {"en": "<strong>Myths with link to rebuttal<\/strong> <strong>Short URLs<\/strong> <a href=\"https://sks.to/1970s\">Ice age predicted in the 1970s<\/a> sks.to/1970s <a href=\"https://sks.to/1998\">It hasn't warmed since 1998<\/a> sks.to/1998 <a href=\"https://sks.to/antarctica\">Antarctica is gaining ice<\/a> sks.to/antarctica <a href=\"https://sks.to/climategate\">CRU emails suggest conspiracy<\/a> sks.to/climategate <a href=\"https://sks.to/hockey\">What evidence is there for the hockey stick<\/a> sks.to/hockey <a href=\"https://sks.to/lag\">CO₂ lags temperature<\/a> sks.to/lag <a href=\"https://sks.to/past\">Climate's changed before<\/a> sks.to/past <a href=\"https://sks.to/sun\">It's the sun<\/a> sks.to/sun <a href=\"https://sks.to/temp\">Temperature records are unreliable<\/a> sks.to/temp <a href=\"https://sks.to/thermo\">The greenhouse effect and the 2nd law of thermodynamics<\/a> sks.to/thermo <a href=\"https://sks.to/iceage\">We're heading into an ice age<\/a> sks.to/iceage <a href=\"https://sks.to/impacts\">Positives and negatives of global warming<\/a> sks.to/impacts <a href=\"https://sks.to/consensus\">The 97% consensus on global warming<\/a> sks.to/consensus <a href=\"https://sks.to/cooling\">Global cooling - Is global warming still happening?<\/a> sks.to/cooling <a href=\"https://sks.to/model\">How reliable are climate models?<\/a> sks.to/model <a href=\"https://sks.to/species\">Can animals and plants adapt to global warming?<\/a> sks.to/species <a href=\"https://sks.to/cosmic\">What's the link between cosmic rays and climate change?<\/a> sks.to/cosmic <a href=\"https://sks.to/gore\">Is Al Gore's An Inconvenient Truth accurate?<\/a> sks.to/gore <a href=\"https://sks.to/glacier\">Are glaciers growing or retreating?<\/a> sks.to/glacier <a href=\"https://sks.to/acid\">Ocean acidification: global warming's evil twin<\/a> sks.to/acid <a href=\"https://sks.to/agw\">The human fingerprint in global warming<\/a> sks.to/agw <a href=\"https://sks.to/evidence\">Empirical evidence that humans are causing global warming<\/a> sks.to/evidence <a href=\"https://sks.to/greenhouse\">How do we know more CO₂ is causing warming?<\/a> sks.to/greenhouse <a href=\"https://sks.to/vapor\">Explaining how the water vapor greenhouse effect works<\/a> sks.to/vapor <a href=\"https://sks.to/OISM\">The tricks employed by the flawed OISM Petition Project to cast doubt on the scientific consensus on climate change<\/a> sks.to/OISM <a href=\"https://sks.to/extreme\">Is extreme weather caused by global warming?<\/a> sks.to/extreme <a href=\"https://sks.to/trace\">How substances in trace amounts can cause large effects<\/a> sks.to/trace <a href=\"https://sks.to/sealevel\">How much is sea level rising?<\/a> sks.to/sealevel <a href=\"https://sks.to/pollutant\">Is CO₂ a pollutant?<\/a> sks.to/pollutant <a href=\"https://sks.to/cold\">Does cold weather disprove global warming?<\/a> sks.to/cold <a href=\"https://sks.to/volcano\">Do volcanoes emit more CO₂ than humans?<\/a> sks.to/volcano <a href=\"https://sks.to/co2\">How do human CO₂ emissions compare to natural CO2 emissions?<\/a> sks.to/co2 <a href=\"https://sks.to/money\">Climate scientists could make more money in other careers<\/a> sks.to/money <a href=\"https://sks.to/co2data\">How reliable are CO₂ measurements?<\/a> sks.to/co2data <a href=\"https://sks.to/pastco2\">Do high levels of CO₂ in the past contradict the warming effect of CO₂?<\/a> sks.to/pastco2 <a href=\"https://sks.to/cloud\">What is the net feedback of clouds?<\/a> sks.to/cloud <a href=\"https://sks.to/name\">Global warming vs climate change<\/a> sks.to/name <a href=\"https://sks.to/mars\">Is Mars warming?<\/a> sks.to/mars <a href=\"https://sks.to/underestimat\">How the IPCC is more likely to underestimate the climate response<\/a> sks.to/underestimat <a href=\"https://sks.to/sensitivity\">How sensitive is our climate?<\/a> sks.to/sensitivity <a href=\"https://sks.to/warming\">Evidence for global warming<\/a> sks.to/warming <a href=\"https://sks.to/falsify\">Has the greenhouse effect been falsified?<\/a> sks.to/falsify <a href=\"https://sks.to/breath\">Does breathing contribute to CO₂ buildup in the atmosphere?<\/a> sks.to/breath <a href=\"https://sks.to/CO2increase\">What is causing the increase in atmospheric CO2?<\/a> sks.to/CO2increase <a href=\"https://sks.to/methane\">What is methane's contribution to global warming?<\/a> sks.to/methane <a href=\"https://sks.to/plant\">Plants cannot live on CO2 alone<\/a> sks.to/plant <a href=\"https://sks.to/saturate\">Is the CO2 effect saturated?<\/a> sks.to/saturate <a href=\"https://sks.to/waste\">Greenhouse warming 100 times greater than waste heat<\/a> sks.to/waste <a href=\"https://sks.to/bear\">How will global warming affect polar bears?<\/a> sks.to/bear <a href=\"https://sks.to/venus\">The runaway greenhouse effect on Venus<\/a> sks.to/venus <a href=\"https://sks.to/planets\">What climate change is happening to other planets in the solar system?<\/a> sks.to/planets <a href=\"https://sks.to/arctic\">Has Arctic sea ice returned to normal?<\/a> sks.to/arctic <a href=\"https://sks.to/green\">Was Greenland really green in the past?<\/a> sks.to/green <a href=\"https://sks.to/greenland\">Is Greenland gaining or losing ice?<\/a> sks.to/greenland <a href=\"https://sks.to/arcticcycle\">Human activity is driving retreat of Arctic sea ice<\/a> sks.to/arcticcycle <a href=\"https://sks.to/albedo\">The albedo effect and global warming<\/a> sks.to/albedo <a href=\"https://sks.to/correlate\">Does CO2 always correlate with temperature?<\/a> sks.to/correlate <a href=\"https://sks.to/cyc
