<script>window.POST={"slug": "fact-brief-windfall", "fb": true, "date": "30 June 2026", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-windfall.html", "words": 390, "topic": "energy", "title": {"en": "Fact brief - Are injuries from wind turbines common?", "id": "Fakta singkat - Apakah cedera akibat turbin angin sering terjadi?"}, "verdict": "No", "question": {"en": "Are injuries from wind turbines common?", "id": "Apakah cedera akibat turbin angin sering terjadi?"}, "sources": [{"en": "Philosophical Transactions <a href=\"https://doi.org/10.1098/rsta.2014.0077\">Damage tolerance and structural monitoring for wind turbine blades<\/a>"}, {"en": "US Department of Energy <a href=\"https://perma.cc/85RN-M454\">How Do Wind Turbines Survive Severe Weather and Storms?<\/a>"}, {"en": "US Department of Energy <a href=\"https://perma.cc/3GA4-SGJQ\">Wind Energy Projects and Safety<\/a>"}, {"en": "IOP Conference Series: Materials Science and Engineering <a href=\"https://iopscience.iop.org/article/10.1088/1757-899X/942/1/012001/pdf\">A Critical Review of Damage and Failure of Composite Wind Turbine Blade Structures<\/a>"}, {"en": "US Department of Energy <a href=\"https://perma.cc/4RFC-TRK8\">Wind Vision: A New Era for Wind Power in the United States<\/a>"}, {"en": "Our World in Data <a href=\"https://ourworldindata.org/safest-sources-of-energy\">What are the safest and cleanest sources of energy?<\/a>"}, {"en": "Columbia Law School Sabin Center for Climate Change Law <a href=\"https://scholarship.law.columbia.edu/sabin_climate_change/217/\">Rebutting 33 False Claims About Solar, Wind, and Electric Vehicles<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Wind turbine collapses or blade failures are extremely uncommon, and wind power causes far fewer deaths per unit of electricity than fossil fuels.", "id": "Runtuhnya turbin angin atau kegagalan bilah sangat jarang terjadi, dan tenaga angin menyebabkan kematian per unit listrik yang jauh lebih sedikit dibandingkan bahan bakar fosil."}}, {"t": "p", "h": {"en": "Modern utility-scale turbines use monitoring and shutdown systems designed to handle extreme weather, including hurricanes. Concerns about blades breaking off were more common in earlier years of wind development, but improved engineering and hazard sensors have made these events exceedingly infrequent. One study estimated the turbine blade failure rate at about 0.54% per year, with the U.S. Department of Energy describing “catastrophic” failures as rare events.", "id": "Turbin skala utilitas modern menggunakan sistem pemantauan dan penghentian yang dirancang untuk menangani cuaca ekstrem, termasuk angin topan. Kekhawatiran akan putusnya bilah angin lebih umum terjadi pada tahun-tahun awal pengembangan pembangkit listrik tenaga angin, namun peningkatan teknik dan sensor bahaya membuat kejadian ini menjadi sangat jarang terjadi. Sebuah studi memperkirakan tingkat kegagalan sudu turbin sekitar 0,54% per tahun, dan Departemen Energi AS menggambarkan kegagalan “bencana” sebagai peristiwa yang jarang terjadi."}}, {"t": "p", "h": {"en": "Safety comparisons utilize “deaths per terawatt-hour,” which counts both direct accidents (like mining, drilling, transport, and plant accidents) and indirect deaths from air pollution or emissions. By this measure, wind is estimated to cause about 0.04 deaths/TWh, far below coal (24-33 deaths), oil (18), or natural gas (3).", "id": "Perbandingan keselamatan menggunakan “kematian per terawatt-jam”, yang menghitung kecelakaan langsung (seperti kecelakaan pertambangan, pengeboran, transportasi, dan pabrik) dan kematian tidak langsung akibat polusi atau emisi udara. Berdasarkan ukuran ini, angin diperkirakan menyebabkan sekitar 0,04 kematian/TWh, jauh di bawah batu bara (24-33 kematian), minyak (18), atau gas alam (3)."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/windfall\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/are-injuries-from-wind-turbines-common/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/windfall\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/are-injuries-from-wind-turbines-common/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/BYS3-W5QK\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/BYS3-W5QK\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Kecelakaan akibat kincir angin sering terjadi.", "en": "Injuries from wind turbines are common."}, "fakta": {"id": "Kincir angin roboh atau baling-balingnya patah sangat jarang terjadi. Untuk listrik yang sama, tenaga angin jauh lebih sedikit menyebabkan kematian daripada bahan bakar fosil.", "en": "Turbine collapses and blade failures are very rare, and wind causes far fewer deaths per unit of electricity than fossil fuels."}, "kw": "kincir angin kecelakaan roboh"};</script>
