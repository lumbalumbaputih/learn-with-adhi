<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas - Pemanasan global dan El Niño Southern Oscillation</h1><p>El Niño dan La Niña hanya memindahkan panas antara laut dan udara, tidak menambah atau mengurangi panas Bumi secara keseluruhan. Jadi El Niño bisa membuat satu tahun lebih panas, tapi tidak bisa menjelaskan pemanasan selama puluhan tahun.</p><p><a href="https://skepticalscience.com/at-a-glance-elnino.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-elnino", "fb": false, "date": "2 April 2024", "byline": "John Mason, BaerbelW", "url": "https://skepticalscience.com/at-a-glance-elnino.html", "words": 1162, "topic": "elnino", "title": {"en": "At a glance - Global warming and the El Niño Southern Oscillation", "id": "Sekilas - Pemanasan global dan El Niño Southern Oscillation"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-elnino/6b6a9eeaee.webp", "w": 570, "hh": 372, "alt": "Fact-Myth-Box"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "This particular myth is distinguished by the online storm that it stirred up back in 2009. So what happened?", "id": "Mitos khusus ini dibedakan dengan badai online yang terjadi pada tahun 2009. Lalu apa yang terjadi?"}}, {"t": "p", "h": {"en": "Three people got a paper published in the Journal of Geophysical Research. It was all about ENSO - the El Nino Southern Oscillation in the Pacific Ocean. ENSO has three modes, El Nino, neutral and La Nina. In El Nino, heat is transferred from the ocean to the atmosphere. In La Nina, the opposite happens. So within ENSO's different modes, energy is variously moved around through the planet's climate system, but heat is neither added nor subtracted from the whole. As such, in the long term, ENSO is climate-neutral but in the short term it makes a lot of noise.", "id": "Tiga orang mendapat makalah yang diterbitkan di Journal of Geophysical Research. Itu semua tentang ENSO - El Nino Southern Oscillation di Samudera Pasifik. ENSO memiliki tiga mode yaitu El Nino, netral dan La Nina. Pada El Nino, panas berpindah dari laut ke atmosfer. Di La Nina, yang terjadi justru sebaliknya. Jadi dalam mode ENSO yang berbeda-beda, energi dipindahkan ke seluruh sistem iklim planet ini dengan cara yang berbeda-beda, namun panas tidak ditambahkan atau dikurangi dari keseluruhan sistem tersebut. Oleh karena itu, dalam jangka panjang, ENSO netral terhadap iklim, namun dalam jangka pendek, ENSO menimbulkan banyak kebisingan."}}, {"t": "p", "h": {"en": "The paper (link in further details) looked at aspects of ENSO and concluded that the oscillation is a \"major contributor to variability and perhaps recent trends in global temperature\". First point, sure. Second point, nope, if you accept climate trends are multidecadal things, which they are.", "id": "Makalah ini (tautan di rincian lebih lanjut) melihat aspek ENSO dan menyimpulkan bahwa osilasi adalah \"penyumbang utama terhadap variabilitas dan mungkin tren terkini dalam suhu global\". Poin pertama, tentu saja. Poin kedua, tidak, jika Anda menerima bahwa tren iklim adalah hal yang bersifat multidekade."}}, {"t": "p", "h": {"en": "That might have been the end of it had the authors not gone full-megaphone on the media circuit, promoting the paper widely in a certain way. \"No scientific justification exists for emissions regulation\", they loudly crowed. \"No global warming\", the denizens of the echo-chamber automatically responded, all around the internet. This is how climate science denial works.", "id": "Itu mungkin akan berakhir jika penulisnya tidak menggunakan media massa untuk mempromosikan makalahnya secara luas dengan cara tertentu. \"Tidak ada pembenaran ilmiah untuk peraturan emisi\", seru mereka dengan lantang. \"Tidak ada pemanasan global\", para penghuni ruang gema secara otomatis menjawab, di seluruh internet. Beginilah cara kerja penolakan ilmu pengetahuan iklim."}}, {"t": "p", "h": {"en": "Conversely, the way that science itself works is that studies are submitted to journals, peer-reviewed, then some of them get published. Peer review is not infallible - some poor material can get through on occasion - but science is self-correcting. So other scientists active in that field will read the paper. They may either agree with its methods, data presentation and conclusions or they may disagree. If they disagree enough - such as finding a major error, they respond. That response goes to peer-review too and in this case that's exactly what happened. An error so fundamental was found that the response was published by the same journal. The error concerned one of the statistical methods that had been used, called linear detrending. If you apply this method to temperature data for six months of the Austral year from winter to summer (July-December), it cannot tell you that during that period there has been a seasonal warming trend. So what happens if you apply it to any other dataset? No warming! Bingo!", "id": "Sebaliknya, cara kerja sains adalah penelitian diserahkan ke jurnal, ditinjau oleh rekan sejawat, lalu beberapa di antaranya dipublikasikan. Tinjauan sejawat tidaklah sempurna - beberapa materi yang buruk kadang-kadang bisa lolos - tetapi sains bisa mengoreksi diri sendiri. Jadi ilmuwan lain yang aktif di bidang tersebut akan membaca makalah tersebut. Mereka mungkin setuju dengan metode, penyajian data dan kesimpulannya, atau mereka mungkin tidak setuju. Jika mereka cukup tidak setuju – seperti menemukan kesalahan besar, mereka akan merespons. Respons tersebut juga akan melalui tinjauan sejawat dan dalam kasus ini, itulah yang terjadi. Ditemukan kesalahan yang begitu mendasar sehingga tanggapannya diterbitkan oleh jurnal yang sama. Kesalahan tersebut berkaitan dengan salah satu metode statistik yang selama ini digunakan, yang disebut detrending linier. Jika Anda menerapkan metode ini pada data suhu selama enam bulan dalam tahun Austral dari musim dingin hingga musim panas (Juli-Desember), metode ini tidak dapat memberi tahu Anda bahwa selama periode tersebut telah terjadi tren pemanasan musiman. Jadi apa yang terjadi jika Anda menerapkannya ke kumpulan data lain? Tidak ada pemanasan! Bingo!"}}, {"t": "p", "h": {"en": "A response to the response, from the original authors, followed but was not accepted for publication, having failed peer-review. At this point, the authors of the rejected response-to-the-response started to screech, \"CENSORSHIP\" - and the usual blogosphere battles duly erupted.", "id": "Tanggapan terhadap tanggapan, dari penulis asli, diikuti tetapi tidak diterima untuk dipublikasikan, karena gagal dalam tinjauan sejawat. Pada titik ini, penulis tanggapan yang ditolak mulai berteriak, \"SENSOR\" - dan pertarungan blogosphere yang biasa pun meletus."}}, {"t": "p", "h": {"en": "It was not censorship. Dodgy statistical techniques were picked up by the paper's highly knowledgeable readership, some of whom joined forces to prepare a rebuttal that corrected the errors. The response of the original paper's authors to having their errors pointed out was so badly written that it was rejected. That's not censorship. It's about keeping garbage out of the scientific literature.", "id": "Itu bukan sensor. Teknik statistik yang cerdik dimanfaatkan oleh pembaca yang berpengetahuan luas, beberapa di antaranya bergabung untuk mempersiapkan sanggahan yang memperbaiki kesalahan tersebut. Tanggapan penulis makalah asli ketika kesalahan mereka ditunjukkan ditulis dengan sangat buruk sehingga ditolak. Itu bukan sensor. Ini tentang menjauhkan sampah dari literatur ilmiah."}}, {"t": "p", "h": {"en": "Quality control is what it's all about.", "id": "Kontrol kualitas adalah intinya."}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/el-nino-southern-oscillation-basic.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/el-nino-southern-oscillation-basic.htm\">ini formulir<\/a> untuk memberikan masukan te
