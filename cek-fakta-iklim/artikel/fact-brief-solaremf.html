 has enough energy to move atoms in a molecule but not enough to remove electrons or damage DNA. Solar farm EMFs are even less energetic than other forms of common non-ionizing radiation such as radio waves, infrared, or visible light.", "id": "Peralatan tenaga surya memancarkan radiasi non-ionisasi, artinya energi yang dimiliki cukup untuk menggerakkan atom dalam suatu molekul, namun tidak cukup untuk menghilangkan elektron atau merusak DNA. EMF pembangkit listrik tenaga surya bahkan kurang energik dibandingkan bentuk radiasi non-ionisasi umum lainnya seperti gelombang radio, inframerah, atau cahaya tampak."}}, {"t": "p", "h": {"en": "Even when standing directly beside the largest-scale equipment, EMF levels measure around 1,050 milligauss (mG), lower than exposure from using an electric can opener (up to 1,500 mG) and well below exposure limits (around 2,000 mG). At distances typical of real-world exposure – 9 feet from a residential inverter or 150 feet from a utility-scale inverter – field strength falls to 0.5 mG or less.", "id": "Bahkan ketika berdiri tepat di samping peralatan berskala terbesar, tingkat EMF mencapai sekitar 1.050 miligauss (mG), lebih rendah dibandingkan paparan akibat penggunaan pembuka kaleng listrik (hingga 1.500 mG) dan jauh di bawah batas paparan (sekitar 2.000 mG). Pada jarak yang biasa terjadi pada paparan di dunia nyata – 9 kaki dari inverter perumahan atau 150 kaki dari inverter skala utilitas – kekuatan medan turun menjadi 0,5 mG atau kurang."}}, {"t": "p", "h": {"en": "Scientific reviews find no consistent evidence of negative health impacts from EMFs produced by solar farms.", "id": "Tinjauan ilmiah tidak menemukan bukti yang konsisten mengenai dampak negatif EMF terhadap kesehatan yang dihasilkan oleh pembangkit listrik tenaga surya."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/solaremf\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/are-electromagnetic-fields-from-solar-farms-harmful-to-human-health/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/solaremf\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/are-electromagnetic-fields-from-solar-farms-harmful-to-human-health/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/63GB-ZQ3B\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/63GB-ZQ3B\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Medan listrik dari ladang panel surya berbahaya bagi kesehatan.", "en": "Electromagnetic fields from solar farms are harmful."}, "fakta": {"id": "Medan elektromagnetik dari panel surya sangat lemah, jauh di bawah batas aman, bahkan lebih lemah daripada gelombang radio.", "en": "Solar farm fields are very weak, well within safety limits, and weaker than radio waves."}, "kw": "panel surya radiasi gelombang"};</script>
