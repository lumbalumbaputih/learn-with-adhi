ional cooling phenomenon caused by internal forcings that mostly moved heat around within Earth’s climate system.", "id": "Zaman Es Kecil adalah fenomena pendinginan regional yang disebabkan oleh kekuatan internal yang sebagian besar memindahkan panas ke dalam sistem iklim bumi."}}, {"t": "p", "h": {"en": "This event affected North America and Europe from 1350 to 1850. While external forcings like volcanic eruptions and decreased solar activity occurred, it was a massive export of Arctic sea ice into the North Atlantic by warm currents that disrupted ocean circulation and triggered prolonged regional cooling.", "id": "Peristiwa ini mempengaruhi Amerika Utara dan Eropa dari tahun 1350 hingga 1850. Meskipun terjadi kekuatan eksternal seperti letusan gunung berapi dan penurunan aktivitas matahari, es laut Arktik dalam jumlah besar yang diekspor ke Atlantik Utara oleh arus hangat yang mengganggu sirkulasi laut dan memicu pendinginan regional yang berkepanjangan."}}, {"t": "p", "h": {"en": "The end of the Little Ice Age coincided with rising solar output and industrial greenhouse gas emissions. However, since the 1950s, solar activity has declined while global temperatures have increased.", "id": "Berakhirnya Zaman Es Kecil bertepatan dengan meningkatnya keluaran tenaga surya dan emisi gas rumah kaca industri. Namun, sejak tahun 1950an, aktivitas matahari telah menurun sementara suhu global meningkat."}}, {"t": "p", "h": {"en": "Today’s warming is driven by human emissions, increasing the amount of heat in the system rather than redistributing it.", "id": "Pemanasan saat ini disebabkan oleh emisi manusia, yang meningkatkan jumlah panas dalam sistem, bukan mendistribusikannya kembali."}}, {"t": "p", "h": {"en": "The late 20th century is the warmest interval in the last 2,000 years for over 98% of the globe.", "id": "Akhir abad ke-20 merupakan periode terpanas dalam 2.000 tahun terakhir di lebih dari 98% wilayah bumi."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/lia\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-modern-warming-just-a-rebound-from-the-little-ice-age/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/lia\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-modern-warming-just-a-rebound-from-the-little-ice-age/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://web.archive.org/web/20150318141729/http://climaterealists.com/index.php?id=3910\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://web.archive.org/web/20150318141729/http://climaterealists.com/index.php?id=3910\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Bumi sekarang cuma kembali hangat setelah Zaman Es Kecil.", "en": "Earth is just recovering from the Little Ice Age."}, "fakta": {"id": "Bumi sekarang lebih panas daripada sebelum Zaman Es Kecil. Jadi ini bukan sekadar pulih, tapi panas baru dari kegiatan manusia.", "en": "Earth is now warmer than before the Little Ice Age. This is new heat from human activity, not a rebound."}, "kw": "zaman es kecil alami siklus pulih"};</script>
