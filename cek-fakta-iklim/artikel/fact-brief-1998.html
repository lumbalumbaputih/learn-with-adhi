leh pemanasan global yang disebabkan oleh manusia."}}, {"t": "p", "h": {"en": "However, the long-term upward trend in globally-averaged temperatures has continued. In the past quarter century, the top ten hottest years on record have all occurred since 2010.", "id": "Namun, tren kenaikan suhu rata-rata global dalam jangka panjang terus berlanjut. Dalam seperempat abad terakhir, sepuluh tahun terpanas yang pernah tercatat semuanya terjadi sejak tahun 2010."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/1998\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/has-warming-continued-since-1998\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/1998\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/has-warming-continued-since-1998\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://web.archive.org/web/20080221004846/http://www.telegraph.co.uk/opinion/main.jhtml?xml=/opinion/2006/04/09/do0907.xml\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://web.archive.org/web/20080221004846/http://www.telegraph.co.uk/opinion/main.jhtml?xml=/opinion/2006/04/09/do0907.xml\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Pemanasan global berhenti sejak tahun 1998.", "en": "Global warming stopped in 1998."}, "fakta": {"id": "Tahun 1998 panas karena El Niño kuat. Setelah itu suhu terus naik: sepuluh tahun terpanas semuanya terjadi sejak 2010.", "en": "1998 was hot because of a strong El Niño. Warming continued: the ten hottest years have all been since 2010."}, "local": {"id": "Menurut BMKG, El Niño membuat curah hujan turun di hampir seluruh Indonesia, terutama pada bulan Juni sampai November. Pada akhir Juli 2026, BMKG menyebut El Niño tahun ini kuat dan akan bertahan setidaknya sampai awal 2027, sehingga banyak daerah menghadapi kemarau yang lebih p
