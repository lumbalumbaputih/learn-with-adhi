th’s temperature today.", "id": "Tidak dapat diabaikan, CO₂ buatan manusia merupakan faktor utama yang mengendalikan suhu bumi saat ini."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/greenhouse\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/does-increasing-co2-have-a-noticeable-effect/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/greenhouse\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/does-increasing-co2-have-a-noticeable-effect/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://web.archive.org/web/20250228130724/https://www.oism.org/pproject/s33p36.htm\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://web.archive.org/web/20250228130724/https://www.oism.org/pproject/s33p36.htm\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Tambahan CO2 di udara tidak berpengaruh pada suhu.", "en": "Extra CO2 in the air makes no difference."}, "fakta": {"id": "Sudah dibuktikan sejak tahun 1800-an bahwa CO2 menahan panas. Makin banyak CO2, Bumi makin hangat.", "en": "It has been proven since the 1800s that CO2 traps heat. More CO2 means a warmer Earth."}, "kw": "co2 karbon rumah kaca pengaruh"};</script>
