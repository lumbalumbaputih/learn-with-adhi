b.archive.org/web/20250620233744/https:/www.epa.gov/climatechange-science/causes-climate-change\">Causes of Climate Change<\/a>"}], "blocks": [{"t": "p", "h": {"en": "There has been broad agreement about the greenhouse effect for over a century.", "id": "Terdapat kesepakatan luas mengenai efek rumah kaca selama lebih dari satu abad."}}, {"t": "p", "h": {"en": "In 1824, Joseph Fourier calculated that Earth ought to be much colder given its distance from the sun, and theorized that the atmosphere acts as a blanket, trapping heat and keeping the planet warmer than it would be otherwise.", "id": "Pada tahun 1824, Joseph Fourier menghitung bahwa bumi seharusnya menjadi lebih dingin mengingat jaraknya dari matahari, dan berteori bahwa atmosfer bertindak sebagai selimut, memerangkap panas dan menjaga planet ini lebih hangat dibandingkan sebaliknya."}}, {"t": "p", "h": {"en": "Scientists later hypothesized that higher concentrations of greenhouse gases could raise temperatures. In 1896, Svante Arrhenius attempted to quantify this; his predictions remain on the high end of current climate models.", "id": "Para ilmuwan kemudian berhipotesis bahwa konsentrasi gas rumah kaca yang lebih tinggi dapat meningkatkan suhu. Pada tahun 1896, Svante Arrhenius mencoba mengukur hal ini; prediksinya tetap sesuai dengan model iklim saat ini."}}, {"t": "p", "h": {"en": "The basic science of the greenhouse effect is fairly simple: certain atmospheric gases such as carbon dioxide trap and redirect outgoing heat; some is radiated back downward, causing heat build up and temperatures to rise.", "id": "Ilmu dasar tentang efek rumah kaca cukup sederhana: gas atmosfer tertentu seperti karbon dioksida memerangkap dan mengalihkan panas yang keluar; beberapa diradiasikan kembali ke bawah, menyebabkan penumpukan panas dan suhu meningkat."}}, {"t": "p", "h": {"en": "In 2021, the IPCC concluded it is unequivocal that human emission of greenhouse gases are the primary cause of modern warming.", "id": "Pada tahun 2021, IPCC menyimpulkan dengan tegas bahwa emisi gas rumah kaca yang dihasilkan oleh manusia adalah penyebab utama pemanasan modern."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/settled\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-the-greenhouse-effect-still-debated-among-climate-scientists/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/settled\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-the-greenhouse-effect-still-debated-among-climate-scientists/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://archive.md/Jfgn2\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.md/Jfgn2\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Para ilmuwan masih berdebat soal efek rumah kaca.", "en": "Scientists are still arguing about the greenhouse effect."}, "fakta": {"id": "Ilmuwan sudah sepakat soal efek rumah kaca sejak lebih dari 100 tahun lalu.", "en": "Scientists have agreed on the greenhouse effect for more than 100 years."}, "kw": "debat ilmuwan sepakat rumah kaca"};</script>
