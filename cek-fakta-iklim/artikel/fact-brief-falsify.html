nhouse_gases.htm\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Efek rumah kaca sudah terbukti salah.", "en": "The greenhouse effect has been disproved."}, "fakta": {"id": "Efek rumah kaca adalah ilmu dasar yang sudah dikenal hampir 200 tahun. Tanpa efek ini, Bumi terlalu dingin untuk kehidupan.", "en": "The greenhouse effect is basic physics known for almost 200 years. Without it, Earth would be too cold for life."}, "kw": ""};</script>
