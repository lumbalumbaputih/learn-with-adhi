c movement, take tens of thousands of years. They cannot explain the pace of recent warming.", "id": "Para ilmuwan telah melakukan studi terperinci tentang “pendorongan” iklim, atau faktor-faktor yang berdampak pada suhu global, terutama dengan menggunakan data satelit selama 50 tahun terakhir. Kekuatan alam jangka panjang, seperti perubahan orbit bumi atau pergerakan tektonik, memerlukan waktu puluhan ribu tahun. Mereka tidak dapat menjelaskan laju pemanasan yang terjadi saat ini."}}, {"t": "p", "h": {"en": "More immediate, smaller-impact changes occur in shorter-term cycles and cancel out over time. Solar cycles and weather patterns such as El Nino and El Nina manifest as irregular oscillations in temperature graphs.", "id": "Perubahan yang lebih cepat dan berdampak lebih kecil terjadi dalam siklus jangka pendek dan hilang seiring berjalannya waktu. Siklus matahari dan pola cuaca seperti El Nino dan El Nina bermanifestasi sebagai osilasi tidak teratur pada grafik suhu."}}, {"t": "p", "h": {"en": "In contrast, human CO₂ emissions have increased by 50% in less than 200 years, from 290 ppm to 430 ppm. Today’s global temperatures are 1.5°C (2.6°F) warmer than the pre-industrial average. The long-term upward trend in today’s temperatures can only be explained by the concurrent human-caused rise in atmospheric CO₂.", "id": "Sebaliknya, emisi CO₂ manusia telah meningkat sebesar 50% dalam waktu kurang dari 200 tahun, dari 290 ppm menjadi 430 ppm. Suhu global saat ini 1,5°C (2,6°F) lebih hangat dibandingkan rata-rata suhu pada masa pra-industri. Tren kenaikan suhu saat ini dalam jangka panjang hanya dapat dijelaskan oleh peningkatan CO2 di atmosfer yang disebabkan oleh aktivitas manusia.."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/driver\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/are-human-co2-emissions-driving-current-global-warming/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/driver\"
