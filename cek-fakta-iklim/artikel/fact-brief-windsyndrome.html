.law.columbia.edu/sabin_climate_change/217/\">Rebutting 33 False Claims About Solar, Wind, and Electric Vehicles<\/a>"}], "blocks": [{"t": "p", "h": {"en": "An extensive body of studies and reviews has not found a clear, direct link between wind turbines’ low-frequency sound and any specific health syndromes. No medical organization recognizes such diagnoses.", "id": "Sejumlah penelitian dan tinjauan ekstensif belum menemukan hubungan yang jelas dan langsung antara suara frekuensi rendah turbin angin dan sindrom kesehatan tertentu. Tidak ada organisasi medis yang mengakui diagnosis tersebut."}}, {"t": "p", "h": {"en": "Wind turbines do produce low-frequency noise, but at typical residential distances it is often below normal hearing levels. Public health agencies and systematic reviews conclude that reported symptoms such as sleep disruption and stress are not consistently tied to low-frequency sound exposure. Instead, research suggests complaints are more strongly associated with factors such as annoyance, worry, and negative expectations about nearby turbines.", "id": "Turbin angin memang menghasilkan kebisingan berfrekuensi rendah, namun pada jarak pemukiman biasa, kebisingan tersebut sering kali berada di bawah tingkat pendengaran normal. Badan kesehatan masyarakat dan tinjauan sistematis menyimpulkan bahwa gejala yang dilaporkan seperti gangguan tidur dan stres tidak selalu dikaitkan dengan paparan suara frekuensi rendah. Sebaliknya, penelitian menunjukkan bahwa keluhan lebih terkait erat dengan faktor-faktor seperti rasa kesal, kekhawatiran, dan ekspektasi negatif terhadap turbin di sekitar."}}, {"t": "p", "h": {"en": "An analysis of complaints across 51 Australian wind farms between 1993 and 2012 found that health and noise complaints were uncommon for years, then rose sharply after the term “wind turbine syndrome” was newly coined and popularized in 2009, suggesting self-pathologization.", "id": "Analisis terhadap keluhan di 51 pembangkit listrik tenaga angin Australia antara tahun 1993 dan 2012 menemukan bahwa keluhan kesehatan dan kebisingan jarang terjadi selama bertahun-tahun, kemudian meningkat tajam setelah istilah “sindrom turbin angin” baru diciptakan dan dipopulerkan pada tahun 2009, yang menunjukkan adanya patologisasi diri."}}, {"t": "p", "h": {"en": "Overall, the evidence does not support low-frequency turbine noise as a cause of a distinct medical condition.", "id": "Secara keseluruhan, bukti yang ada tidak mendukung kebisingan turbin frekuensi rendah sebagai penyebab suatu kondisi medis tertentu."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/windsyndrome\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-wind-turbine-syndrome-a-medically-recognized-diagnosis/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/windsyndrome\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-wind-turbine-syndrome-a-medically-recognized-diagnosis/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/5KNZ-JCNL\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/5KNZ-JCNL\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Ada penyakit khusus bernama sindrom kincir angin.", "en": "'Wind turbine syndrome' is a real illness."}, "fakta": {"id": "Tidak ada organisasi kedokteran yang mengakui penyakit ini. Penelitian tidak menemukan hubungan jelas antara suara kincir angin dan penyakit tertentu.", "en": "No medical organisation recognises it, and research finds no clear link between turbine sound and any specific illness."}, "kw": "kincir angin suara sakit"};</script>
