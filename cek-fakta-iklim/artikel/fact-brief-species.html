<script>window.POST={"slug": "fact-brief-species", "fb": true, "date": "1 February 2025", "byline": "Guest Author", "url": "https://skepticalscience.com/fact-brief-species.html", "words": 365, "topic": "disaster", "title": {"en": "Fact brief - Is global warming promoting biodiversity?", "id": "Fakta singkat - Apakah pemanasan global meningkatkan keanekaragaman hayati?"}, "verdict": "No", "question": {"en": "Is global warming promoting biodiversity?", "id": "Apakah pemanasan global meningkatkan keanekaragaman hayati?"}, "sources": [{"en": "WWF <a href=\"https://archive.ph/MkvVa\">A warning sign: where biodiversity loss is happening around the world<\/a>"}, {"en": "AKSIK <a href=\"https://archive.is/gsYUK\">Fragility of Coral Reefs in Hawaii<\/a>"}, {"en": "ifaw <a href=\"https://archive.is/iyiV8\">Golden toads<\/a>"}, {"en": "Nature <a href=\"https://www.nature.com/articles/s41559-018-0772-3\">Food web rewiring in a changing world<\/a>"}, {"en": "CMS <a href=\"https://archive.is/T4lR0\">Major New UN Report Finds Climate Change is Severely Impacting Migratory Species of Wild Animals<\/a>"}, {"en": "WWF <a href=\"https://archive.ph/MHv2p\">What is the sixth mass extinction and what can we do about it?<\/a>"}, {"en": "NOAA <a href=\"https://archive.is/uAW2Y\">Climate Change: Atmospheric Carbon Dioxide<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Biodiversity is declining, and global warming is a contributing factor.", "id": "Keanekaragaman hayati menurun dan pemanasan global merupakan salah satu faktor penyebabnya."}}, {"t": "p", "h": {"en": "Some species can adapt to environmental change, but many cannot evolve quickly enough, or at all. As habitats degrade and migration paths are blocked, many species have already disappeared, while more face extinction.", "id": "Beberapa spesies dapat beradaptasi terhadap perubahan lingkungan, namun banyak pula yang tidak dapat berevolusi cukup cepat, atau bahkan tidak berevolusi sama sekali. Ketika habitat terdegradasi dan jalur migrasi terhambat, banyak spesies telah punah, sementara lebih banyak lagi spesies yang menghadapi kepunahan."}}, {"t": "p", "h": {"en": "Adaptation often requires migration to better conditions, but human-made barriers like cities and dams block these paths. Climate change also disrupts migration cues, such as air or water temperature. Many species cannot migrate fast enough, like immobile coral reefs, or survive without specific habitats, like the now-extinct golden toad, confined to high-altitude Costa Rican forests made uninhabitable by human-induced climate changes.", "id": "Adaptasi seringkali memerlukan migrasi ke kondisi yang lebih baik, namun hambatan yang disebabkan oleh manusia seperti kota dan bendungan menghalangi jalan tersebut. Perubahan iklim juga mengganggu isyarat migrasi, seperti suhu udara atau air. Banyak spesies yang tidak dapat bermigrasi dengan cukup cepat, seperti terumbu karang yang tidak dapat bergerak, atau bertahan hidup tanpa habitat tertentu, seperti katak emas yang kini sudah punah, terkurung di hutan dataran tinggi Kosta Rika yang tidak dapat dihuni akibat perubahan iklim yang disebabkan oleh manusia."}}, {"t": "p", "h": {"en": "Since 1970, mammal, bird, fish, reptile, and amphibian populations have declined by an average of 68%. Scientists estimate current extinction rates are hundreds to thousands of times higher than natural.", "id": "Sejak tahun 1970, populasi mamalia, burung, ikan, reptil, dan amfibi telah menurun rata-rata sebesar 68%. Para ilmuwan memperkirakan tingkat kepunahan saat ini ratusan hingga ribuan kali lebih tinggi dibandingkan tingkat kepunahan alami."}}, {"t": "p", "h": {"en": "Climate change, habitat destruction, pollution, and overexploitation are all driving biodiversity loss, threatening ecosystems’ balance worldwide.", "id": "Perubahan iklim, perusakan habitat, polusi, dan eksploitasi berlebihan menyebabkan hilangnya keanekaragaman hayati dan mengancam keseimbangan ekosistem di seluruh dunia."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/species\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-global-warming-promoting-biodiversity\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/species\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-global-warming-promoting-biodiversity\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/N8GD-VNH9\">the one highlighted here<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/N8GD-VNH9\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Pemanasan global membuat makhluk hidup makin beragam.", "en": "Global warming increases biodiversity."}, "fakta": {"id": "Keanekaragaman hayati justru menurun. Banyak hewan dan tumbuhan tidak bisa menyesuaikan diri atau pindah cukup cepat.", "en": "Biodiversity is falling. Many species can't adapt or move fast enough."}, "kw": ""};</script>
