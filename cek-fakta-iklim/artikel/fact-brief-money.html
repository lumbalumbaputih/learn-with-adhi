<script>window.POST={"slug": "fact-brief-money", "fb": true, "date": "22 July 2025", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-money.html", "words": 375, "topic": "hoax", "title": {"en": "Fact brief - Is climate science a high-paying profession?", "id": "Fakta singkat - Apakah ilmu iklim merupakan profesi bergaji tinggi?"}, "verdict": "No", "question": {"en": "Is climate science a high-paying profession?", "id": "Apakah ilmu iklim merupakan profesi bergaji tinggi?"}, "sources": [{"en": "The New York Times <a href=\"https://archive.md/1aBQq\">The Baseless Claim That Climate Scientists Are ‘Driven’ by Money<\/a>"}, {"en": "Ars Technica <a href=\"https://arstechnica.com/science/2016/05/if-climate-scientists-push-the-consensus-its-not-for-the-money/\">If climate scientists are in it for the money, they’re doing it wrong<\/a>"}, {"en": "Global Warming: Man or Myth? <a href=\"https://web.archive.org/web/20241203112106/https://profmandia.wordpress.com/2010/03/11/taking-the-money-for-granted-%E2%80%93-part-i/\">Scientists can also wear their citizen hats Taking the Money for Grant(ed) – Part I<\/a>"}, {"en": "ZipRecruiter <a href=\"https://www.ziprecruiter.com/Salaries/Climate-Scientist-Salary#Yearly\">Climate Scientist Salary<\/a>"}, {"en": "Glassdoor <a href=\"https://www.glassdoor.com/Salaries/climate-scientist-salary-SRCH_KO0,17.htm\">Climate Scientist Salaries<\/a>"}, {"en": "RaiseMe <a href=\"https://www.raise.me/careers/life-physical-and-social-science/atmospheric-scientists-including-meteorologists/climate-scientists/\">Climate scientists: Salary, career path, job outlook, education and more<\/a>"}, {"en": "Yahoo Finance <a href=\"https://finance.yahoo.com/news/rich-big-oil-executives-180008555.html?guccounter=1\">Here’s How Rich All the Big Oil Executives Are<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Climate scientists are paid for their work, but grants primarily fund research expenses, not personal gain. The field offers modest salaries relative to other accessible professions.", "id": "Ilmuwan iklim dibayar untuk pekerjaan mereka, namun hibah terutama mendanai biaya penelitian, bukan keuntungan pribadi. Bidang ini menawarkan gaji yang sederhana dibandingkan dengan profesi lain yang dapat diakses."}}, {"t": "p", "h": {"en": "Scientific research is expensive and competitive. Grants fund equipment, lab space, travel, data collection, and salaries for entire teams, not single individuals. A $400,000 grant might pay a scientist less than $17,000 annually over three years.", "id": "Penelitian ilmiah itu mahal dan kompetitif. Hibah mendanai peralatan, ruang laboratorium, perjalanan, pengumpulan data, dan gaji untuk seluruh tim, bukan individu. Hibah sebesar $400,000 mungkin akan memberikan gaji kepada ilmuwan kurang dari $17,000 per tahun selama tiga tahun."}}, {"t": "p", "h": {"en": "The average yearly salary of a U.S. climate researcher is $90,000 per year, comparable to IT administrators rather than CEOs.", "id": "Gaji tahunan rata-rata seorang peneliti iklim AS adalah $90.000 per tahun, sebanding dengan administrator TI dan bukan CEO."}}, {"t": "p", "h": {"en": "The claim that climate scientists fabricate results for money ignores the accountability and transparency built into grant systems. Funds are awarded based on peer-reviewed proposals, and all spending must be justified and reported.", "id": "Klaim bahwa ilmuwan iklim mengarang hasil demi uang mengabaikan akuntabilitas dan transparansi yang dibangun dalam sistem hibah. Dana diberikan berdasarkan proposal yang ditinjau oleh rekan sejawat, dan semua pengeluaran harus dibenarkan dan dilaporkan."}}, {"t": "p", "h": {"en": "Such specialists who are “in it for the money” would likely work in more lucrative private sectors like oil or gas industries, whose executives make $20 million per year.", "id": "Para spesialis yang “berusaha demi uang” kemungkinan besar akan bekerja di sektor swasta yang lebih menguntungkan seperti industri minyak atau gas, yang para eksekutifnya menghasilkan $20 juta per tahun."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/money\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-climate-science-a-high-paying-profession/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/money\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-climate-science-a-high-paying-profession/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://web.archive.org/web/20150327091902/https://www.nationalreview.com/article/414359/global-warming-follow-money-henry-payne/\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://web.archive.org/web/20150327091902/https://www.nationalreview.com/article/414359/global-warming-follow-money-henry-payne/\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Ilmuwan iklim cuma cari uang.", "en": "Climate scientists are only in it for the money."}, "fakta": {"id": "Dana penelitian dipakai untuk alat, data, dan gaji seluruh tim. Gaji ilmuwan iklim biasa saja dibanding banyak pekerjaan lain.", "en": "Research grants pay for equipment, data and whole teams. Climate scientists' pay is ordinary compared with many other jobs."}, "kw": "uang gaji dibayar proyek bisnis dana"};</script>
