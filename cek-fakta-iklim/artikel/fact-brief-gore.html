<script>window.POST={"slug": "fact-brief-gore", "fb": true, "date": "7 October 2025", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-gore.html", "words": 392, "topic": "hoax", "title": {"en": "Fact brief - Do errors in Al Gore's 'An Inconvenient Truth' disprove climate change?", "id": "Fakta singkat - Apakah kesalahan dalam 'An Inconvenient Truth' karya Al Gore menyangkal perubahan iklim?"}, "verdict": "No", "question": {"en": "Do errors in Al Gore's 'An Inconvenient Truth' disprove climate change?", "id": "Apakah kesalahan dalam 'An Inconvenient Truth' karya Al Gore menyangkal perubahan iklim?"}, "sources": [{"en": "HowStuffWorks <a href=\"https://science.howstuffworks.com/environmental/conservation/conservationists/inconvenient-truth-sequel-al-gore.htm\">What 'An Inconvenient Truth' Got Right (And Wrong) About Climate Change<\/a>"}, {"en": "DeSmog <a href=\"https://www.desmog.com/2007/10/15/an-inconvenient-judgment-u-k-court-actually-endorsed-gores-film/\">An Inconvenient Judgment? U.K. Court Actually Endorsed Gore's Film<\/a>"}, {"en": "ScienceLine <a href=\"https://scienceline.org/2008/12/ask-rettner-sea-level-rise-al-gore-an-inconvenient-truth/\">Al Gore’s movie ‘An Inconvenient Truth’ says sea levels could rise up to 20 feet. Is this true?<\/a>"}, {"en": "NOAA <a href=\"https://web.archive.org/web/20250206042627/https://www.climate.gov/news-features/understanding-climate/climate-change-mountain-glaciers\">Climate Change: Mountain glaciers<\/a>"}, {"en": "Environmental Research Letters <a href=\"https://doi.org/10.1088/1748-9326/11/4/048002\">Consensus on consensus: a synthesis of consensus estimates on human-caused global warming<\/a>"}, {"en": "NASA <a href=\"https://web.archive.org/web/20251002185232/https://science.nasa.gov/climate-change/scientific-consensus/\">Scientific Consensus<\/a>"}, {"en": "Environmental Law Alliance Worldwide <a href=\"https://elaw.org/resource/uk-stuart-dimmock-v-secretary-state-education-and-skills-2007-ewhc-2288-admin-inconvenient-t\">Stuart Dimmock v. Secretary of State for Education and Skills, [2007] EWHC 2288 (Admin) (Inconvenient Truth case)<\/a>"}], "blocks": [{"t": "p", "h": {"en": "While Gore’s 2006 documentary proved incorrect about the extent and timeline of some predictions, it does not negate the reality, confirmed by decades of peer-reviewed evidence, that humans are warming the planet.", "id": "Meskipun film dokumenter Gore pada tahun 2006 terbukti salah mengenai cakupan dan jangka waktu beberapa prediksi, hal ini tidak meniadakan kenyataan, yang dikonfirmasi oleh bukti-bukti yang telah ditinjau selama puluhan tahun, bahwa manusia sedang memanaskan planet ini."}}, {"t": "p", "h": {"en": "One erroneous claim is that Kilimanjaro’s ice loss was driven mainly by warming. Research now indicates sublimation and local dryness as dominant causes.", "id": "Salah satu klaim yang keliru adalah hilangnya es di Kilimanjaro terutama disebabkan oleh pemanasan. Penelitian kini menunjukkan sublimasi dan kekeringan lokal sebagai penyebab dominan."}}, {"t": "p", "h": {"en": "Another is that sea levels could rise by 20 feet in the near future as ice sheets face imminent collapse – outcomes scientists expect over longer timescales than the documentary stated.", "id": "Alasan lainnya adalah bahwa permukaan air laut akan naik setinggi 20 kaki dalam waktu dekat karena lapisan es akan segera runtuh – hasil yang diharapkan para ilmuwan dalam jangka waktu yang lebih lama daripada yang dinyatakan dalam film dokumenter tersebut."}}, {"t": "p", "h": {"en": "These errors do not change the general facts: glaciers worldwide are melting and seas are rising due to human-emitted heat-trapping greenhouse gases.", "id": "Kesalahan-kesalahan ini tidak mengubah fakta umum: gletser di seluruh dunia mencair dan permukaan air laut meningkat akibat gas rumah kaca yang memerangkap panas yang dihasilkan manusia."}}, {"t": "p", "h": {"en": "A 2007 U.K. court review found the film “substantially founded upon scientific research and fact” but required schoolteachers to clarify speculative or exaggerated points for students.", "id": "Tinjauan pengadilan di Inggris pada tahun 2007 menemukan bahwa film tersebut “secara substansial didasarkan pada penelitian dan fakta ilmiah” tetapi mengharuskan guru sekolah untuk mengklarifikasi poin-poin yang spekulatif atau berlebihan kepada siswa."}}, {"t": "p", "h": {"en": "Inaccuracies in Gore’s presentation do not disprove the broad, robust scientific consensus on human-caused climate change.", "id": "Ketidakakuratan dalam presentasi Gore tidak menyangkal konsensus ilmiah yang luas dan kuat mengenai perubahan iklim yang disebabkan oleh manusia."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/gore\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/do-errors-in-al-gores-an-inconvenient-truth-disprove-climate-change/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/gore\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/do-errors-in-al-gores-an-inconvenient-truth-disprove-climate-change/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://www.theguardian.com/environment/2007/oct/11/climatechange?gusrc=rss&feed=networkfront\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://www.theguardian.com/environment/2007/oct/11/climatechange?gusrc=rss&feed=networkfront\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Ada kesalahan di film Al Gore, jadi perubahan iklim itu bohong.", "en": "Errors in Al Gore's film prove climate change is fake."}, "fakta": {"id": "Beberapa perkiraan di film tahun 2006 itu memang keliru, tapi puluhan tahun penelitian tetap membuktikan bahwa manusia memanaskan Bumi.", "en": "Some predictions in the 2006 film were wrong, but decades of research still show humans are warming the planet."}, "kw": "al gore film"};</script>
