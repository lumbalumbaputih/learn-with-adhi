<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas - Perbedaan cuaca dan iklim</h1><p>Cuaca hanya bisa diramal dengan baik untuk beberapa hari ke depan. Iklim berbeda: iklim adalah pola rata-rata selama puluhan tahun, yang bisa diperkirakan dari hal-hal besar seperti jumlah gas rumah kaca. Jadi sulitnya meramal cuaca tidak berarti iklim tidak bisa diperkirakan.</p><p><a href="https://skepticalscience.com/at-a-glance-weather.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-weather", "fb": false, "date": "23 April 2024", "byline": "John Mason, BaerbelW", "url": "https://skepticalscience.com/at-a-glance-weather.html", "words": 1190, "topic": "warm", "title": {"en": "At a glance - The difference between weather and climate", "id": "Sekilas - Perbedaan cuaca dan iklim"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-weather/c03e3def3e.webp", "w": 570, "hh": 327, "alt": "Fact-Myth-Box"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "How do you go about weather forecasting by yourself? Study the computer models. With experience, you will become familiar with the art - for it takes human interpretation of model output to make the calls. That's what weathermen do.", "id": "Bagaimana cara Anda melakukan prakiraan cuaca sendiri? Pelajari model komputer. Dengan pengalaman, Anda akan menjadi akrab dengan seni - karena dibutuhkan interpretasi manusia terhadap keluaran model untuk membuat keputusan tersebut. Itulah yang dilakukan ahli cuaca."}}, {"t": "p", "h": {"en": "Forecast model output is freely available online and covers many parameters - pressure, temperature, rainfall and a myriad of others. Different models extend to different end-times - the Global Forecasting System (GFS) extends to T+ 384 hours or 16 days, for example. Pressure, or synoptic charts as they are known, portray the positions and subsequent developments of high and low pressure systems over large swathes of the planet.", "id": "Keluaran model prakiraan tersedia online secara gratis dan mencakup banyak parameter - tekanan, suhu, curah hujan, dan banyak parameter lainnya. Model yang berbeda mempunyai rentang waktu akhir yang berbeda - misalnya Sistem Peramalan Global (GFS) yang memiliki rentang waktu hingga T+ 384 jam atau 16 hari. Tekanan, atau yang dikenal dengan grafik sinoptik, menggambarkan posisi dan perkembangan selanjutnya dari sistem tekanan tinggi dan rendah di sebagian besar planet ini."}}, {"t": "p", "h": {"en": "Models are run several times a day. If you examine synoptic charts for the same run of several different models, you will see they all look very similar to start with. But if you then follow them through successive time-points - T+24, 48, 72 hours and so on, there will come a point where you start to notice slight and then larger differences between them. This divergence is where confidence in forecasting falls right away.", "id": "Model dijalankan beberapa kali sehari. Jika Anda memeriksa bagan sinoptik untuk beberapa model yang berbeda, Anda akan melihat semuanya terlihat sangat mirip pada awalnya. Namun jika Anda mengikutinya melalui titik waktu yang berurutan - T+24, 48, 72 jam dan seterusnya, akan tiba saatnya Anda mulai melihat perbedaan kecil dan kemudian perbedaan yang lebih besar di antara keduanya. Divergensi inilah yang menyebabkan kepercayaan terhadap peramalan langsung menurun."}}, {"t": "p", "h": {"en": "Forecasting - interpreting the GFS and other model output - is about working with uncertainty in the highly dynamic and to an extent chaotic medium that is our atmosphere. But with experience, you can do your own short term forecasting too, at least for the coming 3-5 days.", "id": "Peramalan – menafsirkan GFS dan keluaran model lainnya – adalah tentang bekerja dengan ketidakpastian dalam medium yang sangat dinamis dan sampai batas tertentu kacau yaitu atmosfer kita. Namun dengan pengalaman, Anda juga bisa melakukan peramalan jangka pendek sendiri, setidaknya untuk 3-5 hari mendatang."}}, {"t": "p", "h": {"en": "Longer-term weather forecasting a week or more in advance is about stating probabilities, not saying what will happen. Very different things. Serious amateur forecasters stick to the shorter, next few days bracket, if they want to avoid egg on their faces. There are a few out there who often make wild claims that usually fail to be borne out by reality. Unfortunately, sections of the more populist media happily quote them. It generates click-baity headlines.", "id": "Prakiraan cuaca jangka panjang satu minggu atau lebih sebelumnya adalah tentang menyatakan probabilitas, bukan mengatakan apa yang akan terjadi. Hal yang sangat berbeda. Peramal cuaca amatir yang serius akan memilih rentang waktu yang lebih pendek, yaitu beberapa hari ke depan, jika mereka ingin menghindari risiko yang mungkin terjadi. Ada beberapa di luar sana yang sering melontarkan klaim liar yang biasanya tidak terbukti dalam kenyataan. Sayangnya, sebagian media yang lebih populis dengan senang hati mengutipnya. Ini menghasilkan berita utama yang bersifat click-bait."}}, {"t": "p", "h": {"en": "Now, what about climate? Climate differs from weather because it includes certain highly deterministic drivers. Deterministic means they evolve independently of weather but can change the physical conditions on Earth from state A to state B. Cyclic variations in Earth's orbit of the Sun, operating over tens of thousands of years, are a good example. They may only drive average planetary temperature changes of a few degrees Celsius, upwards or downwards. But with the help of climate feedbacks, that is enough to have caused past ice-ages - and to have gotten us out of them again.", "id": "Sekarang, bagaimana dengan iklim? Iklim berbeda dengan cuaca karena iklim mencakup faktor-faktor pendorong tertentu yang sangat deterministik. Deterministik berarti mereka berevolusi secara independen dari cuaca namun dapat mengubah kondisi fisik di Bumi dari keadaan A ke keadaan B. Variasi siklik dalam orbit Bumi terhadap Matahari, yang berlangsung selama puluhan ribu tahun, adalah contoh yang baik. Hal ini mungkin hanya mendorong perubahan suhu rata-rata planet beberapa derajat Celsius, naik atau turun. Namun dengan bantuan masukan iklim, hal ini sudah cukup untuk menyebabkan zaman es di masa lalu - dan membuat kita keluar dari masa itu lagi."}}, {"t": "p", "h": {"en": "Changes in the strength of Earth's greenhouse effect are likewise deterministic, but to a far greater extent. They have forced past transitions from the Hothouse to the Icehouse climate state. Hothouse, by the way, is an ice-free Earth. Because we know how the greenhouse effect works, we can say with confidence that intensifying its strength will cause global temperatures to rise over centuries. What we cannot say is what weather will occur on a certain day at a certain place, decades from now. But there's a handy saying to cover that: \"climate trains the boxer, but the weather throws the punches\". <em>(Deke Arndt, Climate Monitoring Branch Chief, NCDC, 2010)<\/em>", "id": "Perubahan kekuatan efek rumah kaca di bumi juga bersifat deterministik, namun dalam tingkatan yang jauh lebih besar. Mereka telah memaksakan transisi dari kondisi iklim Hothouse ke Icehouse. Omong-omong, Hothouse adalah Bumi yang bebas es. Karena kita mengetahui cara kerja efek rumah kaca, kita dapat mengatakan dengan yakin bahwa peningkatan kekuatannya akan menyebabkan suhu global meningkat selama berabad-abad. Apa yang tidak bisa kita katakan adalah cuaca apa yang akan terjadi pada hari tertentu di tempat tertentu, beberapa dekade dari sekarang. Namun ada pepatah praktis yang menjelaskan hal tersebut: \"iklim melatih petinju, tetapi cuacalah yang memberikan pukulan\". <em>(Deke Arndt, Kepala Cabang Pemantauan Iklim, NCDC, 2010)<\/em>"}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/weather-forecasts-vs-climate-models-predictions.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.38635
