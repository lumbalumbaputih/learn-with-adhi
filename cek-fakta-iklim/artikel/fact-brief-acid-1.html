<main id="app" class="wrap" tabindex="-1"><noscript><h1>“Laut tidak menjadi asam karena pH-nya masih di atas 7.”</h1><p><b>SALAH.</b> Faktanya: Pengasaman artinya pH turun dari biasanya. Walaupun masih di atas 7, pH laut sudah turun dari 8,2 menjadi 8,1 sejak Revolusi Industri.</p><p><a href="https://skepticalscience.com/fact-brief-acid-1.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "fact-brief-acid-1", "fb": true, "date": "8 June 2024", "byline": "SkS-Team", "url": "https://skepticalscience.com/fact-brief-acid-1.html", "words": 310, "topic": "ocean", "title": {"en": "Fact Brief - Is the ocean acidifying?", "id": "Fakta Singkat - Apakah lautan menjadi asam?"}, "verdict": "Yes", "question": {"en": "Is the ocean acidifying?", "id": "Apakah lautan menjadi asam?"}, "sources": [{"en": "Smithsonian Ocean <a href=\"https://ocean.si.edu/ocean-life/invertebrates/ocean-acidification\">Ocean Acidification<\/a>"}, {"en": "Encyclopædia Britannica <a href=\"https://www.britannica.com/science/pH\">PH | Definition, Uses, & Facts<\/a>"}, {"en": "National Oceanic and Atmospheric Administration <a href=\"https://oceanservice.noaa.gov/facts/acidification.html\">What is Ocean Acidification?<\/a>"}, {"en": "European Environment Agency <a href=\"https://www.eea.europa.eu/en/analysis/indicators/ocean-acidification\">Ocean acidification<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Acidification of oceans simply means a reduction in their pH outside of normal values.", "id": "Pengasaman lautan berarti penurunan pH di luar nilai normal."}}, {"t": "p", "h": {"en": "The pH scale measures acidity and alkalinity of water-based solutions. It runs from 0 (highly acidic) through 7 (neutral) to 14 (highly alkaline). Any reduction in pH value, in the direction of 0, is acidification. The oceans acidify whenever they become less alkaline, regardless of whether their pH declines below 7.", "id": "Skala pH mengukur keasaman dan alkalinitas larutan berbasis air. Mulai dari 0 (sangat asam) hingga 7 (netral) hingga 14 (sangat basa). Setiap penurunan nilai pH, ke arah 0, disebut pengasaman. Lautan menjadi asam setiap kali basanya berkurang, terlepas dari apakah pHnya turun di bawah 7."}}, {"t": "p", "h": {"en": "A good analogy for acidification can be found with the way we talk about temperatures. If the pH of a solution shifts from 8.1 to 7.9, that is acidification, even though the solution remains slightly alkaline. In the same way, if the temperature rises from -40°C to -15°C, it has definitely warmed up, even though it's still freezing cold.", "id": "Analogi yang baik untuk pengasaman dapat ditemukan pada cara kita berbicara tentang suhu. Jika pH suatu larutan berubah dari 8,1 menjadi 7,9, maka terjadi pengasaman, meskipun larutannya tetap sedikit basa. Begitu pula jika suhu naik dari -40°C menjadi -15°C, pasti sudah menghangat, padahal suhunya masih sangat dingin."}}, {"t": "p", "h": {"en": "Since the Industrial Revolution, ocean pH has declined from 8.2 to 8.1 — a 30% increase in acidity.", "id": "Sejak Revolusi Industri, pH laut telah menurun dari 8,2 menjadi 8,1 – peningkatan keasaman sebesar 30%."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/acid\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-it-correct-to-speak-of-ocean-acidification\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/acid\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-it-correct-to-speak-of-ocean-acidification\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://web.archive.org/web/20130123132110/http://www.ozclimatesense.com/2010/06/ocean-acidification-sea-is-alkaline-you.html\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://web.archive.org/web/20130123132110/http://www.ozclimatesense.com/2010/06/ocean-acidification-sea-is-alkaline-you.html\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Laut tidak menjadi asam karena pH-nya masih di atas 7.", "en": "The ocean isn't acidifying because its pH is above 7."}, "fakta": {"id": "Pengasaman artinya pH turun dari biasanya. Walaupun masih di atas 7, pH laut sudah turun dari 8,2 menjadi 8,1 sejak Revolusi Industri.", "en": "Acidification means pH dropping from normal. Ocean pH fell from 8.2 to 8.1 since the Industrial Revolution."}, "kw": "asam laut ph kerang"};</script>
