<script>window.POST={"slug": "fact-brief-elnino", "fb": true, "date": "8 July 2025", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-elnino.html", "words": 351, "topic": "elnino", "title": {"en": "Fact brief - Is global warming just due to El Niño?", "id": "Fakta singkat - Apakah pemanasan global hanya disebabkan oleh El Niño?"}, "verdict": "No", "question": {"en": "Is global warming just due to El Niño?", "id": "Apakah pemanasan global hanya disebabkan oleh El Niño?"}, "sources": [{"en": "NOAA <a href=\"https://web.archive.org/web/20250628121746/https://www.climate.gov/news-features/blogs/enso/what-el-nino-southern-oscillation-enso-nutshell\">What is the El Niño–Southern Oscillation (ENSO) in a nutshell?<\/a>"}, {"en": "NOAA <a href=\"https://web.archive.org/web/20250203021825/https://www.climate.gov/news-features/understanding-climate/can-we-blame-el-ni%C3%B1o\">Can We Blame El Niño?<\/a>"}, {"en": "Journal of Geophysical Research <a href=\"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2009JD012960\">Comment on “Influence of the Southern Oscillation on tropospheric temperature” by J. D. McLean, C. R. de Freitas, and R. M. Carter<\/a>"}], "blocks": [{"t": "p", "h": {"en": "El Niño Southern Oscillation is a short-term and cyclical weather phenomenon caused by alternating wind patterns that result in heat exchange between the ocean and the atmosphere; it cannot explain long-term warming.", "id": "Osilasi Selatan El Niño adalah fenomena cuaca jangka pendek dan bersiklus yang disebabkan oleh pola angin bergantian yang mengakibatkan pertukaran panas antara laut dan atmosfer; hal ini tidak dapat menjelaskan pemanasan jangka panjang."}}, {"t": "p", "h": {"en": "El Niño originates when westward moving trade winds weaken, allowing warm surface waters to shift east across the tropical Pacific. This reverses the La Niña pattern, where trade winds push warm surface water toward Asia, upwelling cold water off the coast of South America.", "id": "El Niño terjadi ketika angin pasat yang bergerak ke arah barat melemah, menyebabkan air permukaan yang hangat berpindah ke timur melintasi Pasifik tropis. Hal ini membalikkan pola La Niña, dimana angin pasat mendorong air permukaan yang hangat menuju Asia, sehingga air dingin naik ke lepas pantai Amerika Selatan."}}, {"t": "p", "h": {"en": "During El Niño, heat is transferred from the ocean to the atmosphere, causing warming, while La Niña occurs when heat moves from the atmosphere to the ocean, causing cooling. Energy is moved around the climate system without adding any heat.", "id": "Pada saat El Niño, panas berpindah dari laut ke atmosfer sehingga menyebabkan pemanasan, sedangkan La Niña terjadi ketika panas berpindah dari atmosfer ke laut sehingga menyebabkan pendinginan. Energi dipindahkan ke seluruh sistem iklim tanpa menambah panas."}}, {"t": "p", "h": {"en": "In contrast, climate science research indicates human-caused CO₂ is the primary driver of today’s warming. Human activities that increase greenhouse concentrations in the atmosphere cause less heat to escape the atmosphere, resulting in additional and non-cyclical warming.", "id": "Sebaliknya, penelitian ilmu iklim menunjukkan bahwa CO₂ yang disebabkan oleh aktivitas manusia adalah penyebab utama pemanasan saat ini. Aktivitas manusia yang meningkatkan konsentrasi rumah kaca di atmosfer menyebabkan lebih sedikit panas yang keluar dari atmosfer, sehingga mengakibatkan pemanasan tambahan dan non-siklus."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/elnino\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-global-warming-just-due-to-el-nino/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/elnino\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-global-warming-just-due-to-el-nino/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://archive.md/GPUiJ#selection-359.0-359.325:~:text=%E2%80%9CThe%20close%20relationship,and%20solar%20changes.%E2%80%9D\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.md/GPUiJ#selection-359.0-359.325:~:text=%E2%80%9CThe%20close%20relationship,and%20solar%20changes.%E2%80%9D\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Pemanasan global cuma gara-gara El Niño.", "en": "Global warming is just El Niño."}, "fakta": {"id": "El Niño datang dan pergi setiap beberapa tahun. Ia tidak bisa menjelaskan suhu Bumi yang naik terus selama puluhan tahun.", "en": "El Niño comes and goes every few years. It can't explain decades of steady warming."}, "local": {"id": "Menurut BMKG, El Niño membuat curah hujan turun di hampir seluruh Indonesia, terutama pada bulan Juni sampai November. Pada akhir Juli 2026, BMKG menyebut El Niño tahun ini kuat dan akan bertahan setidaknya sampai awal 2027, sehingga banyak daerah menghadapi kemarau yang lebih panjang.", "en": "According to Indonesia's weather agency BMKG, El Niño reduces rainfall across almost all of Indonesia, especially from June to November. In late July 2026 BMKG said this year's El Niño is strong and will last at least until early 2027, so many areas face a longer dry season.", "src": [{"t": "BMKG: La Niña dan El Niño", "u": "https://cews.bmkg.go.id/enso-tentang.php"}, {"t": "BMKG, siaran pers 30 Juli 2026", "u": "https://www.bmkg.go.id/siaran-pers/musim-kemarau-di-bawah-normal-dan-el-nino-kuat-bmkg-gencarkan-modifikasi-cuaca-dan-dukung-mitigasi-lintas-sektor"}]}, "kw": "el nino la nina alami siklus"};</script>
