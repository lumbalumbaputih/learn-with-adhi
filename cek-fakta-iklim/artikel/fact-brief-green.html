<main id="app" class="wrap" tabindex="-1"><noscript><h1>“Dulu Greenland sangat hangat sampai orang Viking bisa bersantai di pantai.”</h1><p><b>SALAH.</b> Faktanya: Selatan Greenland memang punya sedikit tanaman saat itu, tapi tidak pernah sehangat daerah pantai tropis. Nama Greenland dipilih untuk menarik pendatang.</p><p><a href="https://skepticalscience.com/fact-brief-green.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "fact-brief-green", "fb": true, "date": "17 May 2025", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-green.html", "words": 347, "topic": "warm", "title": {"en": "Fact brief - Did Viking settlers enjoy a warm beach climate in Greenland?", "id": "Fakta singkat - Apakah pemukim Viking menikmati iklim pantai yang hangat di Greenland?"}, "verdict": "No", "question": {"en": "Did Viking settlers enjoy a warm beach climate in Greenland?", "id": "Apakah pemukim Viking menikmati iklim pantai yang hangat di Greenland?"}, "sources": [{"en": "The Washington Post <a href=\"https://web.archive.org/web/20230430190105/https://www.washingtonpost.com/climate-environment/2023/04/28/vikings-greenland-sea-level-rise-climate/\">Here’s the real reason the Vikings left Greenland<\/a>"}, {"en": "University of Maryland <a href=\"https://web.archive.org/web/20241013111138/https://www.geol.umd.edu/sgc/elevator/elevator5.html\">Greenland was Green/Ice Free in the Viking Times: Brief Responses to Climate Change Denialism Statements<\/a>"}, {"en": "The Conversation <a href=\"https://web.archive.org/web/20250513114603/https://theconversation.com/climate-explained-what-was-the-medieval-warm-period-155294\">Climate explained: what was the Medieval warm period?<\/a>"}, {"en": "Science <a href=\"https://web.archive.org/web/20241120212856/http://www.meteo.psu.edu/holocene/public_html/shared/articles/MannetalScience09.pdf\">Global Signatures and Dynamical Origins of the Little Ice Age and Medieval Climate Anomaly<\/a>"}, {"en": "Columbia Climate School <a href=\"https://web.archive.org/web/20250511152731/https://news.climate.columbia.edu/2015/12/04/study-undercuts-idea-that-medieval-warm-period-was-global/\">Study Undercuts Idea That ‘Medieval Warm Period’ Was Global<\/a>"}], "blocks": [{"t": "p", "h": {"en": "While Greenland’s southern coast supported some vegetation in the Medieval warm period (950-1250 CE), it was not warm enough for a beach climate.", "id": "Meskipun pesisir selatan Greenland mendukung beberapa vegetasi pada periode hangat Abad Pertengahan (950-1250 M), namun tidak cukup hangat untuk iklim pantai."}}, {"t": "p", "h": {"en": "The period was primarily a regional event, affecting Europe and parts of the North Atlantic. Studies of glacial sediment in Greenland indicate glaciers were near their maximum extent during these years. This suggests Greenland did not experience the same degree of warming as continental Europe. Exile Erik the Red chose the name \"Greenland\" to attract settlers rather than accurately describe the landscape.", "id": "Periode ini terutama merupakan peristiwa regional, yang mempengaruhi Eropa dan sebagian Atlantik Utara. Studi sedimen glasial di Greenland menunjukkan gletser mendekati batas maksimumnya selama tahun-tahun tersebut. Hal ini menunjukkan Greenland tidak mengalami tingkat pemanasan yang sama seperti benua Eropa. Erik si Merah di pengasingan memilih nama \"Greenland\" untuk menarik pemukim daripada menggambarkan lanskap secara akurat."}}, {"t": "p", "h": {"en": "Vikings settled certain areas of Greenland during these years, but abandoned their settlements after the Medieval warm period ended and the Little Ice Age began. Their experience shows how a changing climate can cause forced migration.", "id": "Bangsa Viking menetap di wilayah tertentu di Greenland selama tahun-tahun ini, namun meninggalkan pemukiman mereka setelah periode hangat Abad Pertengahan berakhir dan Zaman Es Kecil dimulai. Pengalaman mereka menunjukkan bagaimana perubahan iklim dapat menyebabkan migrasi paksa."}}, {"t": "p", "h": {"en": "The Medieval warm period was caused by high solar activity and low volcanic activity. In contrast, today’s climate change is caused by human emissions of heat-trapping greenhouse gases.", "id": "Periode hangat Abad Pertengahan disebabkan oleh aktivitas matahari yang tinggi dan aktivitas vulkanik yang rendah. Sebaliknya, perubahan iklim saat ini disebabkan oleh emisi gas rumah kaca yang memerangkap panas oleh manusia."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/green\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/did-viking-settlers-enjoy-a-warm-beach-climate-in-greenland/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/green\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/did-viking-settlers-enjoy-a-warm-beach-climate-in-greenland/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://web.archive.org/web/20120310062513/http:/www.news.harvard.edu/gazette/2003/04.24/01-weather.html#:~:text=Vikings%20enjoy%20Greenland%20beaches\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://web.archive.org/web/20120310062513/http:/www.news.harvard.edu/gazette/2003/04.24/01-weather.html#:~:text=Vikings%20enjoy%20Greenland%20beaches\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Dulu Greenland sangat hangat sampai orang Viking bisa bersantai di pantai.", "en": "Vikings enjoyed a warm beach climate in Greenland."}, "fakta": {"id": "Selatan Greenland memang punya sedikit tanaman saat itu, tapi tidak pernah sehangat daerah pantai tropis. Nama Greenland dipilih untuk menarik pendatang.", "en": "Southern Greenland had some plants then, but it was never beach-warm. The name was chosen to attract settlers."}, "kw": "greenland viking hijau"};</script>
