<script>window.POST={"slug": "fact-brief-climategate", "fb": true, "date": "13 July 2024", "byline": "John Mason, BaerbelW, Ken Rice", "url": "https://skepticalscience.com/fact-brief-climategate.html", "words": 324, "topic": "hoax", "title": {"en": "Fact brief - Were scientists caught falsifying data in the hacked emails incident dubbed 'climategate'?", "id": "Fakta singkat - Apakah para ilmuwan kedapatan memalsukan data dalam insiden peretasan email yang dijuluki 'climategate'?"}, "verdict": "No", "question": {"en": "Were scientists caught falsifying data in the hacked emails incident dubbed 'climategate'?", "id": "Apakah para ilmuwan kedapatan memalsukan data dalam insiden peretasan email yang dijuluki 'climategate'?"}, "sources": [{"en": "Skeptical Science <a href=\"https://sks.to/climategate\">List of 'climategate' investigations<\/a>"}, {"en": "Guardian <a href=\"https://www.theguardian.com/environment/2010/jul/07/hacked-climate-emails-analysis\">The five key leaked emails from UEA's Climatic Research Unit<\/a>"}, {"en": "NASA <a href=\"https://climate.nasa.gov/vital-signs/global-temperature/?intent=121\">Vital Signs - limate Change: Vital Signs of the Planet<\/a>"}, {"en": "BBC <a href=\"https://www.bbc.com/news/uk-england-norfolk-59176497\">COP26: Former sceptic apologises for role in Climategate<\/a>"}], "blocks": [{"t": "img", "src": "images/fact-brief-climategate/50052fab45.webp", "w": 200, "hh": 59, "alt": "no"}, {"t": "p", "h": {"en": "Nine separate investigations found that climate scientists involved in the “climategate” controversy did not falsify data.", "id": "Sembilan investigasi terpisah menemukan bahwa para ilmuwan iklim yang terlibat dalam kontroversi “Climategate” tidak memalsukan data."}}, {"t": "p", "h": {"en": "In 2009, the Climatic Research Unit’s servers were hacked. One scientist was reported as saying that he “completed Mike’s nature trick” to “hide the decline” in an email. The “trick” in question simply refers to combining instrumental temperature data and tree ring data.", "id": "Pada tahun 2009, server Unit Penelitian Iklim diretas. Seorang ilmuwan dilaporkan mengatakan bahwa dia “menyelesaikan trik alami Mike” untuk “menyembunyikan penurunan” dalam email. “Trik” yang dimaksud hanyalah menggabungkan data suhu instrumental dan data lingkaran tahun pohon."}}, {"t": "p", "h": {"en": "“Hide the decline” referred not to a temperature decline, but a decline in the reliability of some tree rings as a temperature proxy. This had become an issue in data starting from the year 1960. Also known as the \"divergence problem,\" it had been discussed in the scientific literature since the mid 1990s — 15 years before \"climategate.\"", "id": "“Sembunyikan penurunannya” tidak mengacu pada penurunan suhu, namun penurunan keandalan beberapa lingkaran tahun pohon sebagai proksi suhu. Hal ini telah menjadi isu dalam data sejak tahun 1960. Juga dikenal sebagai \"masalah divergensi\", masalah ini telah dibahas dalam literatur ilmiah sejak pertengahan tahun 1990an - 15 tahun sebelum \"Climategate\"."}}, {"t": "p", "h": {"en": "Steve Mosher, who fueled the conspiracy theory, has since issued a public apology, acknowledging that the scientists’ work was accurate.", "id": "Steve Mosher, yang mengobarkan teori konspirasi, telah mengeluarkan permintaan maaf publik, mengakui bahwa pekerjaan para ilmuwan itu akurat."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/climategate\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/were-scientists-caught-falsifying-data-in-the-hacked-emails-incident-dubbed-climategate\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/climategate\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/were-scientists-caught-falsifying-data-in-the-hacked-emails-incident-dubbed-climategate\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://perma.cc/Q36D-9RRM\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/Q36D-9RRM\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Email ilmuwan yang bocor (Climategate) membuktikan data iklim dipalsukan.", "en": "Leaked emails ('Climategate') proved scientists faked data."}, "fakta": {"id": "Sembilan penyelidikan terpisah menemukan para ilmuwan tidak memalsukan data. Kalimat yang dipermasalahkan ternyata soal cara menggabungkan data.", "en": "Nine separate investigations found no data were faked. The quoted phrases were about how data sets were combined."}, "kw": "climategate email bocor data palsu"};</script>
