E3\">Fact Sheet: President Donald J. Trump Delegates Defense Production Act Authority with Respect to Recoverable Critical Minerals and Materials That Are Essential to Our National Defense<\/a>"}, {"en": "Columbia Law School Sabin Center for Climate Change Law <a href=\"https://scholarship.law.columbia.edu/sabin_climate_change/217/\">Rebutting 33 False Claims About Solar, Wind, and Electric Vehicles<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Global mineral supplies are large enough to support solar development for climate change mitigation.", "id": "Pasokan mineral global cukup besar untuk mendukung pengembangan tenaga surya untuk mitigasi perubahan iklim."}}, {"t": "p", "h": {"en": "A 2023 analysis of 75 emissions-reduction scenarios found that projected median mineral demand largely remains within known geological resources. Projected median demand for silver was about 68,000 metric tons, compared to 530,000 tons of estimated reserves; cadmium demand was 38,000 tons against 500,000 tons of reserves.", "id": "Analisis tahun 2023 terhadap 75 skenario pengurangan emisi menemukan bahwa perkiraan median permintaan mineral sebagian besar masih berada dalam batas sumber daya geologi yang diketahui. Proyeksi permintaan rata-rata perak adalah sekitar 68.000 metrik ton, dibandingkan dengan perkiraan cadangan 530.000 ton; permintaan kadmium adalah 38.000 ton dibandingkan cadangan 500.000 ton."}}, {"t": "p", "h": {"en": "Tellurium may constrain cadmium-telluride panels, a minority of the global solar market, but research suggests improved refining and material efficiency could substantially reduce this strain.", "id": "Telurium mungkin membatasi panel kadmium-tellurida, yang merupakan bagian minoritas dari pasar tenaga surya global, namun penelitian menunjukkan peningkatan pengilangan dan efisiensi bahan dapat mengurangi tekanan ini secara signifikan."}}, {"t": "p", "h": {"en": "Recycling can further reduce demand for newly mined minerals by recovering silver, copper, silicon, and other components for reuse in future panels. Recent innovations are improving recycling cost-effectiveness, while federal programs continue to support domestic mineral supply chains and recycling research.", "id": "Daur ulang selanjutnya dapat mengurangi permintaan mineral yang baru ditambang dengan memulihkan perak, tembaga, silikon, dan komponen lainnya untuk digunakan kembali pada panel di masa depan. Inovasi terkini meningkatkan efektivitas biaya daur ulang, sementara program federal terus mendukung rantai pasokan mineral dalam negeri dan penelitian daur ulang."}}, {"t": "p", "h": {"en": "The main challenge lies in expanding production and supply chains, not mineral shortages.", "id": "Tantangan utamanya terletak pada perluasan produksi dan rantai pasokan, bukan pada kekurangan mineral."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/solarmineral\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/are-there-enough-minerals-for-solar-power-expansion-to-help-mitigate-climate-change/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/solarmineral\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/are-there-enough-minerals-for-solar-power-expansion-to-help-mitigate-climate-change/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/GD59-UUTE\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/GD59-UUTE\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Bahan tambang di dunia tidak cukup untuk membuat banyak panel surya.", "en": "There aren't enough minerals to build lots of solar panels."}, "fakta": {"id": "Menurut penelitian tahun 2023, persediaan mineral yang sudah diketahui cukup. Tantangannya ada pada produksi dan pengiriman, bukan kekurangan bahan.", "en": "A 2023 study found known mineral supplies are enough. The
