<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas - Efek rumah kaca yang tak terkendali di Venus</h1><p>Venus dan Bumi berawal mirip, tapi Venus menjadi sangat panas karena atmosfernya penuh CO2 dan efek rumah kacanya lepas kendali. Artikel ini menjelaskan mengapa jalan kedua planet ini berbeda.</p><p><a href="https://skepticalscience.com/at-a-glance-venus.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-venus", "fb": false, "date": "30 January 2024", "byline": "John Mason, BaerbelW", "url": "https://skepticalscience.com/at-a-glance-venus.html", "words": 1177, "topic": "cause", "title": {"en": "At a glance - The runaway greenhouse effect on Venus", "id": "Sekilas - Efek rumah kaca yang tak terkendali di Venus"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-venus/7d58a5b569.webp", "w": 570, "hh": 309, "alt": "FactMythBox"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "Earth: we take its existence for granted. But when one looks at its early evolution, from around 4.56 billion years ago, the fact that we are here at all starts to look miraculous.", "id": "Bumi: kita menganggap remeh keberadaannya. Namun jika kita melihat evolusi awalnya, sekitar 4,56 miliar tahun yang lalu, fakta bahwa kita ada di sini mulai terlihat ajaib."}}, {"t": "p", "h": {"en": "Over billions of years, stars are born and then die. Our modern telescopes can observe such processes across the cosmos. So we have a reasonable idea of what happened when our own Solar System was young. It started out as a vast spinning disc of dust with the young Sun at its centre. What happened next?", "id": "Selama miliaran tahun, bintang-bintang lahir dan kemudian mati. Teleskop modern kita dapat mengamati proses serupa di seluruh kosmos. Jadi kita mempunyai gambaran yang masuk akal tentang apa yang terjadi ketika Tata Surya kita masih muda. Ini dimulai sebagai piringan debu besar yang berputar dengan Matahari muda sebagai pusatnya. Apa yang terjadi selanjutnya?"}}, {"t": "p", "h": {"en": "Readers who look up a lot at night will be familiar with shooting stars. These are small remnants of the early Solar System, drawn towards Earth's surface by our planet's gravitational pull. Billions of years ago, the same thing happened but on an absolutely massive scale. Fledgeling protoplanets attracted more and more matter to themselves. Lots of them collided. Eventually out of all this violent chaos, a few winners emerged, making up the Solar System as we now know it.", "id": "Pembaca yang sering melihat ke atas di malam hari pasti familiar dengan bintang jatuh. Ini adalah sisa-sisa kecil Tata Surya awal, yang ditarik ke permukaan bumi oleh tarikan gravitasi planet kita. Miliaran tahun yang lalu, hal yang sama terjadi tetapi dalam skala yang sangat besar. Protoplanet yang masih muda menarik lebih banyak materi ke dirinya sendiri. Banyak dari mereka bertabrakan. Akhirnya, dari semua kekacauan yang dahsyat ini, muncullah beberapa pemenang, yang membentuk Tata Surya seperti yang kita kenal sekarang."}}, {"t": "p", "h": {"en": "The early Solar system was also extremely hot. Even more heat was generated during the near-constant collisions and through the super-abundance of fiercely radioactive isotopes. Protoplanets became so hot that they went through a completely molten stage, during which heavy elements such as iron sank down through gravity, towards the centre. That's how their metallic cores formed. At the same time, the displaced lighter material rose, to form their silicate mantles. This dramatic process, that affected all juvenile rocky planets, is known as planetary differentiation.", "id": "Tata Surya awal juga sangat panas. Bahkan lebih banyak panas dihasilkan selama tumbukan yang hampir konstan dan melalui kelimpahan isotop radioaktif yang sangat tinggi. Protoplanet menjadi sangat panas sehingga melewati tahap pencairan seluruhnya, di mana unsur-unsur berat seperti besi tenggelam melalui gravitasi, menuju pusatnya. Begitulah inti logamnya terbentuk. Pada saat yang sama, material ringan yang terlantar naik, membentuk mantel silikatnya. Proses dramatis ini, yang mempengaruhi semua planet berbatu muda, dikenal sebagai diferensiasi planet."}}, {"t": "p", "h": {"en": "Earth and Venus are the two largest rocky planets. But at some point after differentiation and solidification of their magma-oceans, their paths diverged. Earth ended up becoming habitable to life, but Venus turned into a hellscape. What happened?", "id": "Bumi dan Venus adalah dua planet berbatu terbesar. Namun pada titik tertentu setelah diferensiasi dan pemadatan samudra magma, jalur mereka menyimpang. Bumi akhirnya dapat dihuni oleh kehidupan, namun Venus berubah menjadi pemandangan neraka. Apa yang telah terjadi?"}}, {"t": "p", "h": {"en": "There's a lot we don't know about Venus. But what we do know is that the surface temperature is hot enough to melt lead, at 477 °C (890 °F). Atmospheric pressure is akin to that found on Earth - but over a kilometre down in the oceans. The orbit of Venus may be closer to the Sun but a lot of the sunlight bathing the planet is reflected by the thick and permanent cloud cover. Several attempts to land probes on the surface have seen the craft expire during descent or only a short while (~2 hours max.) after landing.", "id": "Ada banyak hal yang tidak kita ketahui tentang Venus. Namun yang kita ketahui adalah suhu permukaan cukup panas untuk melelehkan timbal, yaitu 477 °C (890 °F). Tekanan atmosfer mirip dengan yang ditemukan di Bumi – tetapi lebih dari satu kilometer di lautan. Orbit Venus mungkin lebih dekat ke Matahari, namun sebagian besar sinar matahari yang menyinari planet ini dipantulkan oleh tutupan awan yang tebal dan permanen. Beberapa upaya untuk mendaratkan wahana di permukaan telah menyebabkan pesawat tersebut mati saat turun atau hanya beberapa saat (~2 jam maksimal) setelah mendarat."}}, {"t": "p", "h": {"en": "Nevertheless, radar has been used to map the features of the planetary surface and analyses have been made of the Venusian atmosphere. The latter is almost all carbon dioxide, with a bit of nitrogen. Sulphuric acid droplets make up the clouds. Many hypotheses have been put forward for the evidently different evolution of Venus, but the critical bit - testing them - requires fieldwork under the most difficult conditions in the inner Solar System.", "id": "Meskipun demikian, radar telah digunakan untuk memetakan ciri-ciri permukaan planet dan analisis atmosfer Venus telah dilakukan. Yang terakhir ini hampir semuanya karbon dioksida, dengan sedikit nitrogen. Tetesan asam sulfat membentuk awan. Banyak hipotesis telah diajukan untuk evolusi Venus yang jelas berbeda, namun bagian kritisnya – pengujiannya – memerlukan kerja lapangan dalam kondisi paling sulit di Tata Surya bagian dalam."}}, {"t": "p", "h": {"en": "One leading hypothesis is that early on, Venus experienced a runaway water vapour-based greenhouse effect. Water vapour built up in the atmosphere and temperatures rose and rose until a point was reached where the oceans had evaporated. In the upper atmosphere, the water (H₂O) molecules were split by exposure to high-energy ultraviolet light and the light hydrogen component escaped to space.", "id": "Salah satu hipotesis utama adalah bahwa sejak awal, Venus mengalami efek rumah kaca berbasis uap air yang tak terkendali. Uap air menumpuk di atmosfer dan suhu meningkat hingga mencapai titik di mana lautan menguap. Di lapisan atas atmosfer, molekul air (H₂O) terpecah akibat paparan sinar ultraviolet berenergi tinggi dan komponen hidrogen ringan lepas ke luar angkasa."}}, {"t": "p", "h": {"en": "With that progressive loss of water, most processes that consume CO₂ would eventually grind to a halt, unlike on Earth. Carbon dioxide released by volcanic activity would then simply accumulate in the Venusian atmosphere over billions of years, creating the stable but unfriendly conditions we see there today.", "id": "Dengan hilangnya air secara progresif, sebagian besar proses yang mengonsumsi CO₂ pada akhirnya akan terhenti, tidak seperti di Bumi. Karbon dioksida yang dilepaskan oleh aktivitas gunung berapi kemudian akan terakumulasi di atmosfer Venus selama miliaran tahun, menciptakan kondisi yang stabil namun tidak bersahabat seperti yang kita lihat di sana saat ini."}}, {"t": "p", "h": {"en": "Earth instead managed to hang onto its water, to become the benign, life-supporting place where we live. We should be grateful!", "id": "Bumi malah berhasil bertahan di perairannya, menjadi tempat yang ramah dan mendukung kehidupan dimana kita tinggal. Kita harus bersyukur!"}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/Venus-runaway-greenhouse-effect-basic.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/Venus-runaway-greenhouse-effect-basic.htm\">ini formulir<\/a> untuk memberikan masukan tentang bagian \"Sekilas\" yang baru ini. Baca versi yang lebih teknis di bawah atau gali lebih dalam melalui tab di atas!<\/em><\/strong><\/em>"}}, {"t": "hr"}, {"t": "h2", "h": {"en": "<a href=\"https://skepticalscience.com/Venus-runaway-greenhouse-effect-basic.htm#FurtherDetails\">Click for Further details<\/a>", "id": "<a href=\"https://skepticalscience.com/Venus-runaway-greenhouse-effect-basic.htm#FurtherDetails\">Klik untuk detail lebih lanjut<\/a>"}}, {"t": "p", "h": {"en": "In case you'd like to explore more of our recently updated rebuttals, here are the links to all of them:", "id": "Jika Anda ingin menjelajahi lebih jauh sanggahan kami yang baru-baru ini diperbarui, berikut tautan ke semuanya:"}}, {"t": "p", "h": {"en": "<strong>Myths with link to rebuttal<\/strong> <strong>Short URLs<\/strong> <a href=\"https://sks.to/1970s\">Ice age predicted in the 1970s<\/a> sks.to/1970s <a href=\"https://sks.to/1998\">It hasn't warmed since 1998<\/a> sks.to/1998 <a href=\"http
