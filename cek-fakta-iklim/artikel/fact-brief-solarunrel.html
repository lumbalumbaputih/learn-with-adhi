barukan ternyata melebihi proyeksi."}}, {"t": "p", "h": {"en": "California is an example of improving reliability while transitioning from fossil fuels to solar. From 2015 to 2025, in-state generation saw a jump in solar reliance from 8% to 27%, while natural gas dropped from 60% to 36%.", "id": "California adalah contoh peningkatan keandalan sembari beralih dari bahan bakar fosil ke tenaga surya. Dari tahun 2015 hingga 2025, porsi tenaga surya dalam pembangkitan listrik di negara bagian itu naik dari 8% menjadi 27%, sementara gas alam turun dari 60% menjadi 36%."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/solarunrel\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/do-solar-plants-require-backup-from-fossil-fuels/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/solarunrel\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/do-solar-plants-require-backup-from-fossil-fuels/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/BG8D-M7FW\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/BG8D-M7FW\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Tenaga surya selalu butuh cadangan dari batu bara atau gas.", "en": "Solar power always needs coal or gas backup."}, "fakta": {"id": "Tenaga surya memang butuh cadangan, tapi cadangannya bisa dari baterai, angin, dan kiriman listrik dari daerah lain.", "en": "Solar does need backup, but it can come from batteries, wind and power sent from other regions."}, "kw": "panel surya cadangan baterai"};</script>
