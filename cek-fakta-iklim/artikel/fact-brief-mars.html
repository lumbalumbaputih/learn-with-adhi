<main id="app" class="wrap" tabindex="-1"><noscript><h1>“Mars juga memanas, jadi penyebabnya matahari, bukan manusia.”</h1><p><b>SALAH.</b> Faktanya: Iklim Mars berubah karena alasan yang sangat berbeda, misalnya badai debu dan orbitnya. Tidak ada data pemanasan di Mars yang mirip dengan Bumi.</p><p><a href="https://skepticalscience.com/fact-brief-mars.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "fact-brief-mars", "fb": true, "date": "5 April 2025", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-mars.html", "words": 345, "topic": "cause", "title": {"en": "Fact brief - Is Mars warming?", "id": "Fakta singkat - Apakah Mars memanas?"}, "verdict": "No", "question": {"en": "Is Mars warming?", "id": "Apakah Mars memanas?"}, "sources": [{"en": "New Scientist <a href=\"https://archive.is/lg8kn\">Climate myths: Mars and Pluto are warming too<\/a>"}, {"en": "Nature <a href=\"https://www.nature.com/articles/nature05718\">Global warming and climate forcing by recent albedo changes on Mars<\/a>"}, {"en": "American Geophysical Union <a href=\"https://ui.adsabs.harvard.edu/abs/2007AGUFM.P31D..05R/abstract\">Some Coolness on Martian Global Warming and Reflections on the Role of Surface Dust<\/a>"}, {"en": "SPACE.com <a href=\"https://www.space.com/16903-mars-atmosphere-climate-weather.html\">Mars' atmosphere: Facts about composition and climate<\/a>"}, {"en": "NASA Graphic: <a href=\"https://archive.is/q3WPU\">Temperature vs Solar Activity<\/a>"}, {"en": "Solar System Research <a href=\"https://link.springer.com/article/10.1134/S0038094623010045\">Seasonal Variation of Martian Surface Temperature over Gale Crater and Surroundings<\/a>"}, {"en": "NASA <a href=\"https://archive.is/eHKAL\">Global Temperature<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Mars’ climate varies due to completely different reasons from Earth’s, and available data indicates no temperature trends comparable to Earth’s recent warming.", "id": "Iklim Mars bervariasi karena alasan yang sangat berbeda dengan Bumi, dan data yang tersedia menunjukkan tidak ada tren suhu yang sebanding dengan pemanasan bumi baru-baru ini."}}, {"t": "p", "h": {"en": "Mars lacking oceans or a robust atmosphere means its climate is highly susceptible to external factors. In the longer term, its non-circular orbit causes heating when passing closer to the sun and cooling when further away. In the short term, weather patterns like dust storms impact how much solar heat reaches Mars.", "id": "Mars tidak memiliki lautan atau atmosfer yang kuat sehingga iklimnya sangat rentan terhadap faktor eksternal. Dalam jangka panjang, orbit non-lingkarannya menyebabkan pemanasan saat mendekat ke Matahari dan mendingin saat menjauh. Dalam jangka pendek, pola cuaca seperti badai debu berdampak pada seberapa banyak panas matahari yang mencapai Mars."}}, {"t": "p", "h": {"en": "Mars warming would imply that the sun is causing generally rising planetary temperatures. However, total solar heat has decreased since the 1980s. Moreover, analyses of the available 50 years of Mars data found seasonal variability, but no warming trend.", "id": "Pemanasan Mars menyiratkan bahwa matahari secara umum menyebabkan kenaikan suhu planet. Namun, total panas matahari telah menurun sejak tahun 1980an. Selain itu, analisis terhadap data Mars selama 50 tahun yang tersedia menemukan adanya variabilitas musiman, namun tidak ada tren pemanasan."}}, {"t": "p", "h": {"en": "Meanwhile, Earth has warmed 1.5°C (2.7°F) since the 1880s due to the greenhouse effects of human-made CO2. Our best understanding of available Mars data indicates no warming nor mechanisms comparable to Earth’s recent climate change.", "id": "Sementara itu, suhu bumi telah memanas 1,5°C (2,7°F) sejak tahun 1880-an akibat efek rumah kaca dari CO2 buatan manusia. Pemahaman terbaik kami mengenai data Mars yang tersedia menunjukkan tidak ada pemanasan atau mekanisme yang sebanding dengan perubahan iklim yang terjadi di Bumi baru-baru ini."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/mars\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/is-mars-warming/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/mars\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/is-mars-warming/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://archive.ph/AuoOX#selection-2287.0-2287.161:~:text=ome%20people%20think%20that%20our%20planet%20is%20suffering%20from%20a%20fever.%C2%A0%20Now%20scientists%20are%20telling%20us%20that%20Mars%20is%20experiencing%20its%20own%20planetary%20warming%3A%20Martian%20warming.\">the one highlighted here<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.ph/AuoOX#selection-2287.0-2287.161:~:text=ome%20people%20think%20that%20our%20planet%20is%20suffering%20from%20a%20fever.%C2%A0%20Now%20scientists%20are%20telling%20us%20that%20Mars%20is%20experiencing%20its%20own%20planetary%20warming%3A%20Martian%20warming.\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Mars juga memanas, jadi penyebabnya matahari, bukan manusia.", "en": "Mars is warming too, so it's the Sun, not people."}, "fakta": {"id": "Iklim Mars berubah karena alasan yang sangat berbeda, misalnya badai debu dan orbitnya. Tidak ada data pemanasan di Mars yang mirip dengan Bumi.", "en": "Mars' climate changes for very different reasons, like dust storms and its orbit. There's no Mars warming trend like Earth's."}, "kw": "mars planet"};</script>
