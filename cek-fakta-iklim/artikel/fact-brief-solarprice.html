ed using “levelized cost of energy,” the average lifetime cost to build and run a power plant divided by the electricity it produces. A 2025 analysis estimates the mean LCOE of utility-scale solar at about $58 per megawatt-hour without subsidies, compared to $79 for new natural gas plants and $128 for new coal. The International Energy Agency reports solar energy is the cheapest source of new electricity generation in most parts of the world.", "id": "Biaya sering kali dibandingkan dengan menggunakan “biaya energi yang diratakan”, yaitu biaya rata-rata seumur hidup untuk membangun dan menjalankan pembangkit listrik dibagi dengan listrik yang dihasilkannya. Analisis pada tahun 2025 memperkirakan rata-rata LCOE tenaga surya skala utilitas adalah sekitar $58 per megawatt-jam tanpa subsidi, dibandingkan dengan $79 untuk pembangkit listrik tenaga gas alam baru dan $128 untuk pembangkit listrik tenaga batu bara baru. Badan Energi Internasional melaporkan energi surya merupakan sumber pembangkit listrik baru termurah di sebagian besar dunia."}}, {"t": "p", "h": {"en": "Solar costs have fallen sharply over the past decade as panel prices have dropped and the industry has grown. Subsidies can further lower costs, but solar is not dependent on them to compete with fossil fuels.", "id": "Biaya tenaga surya telah turun tajam selama dekade terakhir seiring dengan turunnya harga panel dan pertumbuhan industri. Subsidi dapat menurunkan biaya, namun tenaga surya tidak bergantung pada subsidi untuk bersaing dengan bahan bakar fosil."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/solarprice\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/does-solar-energy-need-subsidies-to-compete-with-fossil-fuels/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/solarprice\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/does-solar-energy-need-subsidies-to-compete-with-fossil-fuels/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/63GB-ZQ3B\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/63GB-ZQ3B\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Tenaga surya hanya bisa bersaing kalau disubsidi pemerintah.", "en": "Solar only competes with fossil fuels because of subsidies."}, "fakta": {"id": "Tanpa subsidi pun, pembangkit tenaga surya besar sekarang umumnya lebih murah daripada membangun pembangkit batu bara atau gas baru.", "en": "Even without subsidies, large solar farms are now generally cheaper than new coal or gas plants."}, "kw": "panel surya subsidi murah harga"};</script>
