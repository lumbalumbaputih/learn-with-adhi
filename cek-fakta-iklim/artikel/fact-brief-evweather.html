<main id="app" class="wrap" tabindex="-1"><noscript><h1>“Mobil listrik mogok kalau cuaca sangat panas.”</h1><p><b>SALAH.</b> Faktanya: Panas ekstrem hanya mengurangi jarak tempuh sedikit, sekitar 14% pada suhu 35°C. Mobil bensin juga turun dengan persentase yang sama. Mobil listrik tetap bisa jalan.</p><p><a href="https://skepticalscience.com/fact-brief-evweather.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "fact-brief-evweather", "fb": true, "date": "14 July 2026", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-evweather.html", "words": 382, "topic": "energy", "title": {"en": "Fact brief - Do electric vehicles stop working in extreme heat?", "id": "Fakta singkat - Apakah kendaraan listrik berhenti bekerja dalam cuaca yang sangat panas?"}, "verdict": "No", "question": {"en": "Do electric vehicles stop working in extreme heat?", "id": "Apakah kendaraan listrik berhenti bekerja dalam cuaca yang sangat panas?"}, "sources": [{"en": "U.S. Department of Energy <a href=\"https://www.energy.gov/sites/default/files/2024-10/Impact_of_Cold_Ambient_Temperature_on_BEV_Performance_v15_TechEditFinal_12Sep2024__0.pdf\">Impact of Cold Ambient Temperature and Extreme Conditions on Electric Vehicles<\/a>"}, {"en": "AAA <a href=\"https://newsroom.aaa.com/wp-content/uploads/2026/04/Research-Report_EV-vs-Hybrid-Efficiency_17-Apr-26_FINAL_HQ-2-1.pdf\">TEMPERATURE EFFECTS ON ELECTRIC AND HYBRID VEHICLE EFFICIENCY<\/a>"}, {"en": "Applied Energy <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0306261924024358\">Extreme heat effects on electric vehicle energy consumption and driving range<\/a>"}, {"en": "Recurrent <a href=\"https://www.recurrentauto.com/research/what-a-c-does-to-your-range?_cl=gkJHkoU9D3WsgBtPnTTSWgr0\">How Hot Summer Weather Affects EV Range<\/a>"}, {"en": "Columbia Law School Sabin Center for Climate Change Law <a href=\"https://scholarship.law.columbia.edu/sabin_climate_change/217/\">Rebutting 33 False Claims About Solar, Wind, and Electric Vehicles<\/a>"}, {"en": "[<em>Based on Evan's suggestion in the comments, we updated the title to eliminate the double negative. July 15, 2026<\/em>]"}], "blocks": [{"t": "p", "h": {"en": "Extreme heat can temporarily reduce range, but recent research does not show that EVs are unable to operate in hot weather.", "id": "Panas ekstrem dapat mengurangi jangkauan untuk sementara, namun penelitian terbaru tidak menunjukkan bahwa kendaraan listrik tidak dapat beroperasi dalam cuaca panas."}}, {"t": "p", "h": {"en": "Much of the decrease comes from energy diverted to cool the vehicle, not because EV batteries or motors stop functioning. Modern EVs use thermal management systems to keep components within safe operating temperatures.", "id": "Sebagian besar penurunan ini disebabkan oleh pengalihan energi untuk mendinginkan kendaraan, bukan karena baterai atau motor EV berhenti berfungsi. Kendaraan listrik modern menggunakan sistem manajemen termal untuk menjaga komponen dalam suhu pengoperasian yang aman."}}, {"t": "p", "h": {"en": "U.S. Department of Energy testing in 2024 found EV range fell on average about 14% at an ambient temperature of 95°F (35°C) compared with mild weather. However, the same proportional decrease was measured for gasoline vehicles under comparable conditions.", "id": "Pengujian Departemen Energi AS pada tahun 2024 menemukan bahwa jarak tempuh EV turun rata-rata sekitar 14% pada suhu sekitar 95°F (35°C) dibandingkan dengan cuaca sedang. Namun, penurunan proporsional yang sama juga terjadi pada kendaraan berbahan bakar bensin dalam kondisi yang sebanding."}}, {"t": "p", "h": {"en": "AAA testing of popular EV models in 2026 found an average range decrease of 8.5% at 95°F. Meanwhile, a 2025 study of 345,000 real-world EV trips found a 16% reduction at temperatures up to 122°F (50°C).", "id": "Pengujian AAA pada model EV populer pada tahun 2026 menemukan penurunan jangkauan rata-rata sebesar 8,5% pada suhu 95°F. Sementara itu, studi tahun 2025 terhadap 345.000 perjalanan kendaraan listrik di dunia nyata menemukan penurunan sebesar 16% pada suhu hingga 122°F (50°C)."}}, {"t": "p", "h": {"en": "Extreme heat can reduce efficiency, but it does not make EVs unable to function.", "id": "Panas ekstrem memang bisa menurunkan efisiensi, namun tidak membuat kendaraan listrik tidak bisa berfungsi."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/evweather\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/are-electric-vehicles-unable-to-function-in-extreme-heat/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/evweather\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/are-electric-vehicles-unable-to-function-in-extreme-heat/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/5ADR-8CK3\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/5ADR-8CK3\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Mobil listrik mogok kalau cuaca sangat panas.", "en": "Electric cars stop working in extreme heat."}, "fakta": {"id": "Panas ekstrem hanya mengurangi jarak tempuh sedikit, sekitar 14% pada suhu 35°C. Mobil bensin juga turun dengan persentase yang sama. Mobil listrik tetap bisa jalan.", "en": "Extreme heat cuts range a little, about 14% at 35°C, the same share as petrol cars. EVs keep working."}, "kw": "mobil listrik panas mogok"};</script>
