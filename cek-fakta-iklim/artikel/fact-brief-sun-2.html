kan pemanasan cepat."}}, {"t": "p", "h": {"en": "Over longer timescales, research has found that solar changes account for 1% of the 1.4°C (2.5°F) of warming since pre-industrial times. In contrast, greenhouse gas emissions from burning fossil fuels cause far more warming and align closely with the measured temperature rise.", "id": "Dalam jangka waktu yang lebih lama, penelitian menemukan bahwa perubahan matahari menyebabkan 1% dari pemanasan 1,4°C (2,5°F) sejak masa pra-industri. Sebaliknya, emisi gas rumah kaca dari pembakaran bahan bakar fosil menyebabkan pemanasan yang jauh lebih besar dan sejalan dengan kenaikan suhu yang terukur."}}, {"t": "p", "h": {"en": "Change in the sun’s activity has been small and cannot explain the recent rise in global temperatures. The dominant driver of today’s climate change is not the sun, but greenhouse gas emissions from our use of fossil fuels.", "id": "Perubahan aktivitas matahari sangatlah kecil dan tidak dapat menjelaskan kenaikan suhu global baru-baru ini. Penggerak utama perubahan iklim saat ini bukanlah matahari, namun emisi gas rumah kaca dari penggunaan bahan bakar fosil."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/sun\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/are-changes-in-solar-activity-causing-climate-change/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/sun\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/are-changes-in-solar-activity-causing-climate-change/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"http://news.bbc.co.uk/2/hi/science/nature/3869753.stm\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"http://news.bbc.co.uk/2/hi/science/nature/3869753.stm\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Bumi makin panas karena matahari makin terik.", "en": "Earth is warming because the Sun is getting stronger."}, "fakta": {"id": "Bukan. Sejak akhir 1970-an, energi dari matahari justru sedikit turun, sementara Bumi terus memanas.", "en": "No. Since the late 1970s the Sun's energy has dipped slightly, while Earth kept warming."}, "kw": "matahari surya terik sun bintik"};</script>
