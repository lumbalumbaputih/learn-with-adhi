ter\">More Than One Million Birds Died During Deepwater Horizon Disaster<\/a>"}, {"en": "NOAA <a href=\"https://web.archive.org/web/20260409053233/https://oceanservice.noaa.gov/facts/acidification.html\">What is Ocean Acidification?<\/a>"}, {"en": "Columbia Law School Sabin Center for Climate Change Law <a href=\"https://scholarship.law.columbia.edu/sabin_climate_change/217/\">Rebutting 33 False Claims About Solar, Wind, and Electric Vehicles<\/a>"}], "blocks": [{"t": "p", "h": {"en": "The 2022 whale deaths have not been linked to offshore wind surveys or construction. Research has found no evidence of wind farms driving whale deaths, and responsibly developed wind farms avert systemic harms of fossil fuels.", "id": "Kematian paus pada tahun 2022 tidak dikaitkan dengan survei atau konstruksi angin lepas pantai. Penelitian tidak menemukan bukti bahwa pembangkit listrik tenaga angin menyebabkan kematian paus, dan pembangkit listrik tenaga angin yang dikembangkan secara bertanggung jawab dapat mencegah kerusakan sistemis dari bahan bakar fosil."}}, {"t": "p", "h": {"en": "Bad practices like construction during peak migration, high-speed vessels, or not monitoring whale presence can increase risk. However, established regulations such as seasonal construction limits, population monitoring, and vessel-speed rules reduce exposure. Once operating, turbine noise is significantly less disruptive than ships.", "id": "Praktik buruk seperti pembangunan selama puncak migrasi, kapal berkecepatan tinggi, atau tidak memantau keberadaan paus dapat meningkatkan risiko. Namun, peraturan yang ditetapkan seperti batasan konstruksi musiman, pemantauan populasi, dan aturan kecepatan kapal mengurangi paparan. Setelah beroperasi, kebisingan turbin jauh lebih tidak mengganggu dibandingkan kebisingan kapal."}}, {"t": "p", "h": {"en": "According to the NOAA, boat collisions and fishing gear entanglement account for most whale deaths, not wind turbines.", "id": "Menurut NOAA, tabrakan perahu dan terbelitnya alat penangkapan ikan merupakan penyebab sebagian besar kematian paus, bukan turbin angin."}}, {"t": "p", "h": {"en": "In contrast, fossil fuel drilling and burning routinely harm marine life. Oil and gas exploration uses highly disruptive sonar, oil spills kill marine animals, and emissions acidify oceans, weakening coral and shellfish. Warming causes population-level harms to marine mammals through altered migration routes and habitat loss.", "id": "Sebaliknya, pengeboran dan pembakaran bahan bakar fosil sering kali membahayakan kehidupan laut. Eksplorasi minyak dan gas menggunakan sonar yang sangat mengganggu, tumpahan minyak membunuh hewan laut, dan emisi mengasamkan lautan, melemahkan karang dan kerang. Pemanasan menyebabkan kerugian pada tingkat populasi mamalia laut melalui perubahan jalur migrasi dan hilangnya habitat."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/windwhales\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/were-the-2022-whale-deaths-off-the-us-east-coast-caused-by-offshore-wind-development/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/windwhales\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/were-the-2022-whale-deaths-off-the-us-east-coast-caused-by-offshore-wind-development/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/9P2P-SWMG%20\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/9P2P-SWMG%20\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Paus mati di pantai Amerika tahun 2022 karena proyek kincir angin di laut.", "en": "Offshore wind caused the 2022 whale deaths off the US coast."}, "fakta": {"id": "Penelitian tidak menemukan bukti bahwa kincir angin laut menyebabkan kematian paus itu. Aturan pembangunan juga dibuat untuk melindungi paus.", "en": "Research found no evidence linking offshore wind to those deaths, and construction rules are in place to protect whales."}, "kw": "kincir angin laut paus"};</script>
