<main id="app" class="wrap" tabindex="-1"><noscript><h1>“Bayangan kincir angin yang berkedip bisa memicu kejang pada penderita epilepsi.”</h1><p><b>SALAH.</b> Faktanya: Kedipan bayangan kincir angin terlalu lambat, sekitar 0,5 sampai 1 kali per detik. Kejang karena cahaya biasanya baru terpicu pada 3 kedipan per detik atau lebih.</p><p><a href="https://skepticalscience.com/fact-brief-windshadow.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "fact-brief-windshadow", "fb": true, "date": "10 March 2026", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-windshadow.html", "words": 362, "topic": "energy", "title": {"en": "Fact brief - Can shadow flicker from wind turbines trigger seizures in people with epilepsy?", "id": "Fakta singkat - Bisakah kedipan bayangan dari turbin angin memicu kejang pada penderita epilepsi?"}, "verdict": "No", "question": {"en": "Can shadow flicker from wind turbines trigger seizures in people with epilepsy?", "id": "Bisakah kedipan bayangan dari turbin angin memicu kejang pada penderita epilepsi?"}, "sources": [{"en": "U.S. Department of Energy <a href=\"https://perma.cc/T5PC-RBWB\">Shadow Flicker<\/a>"}, {"en": "Massachusetts Department of Environmental Protection <a href=\"https://www.mass.gov/doc/wind-turbine-health-impact-study-report-of-independent-expert-panel/download\">Wind Turbine Health Impact Study: Report of Independent Expert Panel<\/a>"}, {"en": "Front Public Health Journal <a href=\"https://pubmed.ncbi.nlm.nih.gov/24995266/\">Wind Turbines and Human Health<\/a>"}, {"en": "IEEE <a href=\"https://doi.org/10.1109/ess57819.2022.9969323\">Environment Impact Assessment for New Wind Farm Developments in Ukraine<\/a>"}, {"en": "Energy Reports Journal <a href=\"https://doi.org/10.1016/j.egyr.2021.06.066\">Occupational health hazards and risks in the wind industry<\/a>"}, {"en": "Columbia Law School Sabin Center for Climate Change Law <a href=\"https://scholarship.law.columbia.edu/sabin_climate_change/217/\">Rebutting 33 False Claims About Solar, Wind, and Electric Vehicles<\/a>"}], "blocks": [{"t": "p", "h": {"en": "The flicker of a wind turbine shadow is far below the minimum frequency required to trigger photosensitive epilepsy.", "id": "Kedipan bayangan turbin angin jauh di bawah frekuensi minimum yang diperlukan untuk memicu epilepsi fotosensitif."}}, {"t": "p", "h": {"en": "A wind turbine is said to produce a “shadow flicker” when its rotating blades pass between the sun and an observer, creating a repeating pattern of light and shadow.", "id": "Turbin angin dikatakan menghasilkan “bayangan berkedip” ketika bilah berputar melewati antara matahari dan pengamat, menciptakan pola cahaya dan bayangan yang berulang."}}, {"t": "p", "h": {"en": "Photosensitive epilepsy is triggered at frequencies of 3 Hz or higher, or 3 flashes of light per second. Wind turbines generate flicker frequencies of 0.5 to 1 Hz, well below the known minimum trigger frequency.", "id": "Epilepsi fotosensitif dipicu pada frekuensi 3 Hz atau lebih tinggi, atau 3 kilatan cahaya per detik. Turbin angin menghasilkan frekuensi kedipan 0,5 hingga 1 Hz, jauh di bawah frekuensi pemicu minimum yang diketahui."}}, {"t": "p", "h": {"en": "One study calculated that a typical three-blade turbine would need to operate at 60 rotations per minute (rpm) to potentially trigger photosensitive epilepsy. Modern turbines operate at maximum speeds of only 15 to 17 rpm.", "id": "Sebuah studi menghitung bahwa turbin tiga bilah perlu beroperasi pada 60 putaran per menit (rpm) agar berpotensi memicu epilepsi fotosensitif. Turbin modern beroperasi pada kecepatan maksimum hanya 15 hingga 17 rpm."}}, {"t": "p", "h": {"en": "Research and public health surveys have not established a phenomenon of wind turbine-induced photosensitive seizures.", "id": "Penelitian dan survei kesehatan masyarakat belum menemukan fenomena kejang fotosensitif yang disebabkan oleh turbin angin."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/windshadow\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/can-shadow-flicker-from-wind-turbines-trigger-seizures-in-people-with-epilepsy/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/windshadow\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/can-shadow-flicker-from-wind-turbines-trigger-seizures-in-people-with-epilepsy/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/V4LJ-ZNLY\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/V4LJ-ZNLY\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Bayangan kincir angin yang berkedip bisa memicu kejang pada penderita epilepsi.", "en": "Shadow flicker from wind turbines triggers epileptic seizures."}, "fakta": {"id": "Kedipan bayangan kincir angin terlalu lambat, sekitar 0,5 sampai 1 kali per detik. Kejang karena cahaya biasanya baru terpicu pada 3 kedipan per detik atau lebih.", "en": "Turbine flicker is too slow, about 0.5 to 1 per second. Light-triggered seizures usually need 3 flashes per second or more."}, "kw": "kincir angin bayangan epilepsi kejang"};</script>
