<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas - Apakah tanggapan positif berarti pemanasan yang tak terkendali?</h1><p>Pemanasan memang bisa diperkuat oleh reaksi alam, misalnya es mencair. Tapi bukti dari masa lalu menunjukkan Bumi sangat kecil kemungkinannya mengalami pemanasan yang lepas kendali seperti Venus. Ini bukan alasan untuk santai, karena pemanasan sekarang sudah berbahaya.</p><p><a href="https://skepticalscience.com/at-a-glance-runaway.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-runaway", "fb": false, "date": "11 June 2024", "byline": "John Mason, BaerbelW, Ken Rice", "url": "https://skepticalscience.com/at-a-glance-runaway.html", "words": 1258, "topic": "warm", "title": {"en": "At a glance - Does positive feedback necessarily mean runaway warming?", "id": "Sekilas - Apakah tanggapan positif berarti pemanasan yang tak terkendali?"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-runaway/6e7bc45f06.webp", "w": 570, "hh": 387, "alt": "Fact-Myth-Box"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "Yet another climate change myth that has not aged well. As of early May 2024, all of the past 12 months had come in at more than 1.5°C above pre-industrial temperatures, so all of the first sentence is now tripe.", "id": "Satu lagi mitos perubahan iklim yang belum berkembang dengan baik. Pada awal Mei 2024, suhu dalam 12 bulan terakhir telah mencapai lebih dari 1,5°C di atas suhu pra-industri, sehingga semua kalimat pertama sekarang menjadi babat."}}, {"t": "p", "h": {"en": "However, with regard to the rest of the myth, the evidence suggests it is extremely unlikely that Earth can enter a runaway greenhouse state.", "id": "Namun, sehubungan dengan mitos lainnya, bukti menunjukkan bahwa sangat kecil kemungkinannya bahwa Bumi akan memasuki kondisi rumah kaca yang tidak terkendali."}}, {"t": "p", "h": {"en": "Why is that? We have two good lines of evidence to support the contention. Firstly, we know an awful lot these days about the geography and climate of Earth in the past. Ancient geography can be determined by examining rock sequences on the continents and noting similarities in their fossil faunas, sedimentary environments and ancient magnetism.", "id": "Mengapa demikian? Kami memiliki dua bukti bagus untuk mendukung anggapan tersebut. Pertama, saat ini kita mengetahui banyak sekali tentang geografi dan iklim bumi di masa lalu. Geografi purba dapat ditentukan dengan memeriksa rangkaian batuan di benua dan mencatat kesamaan fosil fauna, lingkungan sedimen, dan magnetisme purba."}}, {"t": "p", "h": {"en": "So we know, for example, that around 55.8 million years ago, Ellesmere Island, off the NW coast of Greenland, was a lot warmer than it is today. The main geographical difference between then and now was that the Atlantic Ocean was narrower. The faunal difference was a lot more impressive. Where there are now glaciers and polar bears, back then tortoises, snakes and alligators thrived. Their fossils, along with those of redwood, ginkgo, elm and walnut, are to be found in Ellesmere Island's sedimentary rocks.", "id": "Jadi kita tahu, misalnya, sekitar 55,8 juta tahun yang lalu, Pulau Ellesmere, di lepas pantai barat laut Greenland, jauh lebih hangat dibandingkan sekarang. Perbedaan geografis utama antara dulu dan sekarang adalah Samudera Atlantik lebih sempit. Perbedaan fauna jauh lebih mengesankan. Di tempat yang sekarang terdapat gletser dan beruang kutub, pada masa itu kura-kura, ular, dan aligator tumbuh subur. Fosil mereka, bersama dengan fosil kayu merah, ginkgo, elm, dan kenari, dapat ditemukan di batuan sedimen Pulau Ellesmere."}}, {"t": "p", "h": {"en": "The time in question is known as the Palaeocene-Eocene Thermal Maximum. As the name suggests, it was probably the hottest climate experienced on Earth in the past 600 million years. To get temperate to subtropical temperatures in the Arctic is indeed impressive. But there was no runaway beyond that. Why?", "id": "Waktu yang dimaksud dikenal sebagai Maksimum Termal Palaeosen-Eosen. Seperti namanya, ini mungkin merupakan iklim terpanas yang dialami bumi dalam 600 juta tahun terakhir. Mencapai suhu sedang hingga subtropis di Arktik sungguh mengesankan. Tapi tidak ada jalan keluar selain itu. Mengapa?"}}, {"t": "p", "h": {"en": "Trapping of heat by CO₂ and other greenhouse gases causes an energy imbalance on Earth. This imbalance gets amplified by positive feedbacks. A positive feedback happens when the planetary response to a change serves to amplify that change. For example, due to burning of fossil fuels, atmospheric CO₂ has gone up by 50%. The resulting enhanced greenhouse effect is heating up the planet. The heating, among other things, melts arctic permafrost, releasing the CO₂ and methane trapped within it. These gases amplify that initial change. The effect reinforces the cause, which will in turn further increase the effect, which in turn will reinforce the cause… and on and on.", "id": "Terperangkapnya panas oleh CO₂ dan gas rumah kaca lainnya menyebabkan ketidakseimbangan energi di Bumi. Ketidakseimbangan ini diperkuat oleh masukan positif. Umpan balik positif terjadi ketika respons dunia terhadap suatu perubahan berfungsi untuk memperkuat perubahan tersebut. Misalnya, akibat pembakaran bahan bakar fosil, CO₂ di atmosfer telah meningkat sebesar 50%. Peningkatan efek rumah kaca yang diakibatkannya adalah memanaskan planet ini. Pemanasan tersebut antara lain mencairkan lapisan es di Arktik, melepaskan CO₂ dan metana yang terperangkap di dalamnya. Gas-gas ini memperkuat perubahan awal tersebut. Akibat memperkuat sebab, yang pada gilirannya akan semakin meningkatkan akibat, yang pada gilirannya akan memperkuat sebab… dan seterusnya."}}, {"t": "p", "h": {"en": "So won't this spin out of control? The answer is almost certainly not. Feedbacks are not just positive. One very important one is that a warmer planet radiates more energy out to space than a cooler one. This feedback is not only negative but it is also strong.", "id": "Jadi bukankah ini akan lepas kendali? Jawabannya hampir pasti tidak. Masukan tidak hanya positif. Salah satu hal yang sangat penting adalah bahwa planet yang lebih hangat memancarkan lebih banyak energi ke luar angkasa dibandingkan planet yang lebih dingin. Umpan balik ini tidak hanya negatif tetapi juga kuat."}}, {"t": "p", "h": {"en": "Furthermore, positive feedback cycles will go on and on, but there will be a diminishing of returns, so that after a number of cycles the effects become insignificant. Thus, if we double the atmospheric concentration of CO₂, the amount by which the response to that change - heating - can be amplified is approximately three times.", "id": "Lebih jauh lagi, siklus umpan balik positif akan terus berlanjut, namun akan ada penurunan hasil, sehingga setelah beberapa siklus, dampaknya menjadi tidak signifikan. Jadi, jika kita melipatgandakan konsentrasi CO₂ di atmosfer, jumlah respons terhadap perubahan tersebut – pemanasan – dapat diperkuat kira-kira tiga kali lipat."}}, {"t": "p", "h": {"en": "The creator and spreader of this particular myth is essentially putting words in people's mouths. No surprise there. But we do not need a runaway greenhouse effect to make life on Earth difficult. Just a few degrees of additional heating will do exactly that.", "id": "Pencipta dan penyebar mitos ini pada dasarnya hanya mengucapkan kata-kata ke mulut orang-orang. Tidak mengherankan. Namun kita tidak memerlukan efek rumah kaca yang berkepanjangan untuk membuat kehidupan di Bumi menjadi sulit. Pemanasan tambahan beberapa derajat saja sudah cukup."}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/positive-feedback-runaway-warming-basic.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/positive-feedback-runaway-warming-basic.htm\">ini formulir<\/a> untuk memberikan masukan tentang bagian \"Sekilas\" yang baru ini. Baca versi yang lebih teknis di bawah atau gali lebih dalam melalui tab di atas!<\/em><\/strong><\/em>"}}, {"t": "hr"}, {"t": "h2", "h": {"en": "<a href=\"https://skepticalscience.com/positive-feedback-runaway-warming-basic.htm#FurtherDetails\">Click for Further details<\/a>", "id": "<a href=\"https://skepticalscience.com/positive-feedback-runaway-warming-basic.htm#FurtherDetails\">Klik untuk detail lebih lanjut<\/a>"}}, {"t": "p", "h": {"en": "In case you'd like to explore more of our recently updated rebuttals, here are the links to all of them:", "id": "Jika Anda ingin menjelajahi lebih jauh sanggahan kami yang baru-baru ini diperbarui, berikut tautan ke semuanya:"}}, {"t": "p", "h": {"en": "<strong>Myths with link to rebuttal<\/strong> <strong>Short URLs<\/strong> <a href=\"https://sks.to/1970s\">Ice age predicted in the 1970s<\/a> sks.to/1970s <a href=\"https://sks.to/1998\">It hasn't warmed since 1998<\/a> sks.to/1998 <a href=\"https://sks.to/antarctica\">Antarctica is gaining ice<\/a> sks.to/antarctica <a href=\"https://sks.to/climategate\">CRU emails suggest conspiracy<\/a> sks.to/climategate <a href=\"https://sks.to/hockey\">What evidence is there for the hockey stick<\/a> sks.to/hockey <a href=\"https://sks.to/lag\">CO₂ lags temperature<\/a> sks.to/lag <a href=\"https://sks.to/past\">Climate's changed before<\/a> sks.to/past <a href=\"https://sks.to/sun\">It's the sun<\/a> sks.to/sun <a href=\"https://sks.to/temp\">Temperature records are unreliable<\/a> sks.to/temp <a href=\"https://sks.to/thermo\">The greenhouse effect and the 2nd law of thermodynamics<\/a> sks.to/thermo <a href=\"https://sks.to/iceage\">We're heading into an ice age<\/a> sks.to/iceage <a href=\"https://sks.to/impacts\">Positives and negatives of global warming<\/a> sks.to/impacts <a href=\"https://sks.to/consensus\">The 97% consensus on global warming<\/a> sks.to/consensus <a href=\"https://sks.to/cooling\">Global cooling - Is global warming still happening?<\/a> sks.to/cooling <a href=\"https://sks.to/model\">How relia
