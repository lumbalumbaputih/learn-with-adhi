<main id="app" class="wrap" tabindex="-1"><noscript><h1>Tentang bendera merah dan tanda peringatan dalam komentar di media sosial</h1><p>Tim Skeptical Science mengumpulkan tanda-tanda bahaya pada komentar di media sosial yang menyangkal perubahan iklim, misalnya mengulang-ulang slogan, menuduh ilmuwan menipu, atau menyerang pribadi. Tanda-tanda ini membantu kita berhenti sejenak sebelum percaya. Daftar lengkapnya ada di gambar berbahasa Inggris.</p><p><a href="https://skepticalscience.com/social-media-warning-signs-wording-in-posts-and-comments.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "social-media-warning-signs-wording-in-posts-and-comments", "fb": false, "date": "14 June 2024", "byline": "BaerbelW", "url": "https://skepticalscience.com/social-media-warning-signs-wording-in-posts-and-comments.html", "words": 842, "topic": "hoax", "title": {"en": "Of red flags and warning signs in comments on social media", "id": "Tentang bendera merah dan tanda peringatan dalam komentar di media sosial"}, "verdict": null, "blocks": [{"t": "p", "h": {"en": "Somewhat surprisingly for what is regarded as a network of professionals, climate science misinformation is getting shared on LinkedIn, joining other channels where this is happening. Several of our recent posts published on <a href=\"https://www.linkedin.com/company/skepticalscience?trk=public_post_follow-view-profile\">LinkedIn<\/a> have attracted the ire of various commenters who apparently are in denial about human-caused climate change. Based on their and other such comments, we compiled a list of telltale signs to be on the lookout for when reading posts or comments related to human-caused climate change or global warming on LinkedIn, other social media channels and even our own comment section. We hope you find this list helpful as the pointers can serve as warning flags to take a closer look before deciding whether to ignore or accept what has been written.", "id": "Agak mengejutkan bagi apa yang dianggap sebagai jaringan profesional, informasi yang salah tentang ilmu iklim dibagikan di LinkedIn, bergabung dengan saluran lain di mana hal ini terjadi. Beberapa postingan terbaru kami yang dipublikasikan di <a href=\"https://www.linkedin.com/company/skepticalscience?trk=public_post_follow-view-profile\">LinkedIn<\/a> telah menarik kemarahan berbagai komentator yang tampaknya menyangkal perubahan iklim yang disebabkan oleh manusia. Berdasarkan komentar mereka dan komentar serupa lainnya, kami menyusun daftar tanda-tanda yang harus diwaspadai ketika membaca postingan atau komentar terkait perubahan iklim yang disebabkan oleh manusia atau pemanasan global di LinkedIn, saluran media sosial lain, dan bahkan bagian komentar kami sendiri. Kami harap daftar ini bermanfaat bagi Anda karena petunjuknya dapat berfungsi sebagai tanda peringatan untuk melihat lebih dekat sebelum memutuskan apakah akan mengabaikan atau menerima apa yang telah ditulis."}}, {"t": "hr"}, {"t": "ul", "items": [{"en": "The <strong>scientific consensus on human-caused global warming<\/strong> is questioned or even attacked outright, even though the basic statements that global warming is real and is mostly caused by humans due to the continued burning of fossil fuels can be called a <a href=\"https://skepticalscience.com/sks.to/settled\">settled fact<\/a> - the facts are at least more than settled enough to base our decisions on. Legit discussions can obviously happen about what we should do. For more, please read our <a href=\"https://sks.to/consensus-explainer\">explainer about a scientific consensus<\/a>.<br><br>Several studies have shown - depending on what you look at - that the level of agreement in the scientific literature and amongst climate scientist about the major points ranges from 91-100% - usually in the high 90s.When reading comments that provide references, readers should keep in mind that finding references from the 1-3% while ignoring the other 97-99% is a prime example of \"cherry picking\".", "id": "<strong>Konsensus ilmiah mengenai pemanasan global yang disebabkan oleh manusia<\/strong> dipertanyakan atau bahkan langsung diserang, meskipun pernyataan dasar bahwa pemanasan global adalah nyata dan sebagian besar disebabkan oleh manusia karena pembakaran bahan bakar fosil yang terus menerus dapat disebut sebagai <a href=\"https://skepticalscience.com/sks.to/settled\">fakta yang sudah pasti<\/a> - faktanya setidaknya sudah lebih dari cukup untuk dijadikan dasar pengambilan keputusan. Diskusi yang sah jelas dapat terjadi mengenai apa yang harus kita lakukan. Untuk mengetahui lebih lanjut, silakan baca <a href=\"https://sks.to/consensus-explainer\">penjelasan tentang konsensus ilmiah<\/a> kami.<br><br>Beberapa penelitian telah menunjukkan - bergantung pada apa yang Anda lihat - bahwa tingkat kesepakatan dalam literatur ilmiah dan ilmuwan iklim tentang poin-poin utama berkisar antara 91-100% - biasanya pada tahun 90an. Saat membaca komentar yang memberikan referensi, pembaca harus ingat bahwa mencari referensi dari 1-3% dan mengabaikan 97-99% lainnya adalah contoh utama dari \"petik ceri\"."}]}, {"t": "img", "src": "images/social-media-warning-signs-wording-in-posts-and-comments/71e1ebba32.webp", "w": 500, "hh": 489, "alt": "Consensus studies"}, {"t": "ul", "items": [{"en": "Reactions via the <strong>„laugh“ icon<\/strong> on serious topics like human-caused climate change could either have happened accidentally (unlikely) or be a sign that the commenter doesn‘t quite (want to) grasp or accept scientific findings on the topic (quite likely).", "id": "Reaksi melalui <strong>ikon „tertawa”<\/strong> pada topik serius seperti perubahan iklim yang disebabkan oleh manusia bisa saja terjadi secara tidak sengaja (sangat tidak mungkin) atau menjadi tanda bahwa pemberi komentar kurang (ingin) memahami atau menerima temuan ilmiah mengenai topik tersebut (sangat mungkin)."}]}, {"t": "ul", "items": [{"en": "Comments making claims which <strong>seem to contradict our large list of rebuttals<\/strong> will in most likelihood be wrong or misleading or will not rely on scientific research published in high-quality peer-reviewed journals. If in doubt, please head over to <a href=\"https://sks.to/arguments\">sks.to/arguments<\/a> and check for yourself.", "id": "Komentar yang membuat klaim yang <strong>tampaknya bertentangan dengan daftar bantahan kami<\/strong> kemungkinan besar salah atau menyesatkan atau tidak akan bergantung pada penelitian ilmiah yang diterbitkan dalam jurnal peer-review berkualitas tinggi. Jika ragu, silakan kunjungi <a href=\"https://sks.to/arguments\">sks.to/arguments<\/a> dan periksa sendiri."}]}, {"t": "ul", "items": [{"en": "Comments <strong>rattling off many long-debunked myths<\/strong> - i.e. <a href=\"https://rationalwiki.org/wiki/Gish_Gallop\">gish-gallops<\/a> - have the sole aim to waste everybody's time and confuse people. They are best ignored.", "id": "Komentar <strong>mengungkapkan banyak mitos yang telah lama dibantah<\/strong> - yaitu <a href=\"https://rationalwiki.org/wiki/Gish_Gallop\">gish-gallops<\/a> - mempunyai tujuan tunggal untuk membuang waktu semua orang dan membingungkan orang. Mereka sebaiknya diabaikan."}]}, {"t": "ul", "items": [{"en": "Comments where <strong>terms like \"the science\"<\/strong> are put in scare quotes might also be an indication that the commenter doesn‘t really know what s/he is talking about. Melanie Trecek-King's article \"<a href=\"https://skepticalscience.com/science-what-it-is-how-it-works-and-why-it-matters.html\">Science: What it is, how it works and what it means<\/a>\" provides a neat explanation which might be worth sharing in those cases.", "id": "Komentar yang <strong>istilah seperti \"sains\"<\/strong> diberi tanda kutip mungkin juga merupakan indikasi bahwa pemberi komentar tidak benar-benar memahami apa yang dibicarakannya. Artikel Melanie Trecek-King \"<a href=\"https://skepticalscience.com/science-what-it-is-how-it-works-and-why-it-matters.html\">Sains: Apa itu, cara kerjanya, dan apa artinya<\/a>\" memberikan penjelasan rapi yang mungkin layak untuk dibagikan dalam kasus-kasus tersebut."}]}, {"t": "img", "src": "images/social-media-warning-signs-wording-in-posts-and-comments/8d604e44cf.webp", "w": 570, "hh": 320, "alt": "Science"}, {"t": "ul", "items": [{"en": "Comments making <strong>unsubstantiated absolute claims<\/strong> - e.g. \"all models have been proven wrong…\" - can be safely ignored (to see why the example is wrong: <a href=\"https://sks.to/model\">sks.to/model<\/a>)", "id": "Komentar yang membuat <strong>klaim absolut yang tidak berdasar<\/strong> - mis. \"semua model telah terbukti salah...\" - dapat diabaikan dengan aman (untuk mengetahui alasan contoh tersebut salah: <a href=\"https://sks.to/model\">sks.to/model<\/a>)"}]}, {"t": "ul", "items": [{"en": "Comments with <strong>links to blog posts or other sources<\/strong> may need some more checking, and if they go to blogs published by people or organizations with an entry in <a href=\"https://desmog.com/databases/\">DeSmog's very helpful research database<\/a>, caution is advised. It doesn't necessarily mean that everything written is wrong, but it nonetheless serves as a warning flag.", "id": "Komentar dengan <strong>link ke postingan blog atau sumber lain<\/strong> mungkin memerlukan pemeriksaan lebih lanjut, dan jika komentar tersebut masuk ke blog yang diterbitkan oleh orang atau organisasi dengan entri di <a href=\"https://desmog.com/databases/\">database penelitian DeSmog yang sangat membantu<\/a>, disarankan untuk berhati-hati. Ini tidak berarti bahwa segala sesuatu yang tertulis salah, namun tetap berfungsi sebagai tanda peringatan."}]}, {"t": "ul", "items": [{"en": "Comments <strong>\"just asking questions\"<\/strong> (as <a href=\"https://rationalwiki.org/wiki/Just_asking_questions\">defined in RationalWiki<\/a>) are rarely sincere and it might be worth checking if there's a pattern of such questions in different threads by the same commenter(s).", "id": "Komentar <strong>\"hanya mengajukan pertanyaan\"<\/strong> (seperti yang <a href=\"https://rationalwiki.org/wiki/Just_asking_questions\">didefinisikan di RationalWiki<\/a>) jarang yang tulus dan mungkin ada baiknya memeriksa apakah ada pola pertanyaan seperti itu di topik berbeda oleh pemberi komentar yang sama."}]}, {"t": "ul", "items": [{"en": "Sometimes a <strong>commenter's job or tagline<\/strong> can also give a clue. If there's a relationship to anything having to do with the fossil fuel or mining industries, whatever is being written might need to be read with a suitably large grain of salt.", "id": "Terkadang <strong>pekerjaan atau tagline pemberi komentar<\/strong> juga dapat memberikan petunjuk. Jika ada hubungannya dengan bahan bakar fosil atau industri pertambangan, apa pun yang ditulis mungkin perlu dibaca dengan hati-hati."}]}, {"t": "img", "src": "images/social-media-warning-signs-wording-in-posts-and-comments/26398ccc00.webp", "w": 570, "hh": 467, "alt": "discourse"}, {"t": "ul", "items": [{"en": "Comments may include wording typical for the \"<a href=\"https://sks.to/discourses\"><strong>discourses of climate delay<\/strong><\/a>\" which may contain a kernel of truth but which still serve the ultimate goal to delay taking meaningful action. These can include mentions of \"fossil fuels will always be needed\" or \"wait until China or India do something\".", "id": "Komentar dapat mencakup kata-kata yang khas untuk \"<a href=\"https://sks.to/discourses\"><strong>wacana penundaan iklim<\/strong><\/a>\" yang mungkin mengandung inti kebenaran namun masih memiliki tujuan akhir untuk menunda pengambilan tindakan yang berarti. Hal ini dapat mencakup penyebutan “bahan bakar fosil akan selalu dibutuhkan” atau “tunggu sampai Tiongkok atau India melakukan sesuatu”."}]}, {"t": "ul", "items": [{"en": "Comments including <strong>ad hominem attacks<\/strong> can safely be disregarded as the commenter(s) posting them have already lost the argument. It is basically just a means to change the topic from facts or science to personalities.", "id": "Komentar yang menyertakan <strong>serangan ad hominem<\/strong> dapat diabaikan dengan aman karena pemberi komentar yang mempostingnya sudah kehilangan argumen. Ini pada dasarnya hanyalah sarana untuk mengubah topik dari fakta atau sains menjadi kepribadian."}]}, {"t": "ul", "items": [{"en": "Comments with <strong>hashtags like \"climatescam\" or \"climatehoax\"<\/strong> show conspiratorial thinking and can also be disregarded.", "id": "Komentar dengan <strong>hashtag seperti \"climatescam\" atau \"climatehoax\"<\/strong> menunjukkan pemikiran konspirasi dan juga dapat diabaikan."}]}, {"t": "img", "src": "images/social-media-warning-signs-wording-in-posts-and-comments/182a339d8b.webp", "w": 570, "hh": 321, "alt": "FLICC Taxonomy"}, {"t": "ul", "items": [{"en": "Comments exhibiting any of the <strong>tell-tale techniques of science denial<\/strong> - \"<a href=\"https://sks.to/flicc-sks\">FLICC<\/a>\" for \"fake experts\", \"logical fallacies\", \"impossible expectations\", \"cherry picking\" and \"conspiracy theories\" - usually make claims which don't stand up to scrutiny but hope that you don't notice!", "id": "Komentar yang menunjukkan salah satu <strong>teknik penyangkalan sains<\/strong> - \"<a href=\"https://sks.to/flicc-sks\">FLICC<\/a>\" untuk \"pakar palsu\", \"kekeliruan logika\", \"ekspektasi yang tidak masuk akal\", \"pilihan ceri\" dan \"teori konspirasi\" - biasanya membuat klaim yang tidak tahan terhadap pengawasan namun berharap Anda tidak menyadarinya!"}]}, {"t": "p", "h": {"en": "Want to check, how good you are spotting these techniques? Here are a few <a href=\"https://skepticalscience.com/cranky-cartoons-and-fallacy-icons.html\">Cranky Uncle cartoons<\/a> depicting some of the them. For more training, we recommend the <a href=\"https://crankyuncle.com/game\">Cranky Uncle game<\/a>.", "id": "Ingin memeriksa, seberapa baik Anda mengenali teknik-teknik ini? Berikut adalah beberapa <a href=\"https://skepticalscience.com/cranky-cartoons-and-fallacy-icons.html\">kartun Cranky Uncle<\/a> yang menggambarkan beberapa di antaranya. Untuk pelatihan lebih lanjut, kami merekomendasikan <a href=\"https://crankyuncle.com/game\">game Cranky Uncle<\/a>."}}, {"t": "img", "src": "images/social-media-warning-signs-wording-in-posts-and-comments/32db3d2bfe.webp", "w": 570, "hh": 403, "alt": "CrankyCartoons"}, {"t": "hr"}, {"t": "p", "h": {"en": "Regular SkS participants familliar with <a href=\"https://skepticalscience.com/comments_policy.shtml\">our Comments Policy<\/a> will recognize that many of these red flags and warning signs are the kind of things that the Comments Policy is designed to discourage like excessive repetition, sloganeering (simple assertion of a myth already debunked), accusations of deception, ad hominems, profanity or inflammatory tone.", "id": "Peserta reguler SkS yang akrab dengan <a href=\"https://skepticalscience.com/comments_policy.shtml\">Kebijakan Komentar kami<\/a> akan menyadari bahwa banyak dari tanda bahaya dan tanda peringatan ini adalah hal-hal yang dirancang untuk tidak dicegah oleh Kebijakan Komentar seperti pengulangan yang berlebihan, slogan (penegasan sederhana dari mitos yang sudah dibantah), tuduhan penipuan, ad hominem, kata-kata kotor atau nada yang menghasut."}}, {"t": "p", "h": {"en": "Did we miss any warning signs? If we did, please let us know in the comments and we may amend the list as needed.", "id": "Apakah kita melewatkan tanda peringatan? Jika ya, beri tahu kami di komentar dan kami dapat mengubah daftarnya sesuai kebutuhan."}}], "intinya": {"id": "Tim Skeptical Science mengumpulkan tanda-tanda bahaya pada komentar di media sosial yang menyangkal perubahan iklim, misalnya mengulang-ulang slogan, menuduh ilmuwan menipu, atau menyerang pribadi. Tanda-tanda ini membantu kita berhenti sejenak sebelum percaya. Daftar lengkapnya ada di gambar berbahasa Inggris.", "en": "Skeptical Science lists red flags in social media comments that deny climate change, such as repeated slogans, accusing scientists of fraud or personal attacks. The full list is in the English image."}, "kw": "media sosial komentar hoaks tanda"};</script>
