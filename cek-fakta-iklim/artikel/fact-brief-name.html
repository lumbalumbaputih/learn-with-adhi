<script>window.POST={"slug": "fact-brief-name", "fb": true, "date": "31 May 2025", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-name.html", "words": 348, "topic": "hoax", "title": {"en": "Fact brief - Was 'global warming' changed to 'climate change' because Earth stopped warming?", "id": "Fakta singkat - Apakah 'pemanasan global' diubah menjadi 'perubahan iklim' karena bumi berhenti melakukan pemanasan?"}, "verdict": "No", "question": {"en": "Was 'global warming' changed to 'climate change' because Earth stopped warming?", "id": "Apakah 'pemanasan global' diubah menjadi 'perubahan iklim' karena bumi berhenti melakukan pemanasan?"}, "sources": [{"en": "The Washington Post <a href=\"https://web.archive.org/web/20220115192607/https:/www.washingtonpost.com/news/capital-weather-gang/wp/2018/01/29/debunking-the-claim-they-changed-global-warming-to-climate-change-because-its-cooling/\">Debunking the claim ‘they’ changed ‘global warming’ to ‘climate change’ because warming stopped<\/a>"}, {"en": "CNN <a href=\"https://edition.cnn.com/2019/03/02/world/global-warming-climate-change-language-scn/index.html\">Is it climate change or global warming? How science and a secret memo shaped the answer<\/a>"}, {"en": "Tellus Journal <a href=\"https://onlinelibrary.wiley.com/doi/abs/10.1111/j.2153-3490.1956.tb01206.x\">The Carbon Dioxide Theory of Climatic Change<\/a>"}, {"en": "IPCC <a href=\"https://www.ipcc.ch/about/history/#:~:text=The%20Intergovernmental%20Panel%20on%20Climate%20Change%20(IPCC)%20was%20established%20by,UN%20General%20Assembly%20in%201988\">History of the IPCC<\/a>"}, {"en": "Google Books Ngram Viewer <a href=\"https://books.google.com/ngrams/graph?content=climate+change%2Cglobal+warming&year_start=1970&year_end=2022&corpus=en&smoothing=3&case_insensitive=true\">Climate change, global warming<\/a>"}, {"en": "The Luntz Research Companies <a href=\"https://web.archive.org/web/20201111230915/https:/web.archive.org/web/20050214031319/http:/www.ewg.org:16080/briefings/luntzmemo/pdf/LuntzResearch_environment.pdf\">The Environment: A Cleaner, Safer, Healthier America<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Both \"global warming\" and \"climate change\" continue to be used as global temperatures continue to rise.", "id": "Kata \"pemanasan global\" dan \"perubahan iklim\" terus digunakan seiring dengan meningkatnya suhu global."}}, {"t": "p", "h": {"en": "The two terms refer to different but related phenomena. Global warming captures increasing average global temperatures observed since the Industrial Revolution. Climate change speaks to the various environmental outcomes of this warming.", "id": "Kedua istilah tersebut merujuk pada fenomena yang berbeda namun terkait. Pemanasan global mencerminkan peningkatan suhu rata-rata global yang diamati sejak Revolusi Industri. Perubahan iklim menunjukkan berbagai dampak lingkungan dari pemanasan ini."}}, {"t": "p", "h": {"en": "The last ten years (2015-2024) were the ten hottest on record, with 2024 breaking the record set in 2023. The last colder-than-average year was 1976. Climate scientists calculate global temperatures by averaging readings from thousands of weather stations, ships, buoys, and satellites around the world.", "id": "Sepuluh tahun terakhir (2015-2024) merupakan sepuluh tahun terpanas yang pernah tercatat, dengan tahun 2024 memecahkan rekor yang dibuat pada tahun 2023. Tahun terakhir yang lebih dingin dari rata-rata terjadi pada tahun 1976. Para ilmuwan iklim menghitung suhu global dengan rata-rata pembacaan dari ribuan stasiun cuaca, kapal, pelampung, dan satelit di seluruh dunia."}}, {"t": "p", "h": {"en": "The 1956 paper \"The Carbon Dioxide Theory of Climatic Change\" outlined CO2’s role in altering climate. Google Books indicates usage of \"climate change\" predated and surpassed \"global warming\" since the 1980s.", "id": "Makalah tahun 1956 yang berjudul \"The Carbon Dioxide Theory of Climatic Change\" menguraikan peran CO2 dalam mengubah iklim. Google Buku menunjukkan penggunaan \"perubahan iklim\" sudah ada sebelum dan melampaui \"pemanasan global\" sejak tahun 1980an."}}, {"t": "p", "h": {"en": "The only notable political push to favor \"climate change\" was a 2002 Bush administration memo that claimed the term was \"less frightening\" than \"global warming.\"", "id": "Satu-satunya dorongan politik penting yang mendukung \"perubahan iklim\" adalah memo pemerintahan Bush tahun 2002 yang menyatakan bahwa istilah tersebut \"tidak terlalu menakutkan\" dibandingkan \"pemanasan global\"."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/name\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/was-global-warming-changed-to-climate-change-because-earth-stopped-warming/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/name\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/was-global-warming-changed-to-climate-change-because-earth-stopped-warming/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://web.archive.org/web/20170604000609/https://twitter.com/realdonaldtrump/status/316252016190054400\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://web.archive.org/web/20170604000609/https://twitter.com/realdonaldtrump/status/316252016190054400\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Istilah pemanasan global diganti menjadi perubahan iklim karena Bumi berhenti memanas.", "en": "'Global warming' became 'climate change' because warming stopped."}, "fakta": {"id": "Kedua istilah tetap dipakai dan artinya berbeda. Bumi terus memanas: 10 tahun terakhir (2015 sampai 2024) adalah yang terpanas.", "en": "Both terms are still used and mean different things. Warming continues: 2015 to 2024 were the ten hottest years."}, "local": {"id": "BMKG mencatat 2024 sebagai tahun dengan suhu rata-rata nasional tertinggi di Indonesia, yaitu 27,52°C. BMKG juga mengingatkan bahwa perubahan iklim menambah risiko kesehatan, misalnya penyakit menular dan kurang gizi.", "en": "BMKG recorded 2024 as Indonesia's hottest year, with a national average of 27.52°C, and warned that climate change raises health risks such as infectious disease and malnutrition.", "src": [{"t": "BMKG, siaran pers 6 Mei 2025", "u": "https://www.bmkg.go.id/siaran-pers/bmkg-2024-jadi-tahun-terpanas-sepanjang-sejarah-perubahan-iklim-kian-membahayakan-kesehatan-publik"}]}, "kw": ""};</script>
