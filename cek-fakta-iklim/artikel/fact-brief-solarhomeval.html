<script>window.POST={"slug": "fact-brief-solarhomeval", "fb": true, "date": "10 February 2026", "byline": "Sue Bin Park", "url": "https://skepticalscience.com/fact-brief-solarhomeval.html", "words": 425, "topic": "energy", "title": {"en": "Fact brief - Can nearby solar farms reduce property values?", "id": "Fakta singkat - Bisakah pembangkit listrik tenaga surya di dekatnya mengurangi nilai properti?"}, "verdict": "Yes", "question": {"en": "Can nearby solar farms reduce property values?", "id": "Bisakah pembangkit listrik tenaga surya di dekatnya mengurangi nilai properti?"}, "sources": [{"en": "Energy Policy Journal <a href=\"https://www.sciencedirect.com/science/article/pii/S0301421523000101?via%3Dihub\">Shedding light on large-scale solar impacts: An analysis of property values and proximity to photovoltaics across six U.S. states<\/a>"}, {"en": "MIT Review of Economics and Statistics <a href=\"https://direct.mit.edu/rest/article/93/4/1391/57903/The-Effect-of-Power-Plants-on-Local-Housing-Values\">The Effect of Power Plants on Local Housing Values and Rents<\/a>"}, {"en": "Kirkland Appraisals <a href=\"https://webgen1files1.revize.com/villagecayugany/Solar%20Property-Kirkland-Grandy-Solar-Impact-Study.pdf\">Grandy Solar Impact Survey<\/a>"}, {"en": "University of Rhode Island <a href=\"https://www.uri.edu/news/wp-content/uploads/news/sites/16/2020/09/PropertyValueImpactsOfSolar.pdf\">PROPERTY VALUE IMPACTS OF COMMERCIAL-SCALE SOLAR ENERGY IN MASSACHUSETTS AND RHODE ISLAND<\/a>"}, {"en": "The University of Texas at Austin <a href=\"https://static1.squarespace.com/static/58d03116725e2542873aa638/t/6058df6f1107f91adc9cc20d/1616437113682/Link+in+No.+13C+-+An+Exploration+of+Property+Value+Impacts+Near+Utility+Scale+Solar+Installations.pdf\">An Exploration of Property-Value Impacts Near Utility-Scale Solar Installations<\/a>"}, {"en": "CohnReznick <a href=\"https://www.mcleancountyil.gov/DocumentCenter/View/13192/Patricia-L-McGarr--Property-Value-Impact-Study?bidId=\">Property Value Impact Study Proposed Solar Farm McLean County, IL<\/a>"}, {"en": "National Academy of Sciences Economic Sciences Journal <a href=\"https://www.pnas.org/doi/10.1073/pnas.2418414122\">Impact of large-scale solar on property values in the United States: Diverse effects and causal mechanisms<\/a>"}, {"en": "Columbia Law School Sabin Center for Climate Change Law <a href=\"https://scholarship.law.columbia.edu/sabin_climate_change/217/\">Rebutting 33 False Claims About Solar, Wind, and Electric Vehicles<\/a>"}], "blocks": [{"t": "p", "h": {"en": "Property values can decline from close proximity with utility-scale solar farms, but the losses are modest and less than from nearby fossil fuel plants.", "id": "Nilai properti dapat menurun jika berdekatan dengan pembangkit listrik tenaga surya skala utilitas, namun kerugian yang ditimbulkan tidak terlalu besar dan lebih kecil dibandingkan dengan pembangkit listrik berbahan bakar fosil yang berada di dekatnya."}}, {"t": "p", "h": {"en": "One 2023 study of 1.8 million homes found minor impacts on property values. Homes within 0.5 miles of solar farms experienced around 1.5% price reductions; homes more than one mile away received no significant effects.", "id": "Sebuah studi pada tahun 2023 terhadap 1,8 juta rumah menemukan dampak kecil terhadap nilai properti. Rumah dalam jarak 0,5 mil dari pembangkit listrik tenaga surya mengalami penurunan harga sekitar 1,5%; rumah-rumah yang berjarak lebih dari satu mil tidak menerima dampak yang signifikan."}}, {"t": "p", "h": {"en": "Another study of 400,000 transactions found an average value decrease of 1.7% within one mile of a solar farm. Most recently, 2025 research indicated a slightly higher decrease of 4.8% for residential property within three miles of utility-scale solar projects.", "id": "Studi lain terhadap 400.000 transaksi menemukan penurunan nilai rata-rata sebesar 1,7% dalam jarak satu mil dari pembangkit listrik tenaga surya. Baru-baru ini, penelitian pada tahun 2025 menunjukkan penurunan yang sedikit lebih tinggi yaitu sebesar 4,8% untuk properti residensial dalam jarak tiga mil dari proyek tenaga surya skala utilitas."}}, {"t": "p", "h": {"en": "Declines largely occur in suburban areas with greater population density and thus competition for space; rural communities experience little comparable impact.", "id": "Penurunan ini sebagian besar terjadi di daerah pinggiran kota dengan kepadatan penduduk yang lebih besar sehingga menimbulkan persaingan untuk mendapatkan ruang; masyarakat pedesaan hanya merasakan dampak yang kecil."}}, {"t": "p", "h": {"en": "In comparison, a study of 92 plants found property value decreases of up to 7% within two miles of a fossil fuel plant.", "id": "Sebagai perbandingan, sebuah penelitian terhadap 92 pabrik menemukan nilai properti menurun hingga 7% dalam jarak dua mil dari pabrik bahan bakar fosil."}}, {"t": "p", "h": {"en": "<a href=\"http://sks.to/solarhomeval\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/can-nearby-solar-farms-reduce-property-values/\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"http://sks.to/solarhomeval\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/can-nearby-solar-farms-reduce-property-values/\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to quotes such as <a href=\"https://perma.cc/2ESH-E6P2\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://perma.cc/2ESH-E6P2\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Ladang panel surya membuat harga rumah di sekitarnya anjlok.", "en": "Solar farms make nearby house prices crash."}, "fakta": {"id": "Harga rumah yang sangat dekat bisa turun sedikit, sekitar 1,5%. Dampaknya lebih kecil daripada tinggal dekat pembangkit batu bara atau gas.", "en": "Homes very close by may lose a little value, about 1.5%, less than near coal or gas plants."}, "kw": "panel surya harga rumah tanah"};</script>
