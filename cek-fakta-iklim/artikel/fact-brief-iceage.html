<script>window.POST={"slug": "fact-brief-iceage", "fb": true, "date": "21 December 2024", "byline": "Guest Author", "url": "https://skepticalscience.com/fact-brief-iceage.html", "words": 401, "topic": "warm", "title": {"en": "Fact brief - Are we heading into an 'ice age'?", "id": "Fakta singkat - Apakah kita sedang menuju ke 'zaman es'?"}, "verdict": "No", "question": {"en": "Are we heading into an ‘ice age’?", "id": "Apakah kita sedang menuju ke ‘zaman es’?"}, "sources": [{"en": "NASA <a href=\"https://archive.ph/OUDi8\">Milankovitch (Orbital) Cycles and Their Role in Earth’s Climate<\/a>"}, {"en": "Cornell University <a href=\"https://archive.ph/4RESr\">Understanding long-term climate and CO2 change<\/a>"}, {"en": "UC San Diego <a href=\"https://archive.is/HjEut\">The Keeling Curve Hits 420 PPM<\/a>"}, {"en": "Woods Hole Oceanographic Institution <a href=\"https://archive.is/wbJij\">Are we heading toward another Little Ice Age?<\/a>"}, {"en": "NASA <a href=\"https://archive.is/Og7h8\">Global Temperature<\/a>"}], "blocks": [{"t": "p", "h": {"en": "The planet has been getting warmer since the Industrial Revolution, not colder.", "id": "Suhu bumi semakin panas sejak Revolusi Industri, bukan semakin dingin."}}, {"t": "p", "h": {"en": "Historically, ice ages have followed changes in the Earth’s relationship to the sun. Natural cycles affect the tilt of Earth’s axis and its orbit around the sun. As Earth’s axis becomes less tilted, and its orbit more elliptical, it receives less solar radiation.", "id": "Secara historis, zaman es mengikuti perubahan hubungan bumi dengan matahari. Siklus alam mempengaruhi kemiringan poros bumi dan orbitnya mengelilingi matahari. Ketika poros bumi menjadi kurang miring dan orbitnya menjadi lebih elips, radiasi matahari yang diterimanya pun semakin sedikit."}}, {"t": "p", "h": {"en": "These “Milankovitch” cycles occur over thousands of years. Currently, Earth’s tilt is halfway between its maximum and minimum while its orbit is nearly circular.", "id": "Siklus “Milankovitch” ini terjadi selama ribuan tahun. Saat ini, kemiringan bumi berada di tengah-tengah antara maksimum dan minimum, sedangkan orbitnya hampir berbentuk lingkaran."}}, {"t": "p", "h": {"en": "In the absence of human activity, Earth may have gradually cooled in the coming centuries with phases corresponding to a decreasing tilt and an increasing orbital eccentricity.", "id": "Dengan tidak adanya aktivitas manusia, Bumi mungkin akan mendingin secara bertahap pada abad-abad mendatang dengan fase-fase yang berhubungan dengan penurunan kemiringan dan peningkatan eksentrisitas orbit."}}, {"t": "p", "h": {"en": "However, fossil-fuel burning and other actions have raised CO2 levels to 420 parts per million—far above the 180-280 ppm seen during past ice ages. This extra CO2 has made it harder for heat to escape the atmosphere, overpowering the natural cooling trend.", "id": "Namun, pembakaran bahan bakar fosil dan tindakan lainnya telah meningkatkan kadar CO2 hingga 420 bagian per juta—jauh di atas angka 180-280 ppm yang terlihat pada zaman es masa lalu. Tambahan CO2 ini mempersulit panas untuk keluar dari atmosfer, sehingga mengalahkan tren pendinginan alami."}}, {"t": "p", "h": {"en": "<a href=\"https://sks.to/iceage\">Go to full rebuttal on Skeptical Science<\/a> or <a href=\"https://gigafact.org/fact-briefs/are-we-heading-into-an-ice-age\">to the fact brief on Gigafact<\/a>", "id": "<a href=\"https://sks.to/iceage\">Baca penjelasan lengkap di Skeptical Science<\/a> atau <a href=\"https://gigafact.org/fact-briefs/are-we-heading-into-an-ice-age\">di Gigafact<\/a> (Bahasa Inggris)."}}, {"t": "p", "h": {"en": "This fact brief is responsive to conversations such as <a href=\"https://archive.is/i60zs\">this one<\/a>.", "id": "Tulisan ini menjawab kabar seperti <a href=\"https://archive.is/i60zs\">yang ini<\/a> (Bahasa Inggris)."}}], "claim": {"id": "Bumi sedang menuju zaman es.", "en": "We're heading into an ice age."}, "fakta": {"id": "Sejak Revolusi Industri Bumi makin panas, bukan makin dingin. Zaman es mengikuti perubahan orbit Bumi yang berlangsung ribuan tahun.", "en": "Earth has warmed since the Industrial Revolution, not cooled. Ice ages follow orbit changes over thousands of years."}, "kw": "zaman es dingin"};</script>
