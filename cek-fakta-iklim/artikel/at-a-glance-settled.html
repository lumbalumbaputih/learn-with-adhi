<main id="app" class="wrap" tabindex="-1"><noscript><h1>Sekilas – Apakah ilmu pengetahuan sudah mapan?</h1><p>Ilmu pengetahuan terus berkembang. Hal-hal dasar tentang iklim sudah pasti, misalnya CO2 menahan panas dan permukaan laut naik saat es mencair. Yang masih diteliti adalah detailnya, misalnya kapan tepatnya sebuah kota pantai akan terdampak.</p><p><a href="https://skepticalscience.com/at-a-glance-settled.html">Tulisan asli di Skeptical Science</a></p></noscript></main>

<script>window.POST={"slug": "at-a-glance-settled", "fb": false, "date": "16 April 2024", "byline": "John Mason, BaerbelW", "url": "https://skepticalscience.com/at-a-glance-settled.html", "words": 1152, "topic": "hoax", "title": {"en": "At a glance - Is the science settled?", "id": "Sekilas – Apakah ilmu pengetahuan sudah mapan?"}, "verdict": null, "blocks": [{"t": "img", "src": "images/at-a-glance-settled/4025158c05.webp", "w": 570, "hh": 406, "alt": "Fact-Myth-Box"}, {"t": "h2", "h": {"en": "At a glance", "id": "Sekilas"}}, {"t": "p", "h": {"en": "Science, in all of its aspects, is an ongoing matter. It is based on making progress. For a familiar example, everyone knows that the dinosaurs died out suddenly, 65 million years ago. They vanished from the fossil record. The science is settled on that. But how and why that happened is still a really interesting research area. We know a monster asteroid smacked into the planet at roughly the same time. But we cannot yet conclude with 100% certainty that the asteroid bore sole responsibility for everything that followed.", "id": "Ilmu pengetahuan, dalam segala aspeknya, merupakan masalah yang berkelanjutan. Hal ini didasarkan pada kemajuan yang dicapai. Sebagai contoh umum, semua orang tahu bahwa dinosaurus mati secara tiba-tiba, 65 juta tahun yang lalu. Mereka lenyap dari catatan fosil. Ilmu pengetahuan telah menetapkan hal itu. Namun bagaimana dan mengapa hal itu terjadi masih merupakan bidang penelitian yang sangat menarik. Kita tahu bahwa ada asteroid raksasa yang menghantam planet ini pada waktu yang hampir bersamaan. Namun kita belum bisa menyimpulkan dengan kepastian 100% bahwa asteroid tersebut bertanggung jawab penuh atas segala kejadian yang terjadi setelahnya."}}, {"t": "p", "h": {"en": "With regard to climate science, the basis of the greenhouse effect was demonstrated in the 19th Century. The effect on global temperature through doubling the concentration of atmospheric CO₂ had been calculated before 1900 and was not far off modern estimates. Raising global temperature causes Earth's climatic belts to shift polewards. Higher temperatures reduce the amount of land-ice on the planet. That in turn causes sea levels to rise. These are such simple basic physical principles that we can confidently state the science is settled on all of them.", "id": "Berkaitan dengan ilmu iklim, dasar terjadinya efek rumah kaca telah dibuktikan pada abad ke-19. Dampaknya terhadap suhu global melalui penggandaan konsentrasi CO₂ di atmosfer telah dihitung sebelum tahun 1900 dan tidak jauh dari perkiraan modern. Meningkatnya suhu global menyebabkan sabuk iklim bumi bergeser ke arah kutub. Temperatur yang lebih tinggi mengurangi jumlah daratan es di planet ini. Hal ini pada gilirannya menyebabkan permukaan air laut naik. Ini adalah prinsip-prinsip fisika dasar yang sederhana sehingga kita dapat dengan yakin menyatakan bahwa ilmu pengetahuan telah menetapkan semuanya."}}, {"t": "p", "h": {"en": "Where the science is less settled is in the fine detail. For example, if you live in a coastal town at a low elevation, you would obviously like to know when it is likely to be affected by rising seas. But that's difficult.", "id": "Di mana ilmu pengetahuan kurang terselesaikan, hal ini terjadi pada detail yang halus. Misalnya, jika Anda tinggal di kota pesisir dengan ketinggian rendah, Anda tentu ingin mengetahui kapan kota tersebut akan terkena dampak naiknya air laut. Tapi itu sulit."}}, {"t": "p", "h": {"en": "Difficult because changes in sea levels, variations in the sizes of tides and weather patterns are all factors that operate independently of each other and on different time-scales. We may well know that a big storm-surge hitting the coast at high water on a spring tide is the worst-case scenario, but we don't know exactly when that might happen in the decades ahead. Too many variables.", "id": "Sulit karena perubahan permukaan air laut, variasi ukuran pasang surut dan pola cuaca merupakan faktor-faktor yang terjadi secara independen satu sama lain dan dalam skala waktu yang berbeda. Kita mungkin tahu bahwa gelombang badai besar yang melanda pantai saat air pasang saat air pasang adalah skenario terburuk, tapi kita tidak tahu persis kapan hal itu akan terjadi dalam beberapa dekade mendatang. Terlalu banyak variabel."}}, {"t": "p", "h": {"en": "Such minute but important details are where the science isn't settled. Yes we know that if we carry on spewing out tens of billions of tonnes of CO₂ every year, things will get really bad. Where and when is the tricky bit. But if climate change was a deadly pathogen, for which there was a vaccine, most of us would get that jab.", "id": "Detail-detail kecil namun penting seperti itu tidak diselesaikan secara ilmiah. Ya, kita tahu bahwa jika kita terus mengeluarkan puluhan miliar ton CO₂ setiap tahunnya, keadaan akan menjadi sangat buruk. Di mana dan kapan adalah bagian yang rumit. Namun jika perubahan iklim merupakan patogen mematikan yang sudah ada vaksinnya, maka sebagian besar dari kita akan terkena dampaknya."}}, {"t": "p", "h": {"en": "In passing, the myth in the box above illustrates a key tactic of misinformation-practitioners, to mix up a whole bunch of talking-points into a rhetorical torrent. The classic example of the practice is the 'Gish-gallop'.", "id": "Singkatnya, mitos dalam kotak di atas menggambarkan taktik utama para praktisi misinformasi, yaitu mencampurkan sejumlah pokok pembicaraan ke dalam aliran retoris. Contoh klasik dari latihan ini adalah 'Gish-gallop'."}}, {"t": "p", "h": {"en": "The term Gish-gallop was coined in reference to a leading American member of the creationist movement, Duane Gish (1921-2013). Gish was well-known for relishing fiery public debates with evolutionists. He perfected the method of presenting multiple arguments in a rapid-fire but scattergun manner so that they are impossible to answer in a structured form. It's the opposite of scientific discussion. The Gish-galloper appears to the viewers or listeners to be winning the debate. 'Appears' is the keyword here, though. If you can recognise a Gish-gallop developing, you can make your own mind up quickly.", "id": "Istilah Gish-gallop diciptakan untuk merujuk pada anggota gerakan kreasionis terkemuka Amerika, Duane Gish (1921-2013). Gish terkenal menyukai perdebatan publik yang berapi-api dengan para evolusionis. Ia menyempurnakan metode penyampaian argumen ganda secara cepat namun tersebar sehingga tidak mungkin dijawab dalam bentuk terstruktur. Ini kebalikan dari diskusi ilmiah. Gish-galloper tampak di mata pemirsa atau pendengar sebagai pemenang perdebatan. 'Muncul' adalah kata kuncinya di sini. Jika Anda dapat mengenali perkembangan Gish-gallop, Anda dapat mengambil keputusan sendiri dengan cepat."}}, {"t": "p", "h": {"en": "<em><strong><em>Please use <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/settled-science.htm\">this form<\/a> to provide feedback about this new \"At a glance\" section. Read a more technical version below or dig deeper via the tabs above!<\/em><\/strong><\/em>", "id": "<em><strong><em>Silakan gunakan <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdRzpqErVxgQBFL55F9I9PloC4qWugawcCJXTofNwiq0ZKOLg/viewform?usp=pp_url&entry.386351903=https://skepticalscience.com/settled-science.htm\">formulir ini<\/a> untuk memberikan masukan tentang bagian \"Sekilas\" yang baru ini. Baca versi yang lebih teknis di bawah atau gali lebih dalam melalui tab di atas!<\/em><\/strong><\/em>"}}, {"t": "hr"}, {"t": "h2", "h": {"en": "<a href=\"https://skepticalscience.com/settled-science-basic.htm\">Click for Further details<\/a>", "id": "<a href=\"https://skepticalscience.com/settled-science-basic.htm\">Klik untuk detail lebih lanjut<\/a>"}}, {"t": "p", "h": {"en": "In case you'd like to explore more of our recently updated rebuttals, here are the links to all o
