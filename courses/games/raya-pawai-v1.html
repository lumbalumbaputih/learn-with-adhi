<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pawai Hewan 🐥 · Learn with Adhi</title>
  <meta name="description" content="Pawai Hewan — game pola untuk Raya. 50 level di 5 tempat: tiru, lanjutkan, isi, dan perbaiki barisan pawai hewan. Semua dibacakan dengan suara.">
  <meta name="theme-color" content="#78C6F7">
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%23FF6FA5"/><text y=".9em" font-size="64" x="16">🐥</text></svg>'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1A1614; --paper: #FBF4E6; --muted: #6B6259;
      --raya: #FF6FA5; --raya-d: #E04B86; --gold: #FFC234; --sky: #4BA3F5;
      --road: #E6CF9B; --road-d: #C9AE73; --fl: #FF8FB8;
      --fd: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
      --fb: 'Nunito', system-ui, sans-serif;
      --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { font-family: var(--fb); color: var(--ink); background: #BDE4F7; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, [role="button"]:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
    .hidden { display: none !important; }

    /* ---------- scenery ---------- */
    #scene { position: fixed; inset: 0; z-index: 0; }
    #scene svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .7s; }
    #scene svg.on { opacity: 1; }

    /* ---------- HUD ---------- */
    .hud { position: fixed; top: 0; left: 0; right: 0; z-index: 35; /* above the win card, so mute/back still work */ display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--st)) 10px 6px; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .ib { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 2.5px solid var(--ink); background: #fff; font-size: 20px; line-height: 1; display: grid; place-items: center; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
    .ib:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .hud-title { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: rgba(255,255,255,.92); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); font-family: var(--fd); font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; }
    .hud-title span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .hud-stars { flex: none; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: var(--gold); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); font-family: var(--fd); font-weight: 800; font-size: 18px; }

    /* ---------- screens ---------- */
    .scr { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; padding: calc(60px + var(--st)) 12px calc(10px + var(--sb)); }

    /* start */
    #scrStart { align-items: center; justify-content: center; text-align: center; gap: 14px; }
    .logo { font-family: var(--fd); font-weight: 800; font-size: clamp(40px, 10vw, 76px); line-height: .95; color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
    .logo small { display: block; font-size: .42em; color: var(--gold); margin-top: 6px; }
    .strip { position: relative; width: 100%; max-width: 900px; height: 86px; overflow: hidden; }
    .strip .pm { position: absolute; bottom: 6px; left: 0; font-size: 54px; line-height: 1; animation: walk 10s linear infinite; }
    .strip .pm span { display: block; animation: bob2 .5s ease-in-out infinite alternate; }
    @keyframes walk { from { transform: translateX(-80px); } to { transform: translateX(min(100vw, 900px)); } }
    @keyframes bob2 { to { transform: translateY(-10px); } }
    .go { border: 3px solid var(--ink); border-radius: 999px; background: var(--raya); color: #fff; font-family: var(--fd); font-weight: 800; font-size: 28px; padding: 12px 38px; box-shadow: 5px 5px 0 var(--ink); display: inline-flex; align-items: center; gap: 10px; transition: transform .12s, box-shadow .12s; }
    .go:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    .go.pulse { animation: gop 1.4s ease-in-out infinite; }
    @keyframes gop { 50% { transform: scale(1.06); } }

    /* map */
    #scrMap { align-items: center; gap: 12px; overflow-y: auto; }
    .stops { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 780px; }
    .stop { width: 96px; border: 2.5px solid var(--ink); border-radius: 18px; background: #fff; box-shadow: 3px 3px 0 var(--ink); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .stop .si { font-size: 30px; line-height: 1.1; }
    .stop .sn { font-family: var(--fd); font-weight: 800; font-size: 13px; line-height: 1.1; }
    .stop .sc { font-size: 12px; font-weight: 800; color: var(--muted); }
    .stop.sel { background: var(--gold); transform: translateY(-3px); }
    .stop.locked { opacity: .6; }
    .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; max-width: 520px; padding: 8px 6px; }
    .lv { aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 20px; background: #fff; box-shadow: 4px 4px 0 var(--ink); font-family: var(--fd); font-weight: 800; font-size: clamp(20px, 6vw, 30px); position: relative; display: grid; place-items: center; }
    .lv:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    .lv.done { background: #FFF1B8; }
    .lv.done::after { content: '⭐'; position: absolute; top: -12px; right: -10px; font-size: 22px; }
    .lv.cur { background: var(--raya); color: #fff; animation: gop 1.3s ease-in-out infinite; }
    .lv.locked { background: #ECE7DE; color: #B3A99D; box-shadow: 2px 2px 0 rgba(26,22,20,.4); border-color: rgba(26,22,20,.4); }
    .lv.locked::after { content: '🔒'; position: absolute; top: -10px; right: -8px; font-size: 18px; }
    .lv .bz { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-size: 18px; }
    .mapfoot { display: flex; gap: 10px; align-items: center; justify-content: center; }
    .pbtn { border: 2px solid rgba(26,22,20,.5); background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 13px; color: var(--muted); }

    /* play */
    #scrPlay { gap: 8px; }
    .bubble { flex: none; width: 100%; max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.95); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 3px 3px 0 var(--ink); padding: 5px 12px; min-height: 50px; }
    .mascot { flex: none; font-size: 30px; line-height: 1; position: relative; }
    .mascot i { font-style: normal; position: absolute; right: -10px; bottom: -4px; font-size: 17px; }
    .mascot.talk { animation: hop2 .5s ease-in-out 2; }
    @keyframes hop2 { 50% { transform: translateY(-6px) rotate(-6deg); } }
    .cue { flex: none; font-size: 24px; line-height: 1; }
    .ptext { flex: 1; min-width: 0; font-family: var(--fd); font-weight: 800; font-size: 17px; line-height: 1.15; }
    .dots { flex: none; display: flex; gap: 4px; flex-wrap: wrap; max-width: 90px; justify-content: flex-end; }
    .dots i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
    .dots i.on { background: var(--gold); }
    .dots i.now { background: var(--raya); }

    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--s, 60px) * .34); transition: opacity .25s; }
    .stage.fade { opacity: 0; }
    .lane { position: relative; z-index: 0; display: flex; flex-direction: column; align-items: center; }
    .lane::after { content: ''; position: absolute; left: -60vw; right: -60vw; bottom: calc(var(--s, 60px) * -.12); height: calc(var(--s, 60px) * .3); background: var(--road); border-top: 3px solid var(--road-d); border-bottom: 3px solid var(--road-d); z-index: -1; }
    .lane.mlane::after { background: rgba(255,255,255,.55); border-color: rgba(26,22,20,.18); }

    .row { display: flex; align-items: flex-end; justify-content: center; gap: calc(var(--s) * .12); position: relative; }
    .row.carts { gap: calc(var(--s) * .16); }
    .row.hasbal { padding-top: calc(var(--s) * .8); }
    .cell { flex: none; width: var(--s); height: var(--s); position: relative; display: grid; place-items: end center; }
    .cell > .it, .cell > .hole { z-index: 1; }
    .it { position: relative; width: 100%; height: 100%; display: grid; place-items: end center; }
    .em { display: block; font-style: normal; font-size: calc(var(--s) * .8 * var(--z, 1)); line-height: 1; transform-origin: 50% 100%; filter: drop-shadow(0 2px 0 rgba(26,22,20,.22)); }
    .cell .it .em { animation: bob 1.8s ease-in-out infinite; }
    .cell:nth-child(2n) .it .em { animation-delay: -.6s; }
    .cell:nth-child(3n) .it .em { animation-delay: -1.2s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--s) * -.035)); } }
    .hop .em, .hop.em { animation: hop .46s var(--ease) !important; }
    @keyframes hop { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(calc(var(--s, 60px) * -.34)) scale(1.14); } 72% { transform: translateY(0) scale(1.06, .94); } 100% { transform: translateY(0) scale(1); } }
    .bal { position: absolute; left: 50%; bottom: 86%; width: calc(var(--s) * .46); height: calc(var(--s) * .56); margin-left: calc(var(--s) * -.23); border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.8) 0 11%, transparent 12%), var(--bc); border: 2px solid rgba(26,22,20,.55); }
    .bal::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: calc(var(--s) * .3); margin-left: -1px; background: rgba(26,22,20,.45); }
    .hole { position: absolute; inset: 7%; border-radius: 50%; border: 3px dashed rgba(26,22,20,.32); background: rgba(255,255,255,.55); display: grid; place-items: center; }
    .cell.q .hole::after { content: '?'; font-family: var(--fd); font-weight: 800; color: var(--raya-d); font-size: calc(var(--s) * .5); line-height: 1; }
    .cell.empty .hole { border-color: rgba(26,22,20,.2); background: rgba(255,255,255,.35); }
    .cell.cur .hole { border: 3px solid var(--raya-d); background: #fff; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 calc(var(--s) * .08) rgba(255,111,165,.35); } }
    .cell.lit::before { content: ''; position: absolute; inset: -14%; border-radius: 50%; background: radial-gradient(circle, rgba(255,226,110,.95) 0 45%, rgba(255,226,110,0) 70%); animation: glowp 1s ease-in-out infinite; z-index: 0; }
    @keyframes glowp { 50% { transform: scale(1.12); } }
    .row.units .cell::after { content: ''; position: absolute; top: -8%; bottom: -6%; left: calc(var(--s) * -.06); right: calc(var(--s) * -.06); background: var(--ug); z-index: 0; }
    .row.units.carts .cell::after { left: calc(var(--s) * -.03); right: calc(var(--s) * -.03); }
    .row.units.carts .cell.uf::after { left: calc(var(--s) * -.1); }
    .row.units.carts .cell.ul::after { right: calc(var(--s) * -.1); }
    .row.units .cell.u0 { --ug: rgba(255,255,255,.78); }
    .row.units .cell.u1 { --ug: rgba(255,194,52,.6); }
    .row.units .cell.uf::after { border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
    .row.units .cell.ul::after { border-top-right-radius: 16px; border-bottom-right-radius: 16px; }
    .cell.tapme { cursor: pointer; }
    .cell.cellglow::before { content: ''; position: absolute; inset: -16%; border-radius: 50%; border: 4px solid var(--gold); box-shadow: 0 0 0 6px rgba(255,194,52,.4); animation: glowp .8s ease-in-out infinite; z-index: 0; }
    .wig { animation: wig .5s ease !important; }
    @keyframes wig { 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }

    /* parade floats (mobil hias) */
    .float { display: flex; align-items: flex-end; gap: calc(var(--s) * .06); padding: 0 calc(var(--s) * .14) calc(var(--s) * .34); position: relative; }
    .float::before { content: ''; position: absolute; left: 0; right: 0; bottom: calc(var(--s) * .1); height: calc(var(--s) * .28); background: var(--fl); border: 2.5px solid var(--ink); border-radius: calc(var(--s) * .12); box-shadow: inset 0 calc(var(--s) * -.06) 0 rgba(0,0,0,.13); }
    .float .wh { position: absolute; bottom: 0; width: calc(var(--s) * .22); height: calc(var(--s) * .22); border-radius: 50%; background: #3A3330; border: 2px solid var(--ink); box-shadow: inset 0 0 0 calc(var(--s) * .05) #9A918B; }
    .float .wh.l { left: 16%; } .float .wh.r { right: 16%; }
    .float.col { flex-direction: column-reverse; align-items: center; gap: 0; }
    .float.col .cell { height: calc(var(--s) * .8); }
    .float .nbadge { position: absolute; top: calc(var(--s) * -.5); left: 50%; transform: translateX(-50%); background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; font-family: var(--fd); font-weight: 800; font-size: calc(var(--s) * .4); min-width: calc(var(--s) * .6); text-align: center; line-height: 1.2; padding: 0 6px; display: none; }
    .row.counts .float .nbadge { display: block; }

    /* choices */
    .tray { flex: none; display: flex; justify-content: center; align-items: center; gap: 16px; }
    .tray.cards { gap: 14px; }
    .tray.cards.vert { flex-direction: column; gap: 10px; }
    .ch { flex: none; width: var(--cs); height: var(--cs); border-radius: 50%; border: 3px solid var(--ink); background: #fff; box-shadow: 4px 4px 0 var(--ink); position: relative; display: grid; place-items: center; padding: 0; --s: calc(var(--cs) * .74); transition: transform .12s, box-shadow .12s; }
    .ch .it { width: var(--s); height: var(--s); place-items: center; }
    .ch .em { font-size: calc(var(--s) * .9 * var(--z, 1)); }
    .ch.hasbal { --s: calc(var(--cs) * .5); }
    .ch.hasbal .it { margin-top: calc(var(--cs) * .3); place-items: end center; }
    .ch:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    .card { flex: none; border: 3px solid var(--ink); border-radius: 18px; background: #fff; box-shadow: 4px 4px 0 var(--ink); padding: 10px 12px; display: grid; place-items: center; transition: transform .12s, box-shadow .12s; --s: var(--m, 36px); }
    .card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    .card .row { gap: calc(var(--s) * .08); }
    .card .grid { display: grid; gap: calc(var(--s) * .1); }
    .glow { animation: chglow 1s ease-in-out infinite; }
    @keyframes chglow { 50% { box-shadow: 4px 4px 0 var(--ink), 0 0 0 9px rgba(255,194,52,.8); } }
    .glow.strong { animation: chglow 1s ease-in-out infinite, chbounce .8s ease-in-out infinite; }
    @keyframes chbounce { 0%, 100% { translate: 0 0; } 50% { translate: 0 -14px; } }
    .fly { position: fixed; z-index: 25; pointer-events: none; line-height: 1; left: 0; top: 0; }

    /* win */
    .win { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(26,22,20,.32); padding: 16px; }
    .wcard { background: #fff; border: 3px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink); padding: 18px 26px; text-align: center; max-width: 92vw; animation: popin .5s var(--ease); }
    @keyframes popin { from { transform: scale(.6); opacity: 0; } }
    .wstar { font-size: 76px; line-height: 1.05; animation: spin 1.1s var(--ease); }
    @keyframes spin { from { transform: rotate(-200deg) scale(.2); } }
    .wtitle { font-family: var(--fd); font-weight: 800; font-size: 30px; }
    .wsub { font-weight: 800; color: var(--muted); margin: 2px 0 12px; }
    .wbtns { display: flex; gap: 14px; justify-content: center; align-items: center; }
    .wb { width: 58px; height: 58px; font-size: 26px; border-radius: 18px; }

    /* parent panel */
    .pd { position: fixed; inset: 0; z-index: 40; background: rgba(26,22,20,.5); display: grid; place-items: center; padding: 16px; }
    .pdc { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; max-width: 580px; width: 100%; max-height: 86vh; overflow-y: auto; padding: 18px 18px 22px; font-size: 15px; line-height: 1.5; user-select: text; -webkit-user-select: text; }
    .pdc h2 { font-family: var(--fd); font-size: 24px; margin-bottom: 6px; padding-right: 50px; }
    .pdc h3 { font-family: var(--fd); font-size: 17px; margin: 14px 0 4px; }
    .pdc ul { padding-left: 20px; }
    .pdc li { margin: 2px 0; }
    .pdc .pdx { position: absolute; top: 12px; right: 12px; }
    .pdc label { display: flex; gap: 8px; align-items: center; font-weight: 800; margin-top: 8px; }
    .pdc input { width: 22px; height: 22px; }
    .pdc .muted { color: var(--muted); font-size: 13px; }

    #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 26; pointer-events: none; }

    @media (orientation: landscape) and (max-height: 520px) {
      .scr { padding-top: calc(56px + var(--st)); }
      .hud { padding-top: calc(6px + var(--st)); }
      .lvgrid { grid-template-columns: repeat(10, 1fr); max-width: 820px; gap: 10px; }
      .stop { flex-direction: row; width: auto; gap: 6px; padding: 4px 10px; }
      .stop .si { font-size: 24px; }
      .strip { height: 70px; } .strip .pm { font-size: 44px; }
      .bubble { min-height: 44px; padding: 3px 12px; }
      .ptext { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cell .it .em, .strip .pm span, .go.pulse, .lv.cur, .cell.cur .hole, .cell.lit::before { animation: none !important; }
      .strip .pm { animation-duration: 40s; }
    }
  </style>
</head>
<body>

<div id="scene" aria-hidden="true">
  <!-- 0 Taman -->
  <svg id="bg0" class="on" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice">
    <defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78C6F7"/><stop offset=".7" stop-color="#D6F0FF"/></linearGradient></defs>
    <rect width="1000" height="600" fill="url(#g0)"/>
    <circle cx="860" cy="95" r="62" fill="#FFD84D" opacity=".3"/><circle cx="860" cy="95" r="44" fill="#FFD84D"/>
    <g fill="#fff"><ellipse cx="170" cy="100" rx="64" ry="22"/><ellipse cx="205" cy="84" rx="38" ry="26"/><ellipse cx="560" cy="64" rx="52" ry="18"/><ellipse cx="590" cy="52" rx="30" ry="20"/></g>
    <path d="M0 360 Q170 290 360 345 T720 330 T1000 320 V600 H0Z" fill="#AEE08C"/>
    <path d="M0 420 Q250 370 520 415 T1000 405 V600 H0Z" fill="#82CF62"/>
    <g><rect x="74" y="272" width="16" height="80" rx="4" fill="#8A5A3B"/><circle cx="82" cy="262" r="40" fill="#4CAF50"/><circle cx="58" cy="282" r="26" fill="#5DBE5A"/><circle cx="106" cy="280" r="26" fill="#5DBE5A"/></g>
    <g><rect x="900" y="262" width="16" height="80" rx="4" fill="#8A5A3B"/><circle cx="908" cy="250" r="44" fill="#43A047"/><circle cx="880" cy="272" r="28" fill="#55B851"/><circle cx="936" cy="270" r="28" fill="#55B851"/></g>
    <g fill="#FF7FA8"><circle cx="150" cy="470" r="8"/><circle cx="420" cy="530" r="7"/><circle cx="760" cy="480" r="8"/></g>
    <g fill="#FFE066"><circle cx="300" cy="500" r="7"/><circle cx="640" cy="545" r="8"/><circle cx="880" cy="520" r="7"/></g>
    <g fill="#fff"><circle cx="520" cy="470" r="6"/><circle cx="60" cy="540" r="7"/></g>
  </svg>
  <!-- 1 Pantai -->
  <svg id="bg1" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FC0F2"/><stop offset=".6" stop-color="#E2F6FF"/></linearGradient></defs>
    <rect width="1000" height="600" fill="url(#g1)"/>
    <circle cx="150" cy="95" r="60" fill="#FFE066" opacity=".3"/><circle cx="150" cy="95" r="42" fill="#FFE066"/>
    <g fill="#fff"><ellipse cx="700" cy="90" rx="60" ry="20"/><ellipse cx="735" cy="76" rx="34" ry="22"/></g>

  /* ---------- round: copy a parade, or the same pattern with new animals (translate) ---------- */
  async function rCopy(R, sp, r, first) {

  /* ---------- round: one animal is in the wrong place; tap it ---------- */
  async function rFix(R, sp, r, first) {

  /* ---------- round: growing pattern (1, 2, 3, ...) ---------- */
  async function rGrow(R, sp, r, first) {
    var s0 = [1, 2, 1][r % 3], counts = [s0, s0 + 1, s0 + 2], ans = s0 + 3;

      '<li>🏖️ <b>Pantai</b> (11–20): AB di tengah barisan dan dengan warna balon, lalu AAB dan ABB.</li>' +
      '<li>🌲 <b>Hutan</b> (21–30): ABC, AABB, dan besar-kecil.</li>' +
      '<li>🌾 <b>Sawah</b> (31–40): pola warna dan ukuran, isi yang hilang, dan cari yang salah.</li>' +
      '<li>🏮 <b>Pawai Malam</b> (41–50): ABCD, pola yang sama dengan hewan lain, mencari kelompok yang berulang, dan pola tumbuh (1, 2, 3, …).</li></ul>';
    h += '<h3>Kalau Raya keliru</h3><p>Tidak pernah ada tanda silang atau kata "salah!". Keliru pertama: polanya dibacakan lagi. Keliru kedua: kelompoknya diberi warna dan jawabannya bersinar. Keliru ketiga: jawabannya melompat-lompat. Kalau satu ronde butuh bantuan, game menambah <strong>satu ronde latihan</strong> yang sejenis (sekali per level). Level berikutnya terbuka setelah level sebelumnya selesai.</p>';
    h += '<h3>Cara membantu</h3><ul><li>Ucapkan polanya bersama sambil tepuk tangan: "kucing (tepuk), katak (tepuk), kucing (tepuk), katak…".</li><li>Mobil hias (kereta kecil di bawah hewan) mengelompokkan setiap bagian pola. Di level tanpa mobil, tunjuk kelompoknya dengan jari.</li><li>Main sebentar saja (2–3 level), lebih baik sering daripada lama.</li></ul>';
    h += '<h3>Di mana Raya butuh bantuan</h3>';
    if (rows.length) h += '<ul>' + rows.map(function (x) { return '<li><b>' + B[LEVELS[x.i].b].icon + ' Level ' + (x.i % 10 + 1) + '</b> · ' + levelName(x.i) + ': rata-rata ' + x.avg.toFixed(1).replace('.', ',') + '× keliru per main (' + x.o.plays + '× main)</li>'; }).join('') + '</ul>';
    else h += '<p class="muted">Belum ada catatan. Daftar ini terisi setelah Raya main (hanya tersimpan di perangkat ini).</p>';
    h += '<label><input type="checkbox" id="unlockAll"' + (unlockAll() ? ' checked' : '') + '> Buka semua level (untuk orang tua)</label>';
    h += '<p class="muted" style="margin-top:10px">Bintang ikut tersinkron ke dashboard orang tua kalau Raya masuk lewat akun keluarga. Catatan bantuan di atas hanya ada di perangkat ini.</p>';
    $('pdBody').innerHTML = h;
    $('unlockAll').addEventListener('change', function (e) { try { localStorage.setItem('rayaPawaiUnlockAll', e.target.checked ? '1' : '0'); } catch (_) {} showMap(G.mapB); });
    $('pd').classList.remove('hidden'); $('pdX').focus();
  }
  function closeParent() { $('pd').classList.add('hidden'); $('parentBtn').focus(); }
  $('parentBtn').addEventListener('click', openParent);
  $('pdX').addEventListener('click', closeParent);
  $('pd').addEventListener('click', function (e) { if (e.target === $('pd')) closeParent(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('pd').classList.contains('hidden')) closeParent(); });

  /* start-screen parade strip */
  (function () {
    var list = ['kucing', 'katak', 'kucing', 'katak', 'panda', 'anakayam', 'panda', 'anakayam'], h = '';
    list.forEach(function (k, i) { h += '<div class="pm" style="animation-delay:' + (-i * 1.25) + 's"><span style="animation-delay:' + (i % 2 * 0.25) + 's">' + ANIMALS[k].em + '</span></div>'; });
    $('strip').innerHTML = h;
  })();

  showScreen('start');
  if (FAST) window.__pawai = { G: G, levels: LEVELS.length, lines: LINES, voClips: function () { return VO.count(); }, target: function () { return G.want ? G.want() : null; }, wrong: function () { return G.wrong ? G.wrong() : null; }, play: playLevel, map: showMap };
})();
</script>
</body>
</html>
