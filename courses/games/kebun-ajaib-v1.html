<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kebun Ajaib 🌻 · Learn with Adhi</title>
  <meta name="description" content="Kebun Ajaib — game kebun untuk Raya dan Rayyan. Tanam, siram, hitung, cari warna, susun pola, lalu kalahkan Awan Badai!">
  <meta name="theme-color" content="#7EC4F2">
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%232FA866"/><text y=".9em" font-size="64" x="16">🌻</text></svg>'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1A1614; --paper: #FBF4E6; --paper-2: #F4ECD8; --muted: #6B6259;
      --raya: #FF6FA5; --raya-d: #E04B86; --rayyan: #2FA866; --rayyan-d: #1F8A50;
      --gold: #FFC234; --sky: #4BA3F5; --pc: var(--raya); --pc-d: var(--raya-d);
      --fd: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
      --fb: 'Nunito', system-ui, sans-serif;
      --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { font-family: var(--fb); color: var(--ink); background: #BDE4F7; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body.p-rayyan { --pc: var(--rayyan); --pc-d: var(--rayyan-d); }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hidden { display: none !important; }

    /* ---------- HUD ---------- */
    .hud { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--st)) 10px 6px; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .ib { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 2.5px solid var(--ink); background: #fff; font-size: 20px; line-height: 1; display: grid; place-items: center; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
    .ib:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .ib.off { opacity: .55; }
    .hud-title { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: rgba(255,255,255,.9); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); font-family: var(--fd); font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; }
    .hud-title span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .hud-stars { flex: none; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: var(--gold); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); font-family: var(--fd); font-weight: 800; font-size: 18px; }

    /* ---------- screens ---------- */
    .screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; padding: calc(66px + var(--st)) 14px calc(14px + var(--sb)); pointer-events: none; overflow-y: auto; }
    .screen > * { pointer-events: auto; }
    .logo { font-family: var(--fd); font-weight: 800; font-size: clamp(44px, 11vw, 84px); line-height: .9; letter-spacing: -1.5px; text-align: center; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 5px 0 rgba(26,22,20,.28); margin-top: 2vh; animation: drop .9s var(--ease) both; }
    .logo span { color: var(--gold); display: inline-block; animation: wob 3s ease-in-out infinite; }
    .tag { margin-top: 10px; background: rgba(255,255,255,.9); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 900; font-size: 16px; box-shadow: 3px 3px 0 var(--ink); text-align: center; }
    .pick-row { display: flex; gap: 14px; margin-top: 3vh; width: 100%; max-width: 560px; justify-content: center; }
    .pick-card { flex: 1; max-width: 260px; border: 3px solid var(--ink); border-radius: 28px; padding: 16px 10px 14px; box-shadow: 5px 5px 0 var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .18s var(--ease), box-shadow .18s; animation: rise .8s var(--ease) both; }
    .pick-card:nth-child(2) { animation-delay: .12s; }
    .pick-card:hover { transform: translate(-3px, -4px); box-shadow: 8px 9px 0 var(--ink); }
    .pick-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    .pick-card.raya { background: linear-gradient(170deg, #FFE1EE, #FFB8D6); }
    .pick-card.rayyan { background: linear-gradient(170deg, #DDF6E5, #A8E6BE); }
    .pc-ava { width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 56px; position: relative; }
    .pc-ava i { position: absolute; right: -10px; bottom: -6px; font-style: normal; font-size: 36px; animation: sway 2.6s ease-in-out infinite; transform-origin: bottom center; }
    .pc-name { font-family: var(--fd); font-weight: 800; font-size: 30px; }
    .pc-stars { font-weight: 900; font-size: 15px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 12px; }

    .map-card { width: 100%; max-width: 640px; background: rgba(251,244,230,.95); border: 3px solid var(--ink); border-radius: 26px; box-shadow: 5px 5px 0 var(--ink); padding: 14px 14px 12px; animation: rise .6s var(--ease) both; }
    .map-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .map-head .ava { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #fff; border: 2.5px solid var(--ink); display: grid; place-items: center; font-size: 30px; }
    .map-head h2 { font-family: var(--fd); font-weight: 800; font-size: 24px; line-height: 1.05; }
    .map-head p { font-weight: 800; font-size: 13.5px; color: var(--muted); }
    .lvl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .lvl { position: relative; border: 2.5px solid var(--ink); border-radius: 18px; background: #fff; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; box-shadow: 3px 3px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
    .lvl:hover { transform: translate(-2px, -3px); box-shadow: 5px 6px 0 var(--ink); }
    .lvl:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .lvl .le { font-size: 36px; line-height: 1.1; }
    .lvl .ln { font-weight: 900; font-size: 13px; line-height: 1.1; text-align: center; min-height: 2.2em; display: flex; align-items: center; }
    .lvl .ls { font-size: 15px; letter-spacing: 1px; color: #D9D0C2; }
    .lvl .ls b { color: #FFB000; font-weight: 400; }
    .lvl.next { background: #FFF4CF; animation: glow 1.8s ease-in-out infinite; }
    .lvl.boss { background: linear-gradient(170deg, #EEE7FF, #fff); }
    .lvl .crown { position: absolute; top: -12px; right: -6px; font-size: 22px; transform: rotate(14deg); }
    .map-foot { display: flex; gap: 8px; margin-top: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .pill { font-weight: 900; font-size: 13px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px; }
    .ghost { font-weight: 900; font-size: 13px; background: transparent; border: 2px dashed var(--ink); border-radius: 999px; padding: 6px 12px; }

    /* ---------- play panel ---------- */
    .panel { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 16px)); }
    .panel.top { top: calc(60px + var(--st)); }
    .panel.bottom { bottom: calc(8px + var(--sb)); }
    .bubble { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 8px 8px 8px 10px; box-shadow: 4px 4px 0 var(--ink); animation: pop .45s var(--ease) both; }
    .mascot { flex: none; width: 50px; height: 50px; animation: bob 2.4s ease-in-out infinite; }
    .cue { flex: none; display: flex; align-items: center; justify-content: center; }
    .cue:empty { display: none; }
    .cue .sw { width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: inset -6px -6px 0 rgba(0,0,0,.12); animation: pulse 1.4s ease-in-out infinite; }
    .cue .em { font-size: 40px; line-height: 1; animation: pulse 1.4s ease-in-out infinite; }
    .cue .num { display: flex; flex-direction: column; align-items: center; background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 2px 8px; }
    .cue .num b { font-family: var(--fd); font-size: 32px; line-height: 1; }
    .cue .num span { font-size: 10px; letter-spacing: 1px; color: var(--pc-d); }
    .ptext { flex: 1; min-width: 0; font-weight: 800; font-size: 16.5px; line-height: 1.3; }
    .pstep { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .pstep i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #E2D8C6; border: 1.5px solid var(--ink); }
    .pstep i.on { background: var(--pc); }
    .hint { display: none; margin-top: 5px; font-size: 14px; font-weight: 800; color: #7A4300; background: #FFF0C2; border: 2px solid #F0C463; border-radius: 12px; padding: 5px 9px; }
    .hint.ok { color: #12663A; background: #DDF6E5; border-color: #8FD7A9; }
    .hint.show { display: block; animation: pop .35s var(--ease) both; }
    .say { flex: none; width: 50px; height: 50px; border-radius: 16px; border: 2.5px solid var(--ink); background: var(--gold); font-size: 22px; box-shadow: 3px 3px 0 var(--ink); }
    .say:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .eq { display: inline-block; font-family: var(--fd); font-size: 26px; letter-spacing: .5px; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 2px 10px; margin: 2px 0 4px; }
    .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; font-family: var(--fd); font-weight: 800; font-size: .92em; margin: 0 2px; }
    .frac b { border-bottom: 2.5px solid currentColor; padding: 0 3px 1px; }
    .frac i { font-style: normal; padding-top: 1px; }

    .controls { margin-top: 8px; }
    .controls:empty { display: none; }
    .ctl { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 8px; box-shadow: 4px 4px 0 var(--ink); display: grid; gap: 7px; animation: pop .45s .05s var(--ease) both; }
    .np-top { display: grid; grid-template-columns: 58px 1fr 104px; gap: 7px; }
    .np-disp { height: 54px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; font-family: var(--fd); font-weight: 800; font-size: 32px; display: flex; align-items: center; justify-content: center; letter-spacing: 1px; }
    .np-disp.empty { color: #CFC5B5; }
    .np-disp.bad { animation: shake .4s; }
    .np-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .k { height: 52px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; font-family: var(--fd); font-weight: 800; font-size: 25px; box-shadow: 2px 2px 0 var(--ink); }
    .k:active { transform: translate(2px, 2px); box-shadow: none; background: #FFF4CF; }
    .k.go { background: var(--pc); color: #fff; font-size: 19px; }
    .k.del { font-size: 22px; }
    .stp { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; }
    .stp .val { text-align: center; }
    .stp .val b { display: block; font-family: var(--fd); font-size: 36px; line-height: 1; }
    .stp .val span { font-size: 12px; font-weight: 900; color: var(--muted); }
    .act { height: 56px; border-radius: 16px; border: 3px solid var(--ink); background: var(--pc); color: #fff; font-weight: 900; font-size: 20px; box-shadow: 3px 3px 0 var(--ink); }
    .act:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .chs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ch { height: 70px; border: 2.5px solid var(--ink); border-radius: 16px; background: #fff; font-size: 26px; box-shadow: 3px 3px 0 var(--ink); }
    .ch:active { transform: translate(2px, 2px); box-shadow: none; }
    .ch.bad { animation: shake .4s; background: #FFE6E0; }

    @media (orientation: landscape) and (max-height: 560px) {
      .panel.bottom.side { left: auto; right: calc(8px + env(safe-area-inset-right, 0px)); transform: none; top: calc(58px + var(--st)); bottom: calc(8px + var(--sb)); width: min(340px, 44vw); overflow-y: auto; }
      .panel.bottom.side .bubble { align-items: flex-start; padding: 6px 6px 6px 9px; gap: 6px; }
      .panel.bottom.side .mascot { display: none; }
      .panel.bottom.side .ptext { font-size: 14px; line-height: 1.25; }
      .panel.bottom.side .hint { font-size: 12.5px; padding: 4px 7px; }
      .panel.bottom.side .say { width: 40px; height: 40px; font-size: 18px; }
      .panel.bottom.side .controls { margin-top: 6px; }
      .panel.bottom.side .ctl { padding: 6px; gap: 6px; }
      .panel.bottom.side .k { height: 40px; font-size: 22px; }
      .panel.bottom.side .np-disp { height: 42px; font-size: 26px; }
      .panel.bottom.side .np-top { grid-template-columns: 48px 1fr 88px; gap: 6px; }
      .panel.bottom.side .stp { grid-template-columns: 48px 1fr 48px; }
      .panel.bottom.side .stp .val b { font-size: 28px; }
      .panel.bottom.side .act { height: 46px; font-size: 18px; }
      .panel.bottom.side .ch { height: 54px; }
      .panel.top .bubble { padding: 4px 6px; }
      .panel.top .mascot { width: 40px; height: 40px; }
    }

    @media (max-width: 420px) {
      .mascot { width: 36px; height: 36px; }
      .say { width: 44px; height: 44px; }
      .ptext { font-size: 15.5px; }
      .bubble { gap: 7px; }
      .hud-title { font-size: 15px; padding: 0 9px; }
    }
    @media (orientation: landscape) and (max-height: 560px) {
      .screen { padding-top: calc(58px + var(--st)); }
      .logo { font-size: 44px; margin-top: 0; }
      .tag { margin-top: 6px; font-size: 14px; }
      .pick-row { margin-top: 10px; }
      .pick-card { flex-direction: row; justify-content: center; gap: 12px; padding: 10px 14px; }
      .pc-ava { width: 66px; height: 66px; font-size: 38px; }
      .pc-ava i { font-size: 26px; }
      .map-card { max-width: 860px; padding: 10px 12px; }
      .map-head { margin-bottom: 6px; }
      .lvl-grid { grid-template-columns: repeat(6, 1fr); gap: 8px; }
      .lvl .le { font-size: 30px; }
      .map-foot { margin-top: 8px; }
    }

    /* ---------- banner & result ---------- */
    .banner { position: fixed; left: 50%; top: 42%; z-index: 25; transform: translate(-50%, -50%); background: #fff; border: 3px solid var(--ink); border-radius: 24px; padding: 12px 24px; box-shadow: 5px 5px 0 var(--ink); text-align: center; pointer-events: none; animation: bannerIn 1.7s var(--ease) both; }
    .banner .be { font-size: 54px; line-height: 1; }
    .banner .bn { font-family: var(--fd); font-weight: 800; font-size: 28px; }
    .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(26,22,20,.28); }
    .mcard { width: min(420px, 100%); background: var(--paper); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 6px 6px 0 var(--ink); padding: 20px 16px 18px; text-align: center; animation: pop .55s var(--ease) both; }
    .mcard h3 { font-family: var(--fd); font-weight: 800; font-size: 30px; line-height: 1.05; }
    .mcard p { font-weight: 800; font-size: 15px; color: var(--muted); margin-top: 6px; }
    .rstars { display: flex; justify-content: center; gap: 6px; font-size: 56px; margin: 8px 0 2px; }
    .rstars span { filter: grayscale(1) opacity(.25); transform: scale(.6); transition: transform .5s var(--ease), filter .3s; }
    .rstars span.on { filter: none; transform: scale(1); }
    .mbtns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    .mb { min-width: 86px; height: 70px; padding: 0 12px; border-radius: 18px; border: 3px solid var(--ink); background: #fff; font-size: 28px; line-height: 1; box-shadow: 3px 3px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .mb small { font-size: 12px; font-weight: 900; }
    .mb.main { background: var(--pc); color: #fff; }
    .mb:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

    @keyframes drop { from { transform: translateY(-40px) scale(.9); opacity: 0; } }
    @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } }
    @keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }
    @keyframes wob { 50% { transform: rotate(-4deg) translateY(-3px); } }
    @keyframes sway { 50% { transform: rotate(-12deg); } }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    @keyframes glow { 50% { box-shadow: 3px 3px 0 var(--ink), 0 0 0 6px rgba(255,194,52,.55); } }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @keyframes bannerIn { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; } 28%, 78% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <canvas id="cv" role="img" aria-label="Kebun ajaib dengan bunga, kupu-kupu, dan langit"></canvas>

  <header class="hud">
    <button class="ib" id="backBtn" aria-label="Kembali">←</button>
    <div class="hud-title"><span id="hudIcon">🌻</span><span id="hudName">Kebun Ajaib</span></div>
    <div class="hud-stars" aria-label="Bintang">⭐ <span id="hudStars">0</span></div>
    <button class="ib" id="musicBtn" aria-label="Musik">🎵</button>
    <button class="ib" id="soundBtn" aria-label="Suara">🔊</button>
  </header>

  <section class="screen" id="pick">
    <h1 class="logo">Kebun <span>Ajaib</span></h1>
    <div class="tag">Siapa yang mau berkebun hari ini? 🌱</div>
    <div class="pick-row">
      <button class="pick-card raya" data-p="raya" aria-label="Main sebagai Raya">
        <div class="pc-ava">👧<i>🌷</i></div>
        <div class="pc-name">Raya</div>
        <div class="pc-stars">⭐ <span id="pkRaya">0</span></div>
      </button>
      <button class="pick-card rayyan" data-p="rayyan" aria-label="Main sebagai Rayyan">
        <div class="pc-ava">🧒<i>🌻</i></div>
        <div class="pc-name">Rayyan</div>
        <div class="pc-stars">⭐ <span id="pkRayyan">0</span></div>
      </button>
    </div>
  </section>

  <section class="screen hidden" id="map">
    <div class="map-card">
      <div class="map-head">
        <div class="ava" id="mapAva">👧</div>
        <div><h2 id="mapTitle">Kebun Raya</h2><p id="mapSub">Pilih permainan kebunmu!</p></div>
      </div>
      <div class="lvl-grid" id="lvlGrid"></div>
      <div class="map-foot">
        <div class="pill" id="mapPill">🌸 0 bunga di kebunmu</div>
        <button class="ghost" id="swapBtn">🔄 Ganti pemain</button>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="panel" aria-live="polite">
    <div class="bubble" id="bubble">
      <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
        <defs><clipPath id="beeBody"><ellipse cx="32" cy="38" rx="19" ry="15"/></clipPath></defs>
        <path d="M27 22 Q22 10 16 9 M37 22 Q42 10 48 9" stroke="#1A1614" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="16" cy="9" r="3" fill="#1A1614"/><circle cx="48" cy="9" r="3" fill="#1A1614"/>
        <ellipse cx="17" cy="27" rx="11" ry="8" fill="#EAF7FF" stroke="#1A1614" stroke-width="2" transform="rotate(-25 17 27)"/>
        <ellipse cx="47" cy="27" rx="11" ry="8" fill="#EAF7FF" stroke="#1A1614" stroke-width="2" transform="rotate(25 47 27)"/>
        <ellipse cx="32" cy="38" rx="19" ry="15" fill="#FFD23F"/>
        <g clip-path="url(#beeBody)"><rect x="12" y="40" width="40" height="5" fill="#1A1614"/><rect x="12" y="48" width="40" height="5" fill="#1A1614"/></g>
        <ellipse cx="32" cy="38" rx="19" ry="15" fill="none" stroke="#1A1614" stroke-width="2.5"/>

      { id: 'pagar', em: '🪵', name: 'Pagar Kebun', phase: 0.62, gen: genPagar },
      { id: 'badai', em: '⛈️', name: 'Awan Badai', phase: 0.4, gen: genBadai, boss: true }
    ];
    var PLAYERS = {
      raya: { key: 'rayaKebun', name: 'Raya', ava: '👧', icon: '🌷', hub: '../../raya.html', levels: RAYA_LEVELS, sub: 'Pilih permainan kebunmu!' },
      rayyan: { key: 'rayyanKebun', name: 'Rayyan', ava: '🧒', icon: '🌻', hub: '../../rayyan.html', levels: RAYYAN_LEVELS, sub: 'Selesaikan misi kebun, lalu kalahkan Awan Badai!' }
    };

    /* ============================================================
       SCREENS
       ============================================================ */
    function resetPlay() {
      G.run++; G.ents = []; G.tap = null; G.tapLock = false; G.layout = null; G.vis = null; G.task = null; G.lock = false; G.jar = null;
      TW.length = 0; PS.length = 0; RAIN.length = 0; V.rain = 0; V.stormTo = 0; V.rainbowTo = 0; V.lanternTo = 0; V.flash = 0;
      G.critters = G.critters.filter(function (c) { return c.mode === 'wander'; });
      try { speechSynthesis.cancel(); } catch (_) {}
    }
    function setHud() {
      if (G.pl) { $('hudIcon').textContent = G.pl.icon; $('hudStars').textContent = loadProg(G.pl.key).totalStars; }
      else { $('hudIcon').textContent = '🌻'; $('hudName').textContent = 'Kebun Ajaib'; $('hudStars').textContent = loadProg('rayaKebun').totalStars + loadProg('rayyanKebun').totalStars; }
    }
    function ambientFor(decor) {
      G.critters = []; G.ambient = true;
      addAmbient('kupu', 2 + (decor >= 4 ? 2 : 0)); if (decor >= 4) addAmbient('lebah', 2);
    }
    function showPick() {
      resetPlay(); G.mode = 'pick'; G.pk = null; G.pl = null; document.body.className = '';
      $('pick').classList.remove('hidden'); $('map').classList.add('hidden'); $('panel').classList.add('hidden'); $('result').classList.add('hidden');
      $('pkRaya').textContent = loadProg('rayaKebun').totalStars; $('pkRayyan').textContent = loadProg('rayyanKebun').totalStars;
      var dr = doneCount('raya'), dy = doneCount('rayyan');
      V.decor = Math.max(dr, dy, 3); V.gstars = Math.max(loadProg('rayaKebun').totalStars, loadProg('rayyanKebun').totalStars, 8);
      V.phaseTo = 0.15; ambientFor(V.decor); setHud(); computeStage();
    }
    function doneCount(pk) { var P = loadProg(PLAYERS[pk].key), n = 0; PLAYERS[pk].levels.forEach(function (L) { if ((P.progress[L.id] || {}).stars > 0) n++; }); return n; }
    function showMap(pk) {
      resetPlay(); G.mode = 'map'; G.pk = pk; G.pl = PLAYERS[pk]; document.body.className = 'p-' + pk;
      $('pick').classList.add('hidden'); $('map').classList.remove('hidden'); $('panel').classList.add('hidden'); $('result').classList.add('hidden');
      var P = loadProg(G.pl.key), done = doneCount(pk), next = -1;
      G.pl.levels.forEach(function (L, i) { if (next < 0 && !((P.progress[L.id] || {}).stars > 0)) next = i; });
      $('mapAva').textContent = G.pl.ava; $('mapTitle').textContent = 'Kebun ' + G.pl.name + ' ' + G.pl.icon; $('mapSub').textContent = G.pl.sub;
      $('mapPill').textContent = '🌸 ' + P.totalStars + ' bunga di kebunmu' + (done === 6 ? ' · 🏆 lengkap!' : '');
      $('lvlGrid').innerHTML = G.pl.levels.map(function (L, i) {
        var s = (P.progress[L.id] || {}).stars || 0, st = '';
        for (var k = 0; k < 3; k++) st += k < s ? '<b>★</b>' : '★';
        return '<button class="lvl' + (i === next ? ' next' : '') + (L.boss ? ' boss' : '') + '" data-i="' + i + '" aria-label="' + L.name + ', ' + s + ' bintang">' + (L.boss ? '<span class="crown">👑</span>' : '') + '<span class="le">' + L.em + '</span><span class="ln">' + L.name + '</span><span class="ls">' + st + '</span></button>';
      }).join('');
      $('lvlGrid').querySelectorAll('.lvl').forEach(function (b) { b.addEventListener('click', function () { AX.pop(); startLevel(+b.getAttribute('data-i')); }); });
      V.decor = done; V.gstars = P.totalStars; V.phaseTo = done >= 6 ? 0.82 : 0.12 + done * 0.04; V.rainbowTo = done >= 5 ? 0.6 : 0;
      ambientFor(done); setHud(); $('hudName').textContent = 'Kebun ' + G.pl.name; computeStage();
      if (pk === 'raya' && firstGesture) say('Halo Raya! Pilih permainan kebunmu!');
    }
    function startLevel(i) {
      resetPlay();
      var L = G.pl.levels[i]; G.mode = 'play'; G.lvl = i; var R = G.run;
      $('pick').classList.add('hidden'); $('map').classList.add('hidden'); $('result').classList.add('hidden');
      var p = $('panel'); p.classList.remove('hidden', 'top', 'bottom'); p.classList.add(G.pk === 'raya' ? 'top' : 'bottom'); updatePanelSide();
      $('controls').innerHTML = ''; $('cue').innerHTML = ''; $('pstep').innerHTML = ''; $('ptext').innerHTML = ''; $('phint').className = 'hint';
      $('hudName').textContent = L.name;
      V.phaseTo = L.phase; V.decor = 0;
      if (L.id === 'malam') { V.phase = Math.max(V.phase, 0.7); }
      computeStage();
      G.critters = []; if (L.id !== 'teman' && L.id !== 'malam' && L.id !== 'badai') addAmbient('kupu', 2);
      banner(L.em, L.name);
      later(function () {
        relayout();
        if (G.pk === 'raya') L.run(R); else runRayyan(L, R);
      }, 900);
    }
    function finishLevel(stars) {
      var L = G.pl.levels[G.lvl], before = doneCount(G.pk);
      saveStars(G.pl.key, L.id, stars);
      var after = doneCount(G.pk); setHud();
      G.tap = null; G.task = null; $('controls').innerHTML = '';
      AX.win(); petalRain(40);
      var m = $('result'); m.classList.remove('hidden');
      var spans = $('rStars').querySelectorAll('span'); spans.forEach(function (s) { s.classList.remove('on'); });
      spans.forEach(function (s, k) { if (k < stars) later(function () { s.classList.add('on'); AX.count(k + 3); }, 350 + k * 380); });
      var last = G.lvl === G.pl.levels.length - 1, complete = after === 6 && before < 6;
      $('resTitle').textContent = complete ? 'Kebunmu lengkap! 🏆' : stars === 3 ? 'Luar biasa!' : stars === 2 ? 'Hebat!' : 'Bagus!';
      $('resMsg').textContent = complete ? 'Semua permainan kebun sudah selesai. Lihat kebunmu jadi indah sekali!' : (G.pk === 'raya' ? 'Kebunmu makin indah! 🌸' : 'Misi selesai! Kebunmu makin indah. 🌸' + (stars < 3 ? ' Main lagi untuk 3 bintang!' : ''));
      var btns = '';
      if (!last) btns += '<button class="mb main" id="rNext" aria-label="Lanjut">▶️<small>Lanjut</small></button>';
      btns += '<button class="mb" id="rAgain" aria-label="Main lagi">🔁<small>Lagi</small></button><button class="mb" id="rMap" aria-label="Kebunku">🏡<small>Kebunku</small></button>';
      $('resBtns').innerHTML = btns;
      if ($('rNext')) $('rNext').addEventListener('click', function () { AX.pop(); startLevel(G.lvl + 1); });
      $('rAgain').addEventListener('click', function () { AX.pop(); startLevel(G.lvl); });
      $('rMap').addEventListener('click', function () { AX.pop(); showMap(G.pk); });
      if (G.pk === 'raya') say('Hebat, Raya! Kamu dapat ' + NUM[stars] + ' bintang!');
      else say(stars === 3 ? 'Luar biasa, Rayyan! Tiga bintang!' : 'Misi selesai! Kamu dapat ' + NUM[stars] + ' bintang.');
    }

    /* ============================================================
       HUD buttons
       ============================================================ */
    $('backBtn').addEventListener('click', function () {
      AX.tap();
      if (G.mode === 'play') showMap(G.pk);
      else if (G.mode === 'map') { if (G.startedFromHub) location.href = G.pl.hub; else showPick(); }
      else location.href = '../../kids.html';
    });
    $('swapBtn').addEventListener('click', function () { AX.tap(); G.startedFromHub = false; showPick(); });
    document.querySelectorAll('.pick-card').forEach(function (b) { b.addEventListener('click', function () { AX.pop(); showMap(b.getAttribute('data-p')); }); });
    $('sayBtn').addEventListener('click', function () { if (G.sayLine) say(G.sayLine); else if (G.task) say(G.task.text); });
    var sBtn = $('soundBtn'), mBtn = $('musicBtn');
    function syncBtns() { sBtn.textContent = AX.isOn() ? '🔊' : '🔇'; mBtn.classList.toggle('off', !AX.musicIsOn() || !AX.isOn()); mBtn.setAttribute('aria-pressed', AX.musicIsOn() ? 'true' : 'false'); sBtn.setAttribute('aria-pressed', AX.isOn() ? 'true' : 'false'); }
    sBtn.addEventListener('click', function () { AX.set(!AX.isOn()); if (!AX.isOn()) { try { speechSynthesis.cancel(); } catch (_) {} } syncBtns(); });
    mBtn.addEventListener('click', function () { AX.setMusic(!AX.musicIsOn()); syncBtns(); });
    syncBtns();

    /* ============================================================
       MAIN LOOP
       ============================================================ */
    function update(dt) {
      V.phase += (V.phaseTo - V.phase) * Math.min(1, dt * 1.2);
      V.storm += (V.stormTo - V.storm) * Math.min(1, dt * 1.5);
      V.rainbow += (V.rainbowTo - V.rainbow) * Math.min(1, dt * 1.2);
      V.lantern += (V.lanternTo - V.lantern) * Math.min(1, dt * 2);
      updTweens(dt); updParts(dt); updCritters(dt);
      for (var i = 0; i < G.ents.length; i++) { var e = G.ents[i]; if (e.upd) e.upd(dt); if (e.pour && e.canT > 0.15 && e.canT < 0.85 && Math.random() < 0.7) drops(e.x - e.s * 0.1, e.y - e.s * 2.0, 1); }
    }
    function render(dt) {
      cx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
      var pal = palette();
      drawSky(pal); drawSunMoon(pal); drawClouds(pal, dt); drawRainbow(); drawHills(pal); drawBackTrees(pal); drawFenceBack(pal); drawGround(pal);
      if (G.mode !== 'play') drawGarden(pal);
      if (G.mode === 'play') { if (G.vis) G.vis.draw(dt); drawEnts(); }
      drawCritters(); drawLanterns(pal); drawBlades(pal);
      if (pal.night > 0.01) { cx.fillStyle = 'rgba(12,18,58,' + (pal.night * 0.3) + ')'; cx.fillRect(0, 0, V.w, V.h); }
      if (pal.night > 0.5 && G.mode !== 'play') {
        for (var i = 0; i < BG.ffs.length; i++) { var f = BG.ffs[i], x = (f.x + Math.sin(V.t * f.sp + f.ph) * 0.05) * V.w, y = V.hz + (f.y + Math.cos(V.t * f.sp * 1.3 + f.ph) * 0.05) * (V.h - V.hz); glow(x, y, 16, '#FFF27A', (pal.night - 0.5) * 1.6 * (0.5 + 0.5 * Math.sin(V.t * 3 + f.ph))); }
      }
      flushGlows(); drawParts();
    }
    var last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (document.hidden) return;
      V.t += dt;
      try { update(dt); render(dt); } catch (err) { if (!frame.err) { frame.err = true; console.error(err); } }
    }
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) { try { new ResizeObserver(function () { if (G.mode === 'play') relayout(); }).observe($('panel')); } catch (_) {} }

    resize();
    var qp = (location.search.match(/[?&]p=(raya|rayyan)\b/) || [])[1];
    if (qp) { G.startedFromHub = true; showMap(qp); } else showPick();
    requestAnimationFrame(frame);

    /* test hook (used by the headless play-through; harmless in production) */
    window.__kebun = { G: G, V: V, PLAYERS: PLAYERS, showMap: showMap, startLevel: startLevel, entHit: entHit, entCenter: entCenter, fieldSpots: fieldSpots };
  })();
  </script>
</body>
</html>
